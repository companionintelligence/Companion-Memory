services:
  api:
    image: ci/api
    env_file:
      - .env
    environment:
      DATABASE_HOST: database
      OBJECT_STORE_URL: http://object-store:9000
      OLLAMA_HOST: http://host.docker.internal:11434
      # OpenAI-compatible chat backend (Hub-injected on managed deploys). When
      # unset, the API falls back to native Ollama on OLLAMA_HOST.
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DEFAULT_CHAT_MODEL: ${LLM_DEFAULT_CHAT_MODEL:-}
      # Embeddings stay on native Ollama even when chat runs on vLLM/Lemonade;
      # falls back to OLLAMA_HOST when unset.
      OLLAMA_EMBED_HOST: ${OLLAMA_EMBED_HOST:-}
      HBPE_HOST: http://hbpe-service:8002
      # `api` exists only in the staging/production overrides — there is no base
      # definition to inherit this from, and `env_file: .env` above does not
      # help because the code reads SENTRY_DSN, not SENTRY_DSN_API. Without it
      # staging reports from hbpe and summary but silently not from the API.
      SENTRY_DSN: ${SENTRY_DSN_API:-}
      SENTRY_ENV: ${SENTRY_ENV:-}
      CI_TELEMETRY: ${CI_TELEMETRY:-}
      CI_LOCAL_ONLY: ${CI_LOCAL_ONLY:-}
      CI_SERVER_VERSION: ${CI_SERVER_VERSION:-}
    networks:
      - ci
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migrate-database:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    restart: unless-stopped
    profiles: [ "staging" ]

  database:
    environment:
      PASSWORD: ${DATABASE_ADMIN_PASSWORD}
    ports:
      - 5432:5432

  gateway:
    image: ci/gateway
    ports:
      - 8642:8642
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ci
    depends_on:
      api:
        condition: service_healthy
      object-store:
        condition: service_healthy
    restart: unless-stopped
    profiles: [ "staging" ]

  hbpe-service:
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      API_JWT_SECRET: ${AUTH_TOKEN_SECRET}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video

  object-store:
    environment:
      USERNAME: ${OBJECT_STORE_USERNAME}
      PASSWORD: ${OBJECT_STORE_PASSWORD}
    ports:
      - 9000:9000

  orchestrator:
    environment:
      DATABASE_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/local.yaml
    volumes:
      - ./infrastructure/orchestrator/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/local.yaml:ro

  summary-service:
    # Pass the shared LLM config from .env explicitly (not via env_file) so
    # host-oriented vars like DATABASE_HOST=localhost don't leak into the container.
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      LLM_API_BASE: ${LLM_API_BASE:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      # Unset by default: the summary service uses the Hub-injected model, or
      # discovers a served model from LLM_API_BASE/models at startup.
      LLM_DEFAULT_CHAT_MODEL: ${LLM_DEFAULT_CHAT_MODEL:-}
      SUMMARY_OUTPUT_MODE: ${SUMMARY_OUTPUT_MODE:-native}
      SUMMARY_OUTPUT_RETRIES: ${SUMMARY_OUTPUT_RETRIES:-3}

  #############
  # EPHEMERAL #
  #############

  migrate-database:
    image: ci/api
    env_file:
      - .env
    environment:
      DATABASE_HOST: database
    networks:
      - ci
    command: ["yarn", "migrate"]
    restart: "no"
    depends_on:
      setup-database:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    profiles: [ "staging" ]

  setup-database:
    environment:
      ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD}
      COMPANION_PASSWORD: ${DATABASE_PASSWORD}
      ORCHESTRATOR_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}

  setup-orchestrator:
    environment:
      DATABASE_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}

volumes:
  db-data:
    name: ${COMPOSE_PROJECT_NAME}-staging-db-data
  object-data:
    name: ${COMPOSE_PROJECT_NAME}-staging-object-data
