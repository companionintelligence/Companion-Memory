name: CI

# GATED TO MANUAL. Every trigger except workflow_dispatch was removed so this
# workflow no longer runs on push, pull_request or a schedule — CI silence here
# means "nobody dispatched it", NOT "everything passed". Run it deliberately:
#   gh workflow run <file> --ref <branch>
# Restore a trigger by re-adding it to the `on:` block below.
#
# The cheap half of this file — the `lint` and `typecheck` lanes, identically
# defined — DOES run on every PR, from `pr-gate.yml`. It lives in its own file
# so the cost decision that gated this one stays revertible in a single move.
# `pr-gate.yml` also carries a copy of `test-frontend` (without `--coverage`,
# since only this file uploads the report) plus two jobs with no twin here: a
# `build-web` PWA guard and a third `Type check packages` lane over
# `frontend/packages/*`. Those two are deliberately NOT mirrored here:
# `publish.yml`'s release gate reads whether THIS workflow concluded success, so
# every lane added here is a lane that can block a release — mirroring one is a
# release decision to take deliberately, once it has a green history on `main`.
# The remaining expensive lanes here (`test`, `python`, `imports`, `graphql`)
# are dispatch-only.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: node:22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Cache node modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run backend tests
    needs: install
    runs-on: ubuntu-latest
    # Headroom for checkout + install + the test step's own ceiling below. The
    # meaningful limit is on the step, not here: a JOB timeout cancels the whole
    # job, which is reported as `cancelled` (and rendered as "fail" by
    # `gh pr checks`) with no indication of which step ran out of time, and it
    # skips every remaining step, so nothing can report on the way out. A STEP
    # timeout fails that step and lets the job finish normally.
    #
    # Raised from 15 when the Postgres service below landed: the job now also
    # pays for a client install, the role/extension bootstrap and ~300
    # migrations (~2 min), and the suite itself grew by the 57 DB-backed files
    # that used to skip.
    timeout-minutes: 35
    container:
      image: node:22
    services:
      # The appliance's OWN Postgres image, not a stock one: the migrations need
      # TimescaleDB, PostGIS and pgvector together, and
      # 20260611030000_use_native_uuidv7 calls PG18's native `uuidv7()`. No
      # public image carries that combination. This package is PUBLIC, so the
      # pull needs no credentials.
      #
      # Same image and same pin as `consent-path-gate.yml` — a floating tag
      # would let an unrelated release change what the suite runs against,
      # silently. Bump the two together:
      #   gh api orgs/companionintelligence/packages/container/companion%2Fdatabase/versions \
      #     --jq '.[0].metadata.container.tags'
      postgres:
        image: ghcr.io/companionintelligence/companion/database:2026.8.20
        env:
          # Throwaway credentials for an ephemeral CI database that is destroyed
          # with the job. Not a secret, and deliberately not the dev values.
          PASSWORD: ci_test_admin_pw
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # Note the host: unlike `consent-path-gate.yml`, this job runs INSIDE a
      # container, so the service is reached by its label on the job's Docker
      # network (`postgres`) rather than through a published port on the runner.
      # That is also why there is no `ports:` mapping above — nothing on the
      # runner host needs to reach it.
      #
      # `DATABASE_URL` is what `bin/dbmate.js` reads, so the migrations and the
      # suites cannot disagree about which database this is.
      DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      PGPASSWORD: ci_test_admin_pw
      # EVERY ONE of the sixteen per-suite variables is enumerated below, and
      # that is NOT redundant with `DATABASE_URL` above. Thirteen of the sixteen
      # resolve through `domains/__tests__/support/databaseConnection.ts`, which
      # checks the suite's own `<DOMAIN>_TEST_DATABASE_URL` FIRST and falls
      # through to `DATABASE_URL` — for those, these lines are a restatement of
      # the fallback. The other three read their variable DIRECTLY off
      # `process.env` with no fallback at all, and gate `describe` on it:
      #   PLANNING_ — planning/services/__tests__/TaskService.tenancy.integration.test.ts
      #   NOTES_    — notes/__tests__/NoteCapture.integration.spec.ts
      #   SCHEDULE_ — schedule/services/__tests__/CandidateService.lifecycle.integration.test.ts
      #               (it chains `SCHEDULE_ ?? PLANNING_`, so PLANNING_ alone
      #               would in fact cover it — set anyway, so nobody has to know)
      # With only `DATABASE_URL` set those four `describe` blocks resolve to
      # `describe.skip` and jest still exits 0 — the green-but-tested-nothing
      # outcome this job exists to end. The list is enumerated in full rather
      # than trimmed to the three so that a new suite written in either style is
      # covered, and so nobody has to know which style each file uses. Keep it
      # in step with the sixteen named in
      # `docs/architecture/test-strategy.md` §3.
      ASKS_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      BROWSER_ACTIVITY_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      CONNECTIONS_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      EVENTS_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      IMPORT_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      MEMORY_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      NOTES_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      PEERS_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      PERSISTENCE_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      PERSONALIZATION_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      PIPELINE_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      PLANNING_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      PORTABILITY_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      SCHEDULE_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      SEARCH_INGRESS_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      SEARCH_NEXT_TEST_DATABASE_URL: postgres://companion:ci_test_app_pw@postgres:5432/companion?sslmode=disable
      # DATABASE_ADMIN_PASSWORD is deliberately NOT set, so this is not an
      # oversight to "fix" by adding it. SEVEN further suites gate on
      # `scratchDatabaseAvailability()` (`domains/__tests__/support/scratchDatabase.ts`)
      # — `user/…/AccountPurgeService.integration.spec.ts`, the four `etl/…`
      # `ConnectionSyncJobService`/`SyncOrchestrator` specs,
      # `pipeline/__tests__/enrichmentLoop.integration.spec.ts` and
      # `domains/__tests__/support/__tests__/scratchDatabase.spec.ts` — and each
      # one CREATEs a database of its own and replays every migration into it —
      # roughly another two minutes apiece on top of the run below, against a
      # 20-minute step ceiling. THEY STILL SKIP IN THIS JOB. That is visible,
      # not disguised: each prints `SKIPPED — no administrative database
      # connection configured …` naming this variable. Turning them on is a
      # separate cost decision (and needs the step timeout revisited), not a
      # side effect of this one.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Everything below is what turns 57 silently-skipped suites into suites
      # that run. Without a database they all resolve `describe.skip` and jest
      # still exits 0 — a green run that executed none of the integration
      # coverage. `docs/architecture/test-strategy.md` §3.1 calls this "a skip is
      # not a pass" and names this job as its standing example.
      #
      # This is what the `ci/setup-database` init container does in compose,
      # reduced to what a test database needs: the least-privilege application
      # role, its database, and the extensions the migrations assume are already
      # there. No migration issues `CREATE EXTENSION` for these — see
      # 20250528215624_enable_pgvector, a no-op that exists to document exactly
      # that — so a database that skips this step fails on a type it has never
      # heard of. Keep the list in step with
      # `infrastructure/setup-database/entrypoint.sh`.
      #
      # `apt-get` needs no sudo: the node:22 container runs as root.
      #
      # `shell: bash` is load-bearing. This job runs in the `node:22` container,
      # where the default shell for a `run:` block is `sh -e` — that is dash,
      # which has no `set -o pipefail`. Without this line the step died on its
      # very first command with `set: Illegal option -o pipefail` (exit 2)
      # before creating the role, so the whole backend lane had never passed
      # since the Postgres service landed: run 34184853130, 2026-09-08. The
      # image ships bash, so ask for it rather than dropping `pipefail`.
      #
      # Same defect and same fix as `pr-gate.yml`'s plist guard. If you add a
      # `run:` block to a containerized job here, either keep it POSIX or say
      # `shell: bash`.
      - name: Bootstrap role, database and extensions
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client
          psql -h postgres -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE companion WITH LOGIN PASSWORD 'ci_test_app_pw';" \
            -c "CREATE DATABASE companion OWNER companion;"
          for ext in timescaledb postgis vector pg_stat_statements btree_gist; do
            psql -h postgres -U postgres -d companion -v ON_ERROR_STOP=1 \
              -c "CREATE EXTENSION IF NOT EXISTS \"$ext\";"
          done

      # "Port open" and "schema correct" are different questions, and the suites
      # only probe the first (test-strategy.md §3.1, trap 2). An unmigrated
      # database therefore does not skip — it fails every DB-backed test with
      # `relation "ci.…" does not exist`, which reads like a defect in the change
      # under test. `migrate` also runs check-migration-versions.js, so a
      # timestamp collision fails here rather than inside the production image.
      - name: Run migrations
        run: yarn workspace @ci/be-api migrate

      # Several times the measured cost: ~400 files in about 2.5 minutes in a
      # two-core container, so a few minutes on a runner whose cores are slower.
      # The ceiling was ten while every DB-backed suite skipped; it is twenty now
      # that the 57 of them actually connect, run migrations-backed queries and
      # truncate between cases. Anything approaching that still means the suite
      # has stopped making progress rather than merely got slower, and failing
      # the step says so while leaving the job alive to finish and report.
      #
      # What used to sit here was a `--detectOpenHandles --runInBand` step meant
      # to diagnose the hang on failure. It never once ran — the job timeout
      # cancelled the job before any `if: failure()` step could start — and it
      # could not have helped if it had: both of those flags force jest to run
      # in the main process, which is precisely the configuration that hangs.
      # See the note in backend/apps/api/jest.config.mjs.
      #
      # `--coverage` is load-bearing, not a report nobody reads. The scoped
      # ratchet in jest.config.mjs (`./src/domains/planning/`: statements 88 /
      # branches 76 / functions 76 / lines 90) is only evaluated when coverage
      # is collected, so without the flag the one floor this repo has was
      # enforced in NO workflow — a threshold that cannot fail is the same
      # false comfort as no threshold. The frontend lane below has always run
      # with it. This is the right job for it: the floor is set just under what
      # planning reaches with no database, and the env block above gives the
      # DB-backed planning suites a real connection, so the number measured
      # here is at or above the one the floor was calibrated against.
      - name: Run backend API tests
        timeout-minutes: 20
        run: yarn workspace @ci/be-api test --coverage

  test-frontend:
    name: Run frontend tests
    needs: install
    runs-on: ubuntu-latest
    # Headroom over the step ceiling below, the same job-vs-step split the
    # backend `test` job above explains at length. This job had NO ceiling of
    # either kind while it was `continue-on-error` and therefore harmless; now
    # that it is blocking and `publish.yml` gates on this workflow, a hung suite
    # would sit on GitHub's 360-minute default and hold a release for six hours
    # before anyone saw a result.
    timeout-minutes: 50
    container:
      image: node:22
    # This job is BLOCKING, and that is load-bearing rather than tidiness.
    # `publish.yml`'s `verify-ci-passed` gate asks GitHub one question — did the
    # latest `ci.yml` run for this SHA conclude `success` — and a job-level
    # `continue-on-error: true` makes the *run* succeed no matter how the job
    # ends. This job carried that line, so a fully red frontend suite (381 files
    # / 3,714 cases when measured on 2026-09-07) satisfied the release gate and
    # an image could ship on top of it. Nothing else in the pipeline looks at the
    # frontend result, so if this job cannot fail the workflow, the suite cannot
    # stop a release. Do not re-add the line; if the
    # suite is flaky, fix the flake (the 5s-timeout flake that motivated the
    # original "while the suite stabilizes" note is fixed in
    # frontend/apps/web/vitest.config.ts).
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 40 minutes, and the number is measured rather than guessed. `pr-gate.yml`
      # ran this suite unsharded on a hosted runner once (run 34180056712,
      # 2026-09-08) and its 20-minute ceiling killed it mid-run — not a test
      # failure, just a suite that does not fit a 2-core runner in one job.
      # Constrained locally to two workers to approximate that runner it is 355s
      # wall / 14m28s CPU, dominated by `collect` (311s of module transform and
      # load) rather than by the 79s the assertions cost.
      #
      # This copy is SLOWER than the one that died, because `--coverage` adds v8
      # instrumentation and the html/lcov reporters over the widened include set
      # (src plus every frontend/packages/*/src). It is not sharded, unlike the
      # gate copy: this workflow is dispatch-only so wall clock is cheap here,
      # and a single job keeps one coverage report instead of needing a merge
      # step. The ceiling is a hang detector, not a performance budget.
      #
      # Getting this wrong is expensive now: `publish.yml`'s release gate reads
      # whether THIS workflow concluded success, so a timeout here blocks
      # releases. Failing the STEP rather than the job leaves `Upload coverage
      # report` below alive to say what it got.
      - name: Run frontend unit/component tests
        timeout-minutes: 40
        run: yarn workspace @ci/fe-web test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fe-coverage
          path: frontend/apps/web/coverage
          retention-days: 7
          if-no-files-found: ignore

  typecheck:
    name: Type check ${{ matrix.name }}
    needs: install
    runs-on: ubuntu-latest
    container:
      image: node:22
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            command: yarn workspace @ci/be-api typecheck
          - name: frontend
            command: yarn workspace @ci/fe-web typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check ${{ matrix.name }}
        run: ${{ matrix.command }}

  lint:
    name: Lint ${{ matrix.name }}
    needs: install
    runs-on: ubuntu-latest
    container:
      image: node:22
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            command: yarn lint
          - name: backend
            command: yarn workspace @ci/be-api lint
          - name: frontend
            command: yarn workspace @ci/fe-web lint
          - name: format
            command: yarn format:check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint ${{ matrix.name }}
        run: ${{ matrix.command }}

  python:
    name: Check Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --locked fails when uv.lock does not match the manifests, which is
      # the guard against a member changing its dependencies without
      # relocking. Regenerate with `uv lock`; never hand-merge the lockfile.
      - name: Install workspace
        run: uv sync --all-packages --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

  imports:
    name: Check backend imports
    needs: install
    runs-on: ubuntu-latest
    container:
      image: node:22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check backend imports
        run: yarn workspace @ci/be-api depcheck

  graphql:
    name: Check GraphQL schema and types
    needs: install
    runs-on: ubuntu-latest
    container:
      image: node:22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GraphQL schema
        run: yarn workspace @ci/be-api graphql:generate

      - name: Generate GraphQL frontend types
        run: yarn workspace @ci/fe-web graphql:generate

      - name: Check for changes
        run: |
          git config --global --add safe.directory '*'
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: GraphQL schema or types are out of sync."
            echo "Please run 'make graphql' locally and commit the changes."
            git diff
            exit 1
          fi
