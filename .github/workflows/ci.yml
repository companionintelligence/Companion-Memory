name: CI

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches:
#       - main
#   pull_request:
#     branches:
#       - main
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: node:22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Cache node modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run backend tests
    needs: install
    runs-on: ubuntu-latest
    container:
      image: node:22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run backend API tests
        run: yarn workspace @ci/be-api test

  test-frontend:
    name: Run frontend tests
    needs: install
    runs-on: ubuntu-latest
    container:
      image: node:22
    # Non-blocking while the suite stabilizes: the job runs and reports, but a
    # failure does not fail the workflow. Promote to blocking (drop this line and
    # add the check to branch protection) once coverage is established.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run frontend unit/component tests
        run: yarn workspace @ci/fe-web test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fe-coverage
          path: frontend/apps/web/coverage
          retention-days: 7
          if-no-files-found: ignore

  typecheck:
    name: Type check ${{ matrix.name }}
    needs: install
    runs-on: ubuntu-latest
    container:
      image: node:22
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            command: yarn workspace @ci/be-api typecheck
          - name: frontend
            command: yarn workspace @ci/fe-web typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check ${{ matrix.name }}
        run: ${{ matrix.command }}

  lint:
    name: Lint ${{ matrix.name }}
    needs: install
    runs-on: ubuntu-latest
    container:
      image: node:22
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            command: yarn lint
          - name: backend
            command: yarn workspace @ci/be-api lint
          - name: frontend
            command: yarn workspace @ci/fe-web lint
          - name: format
            command: yarn format:check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint ${{ matrix.name }}
        run: ${{ matrix.command }}

  imports:
    name: Check backend imports
    needs: install
    runs-on: ubuntu-latest
    container:
      image: node:22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check backend imports
        run: yarn workspace @ci/be-api depcheck

  graphql:
    name: Check GraphQL schema and types
    needs: install
    runs-on: ubuntu-latest
    container:
      image: node:22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GraphQL schema
        run: yarn workspace @ci/be-api graphql:generate

      - name: Generate GraphQL frontend types
        run: yarn workspace @ci/fe-web graphql:generate

      - name: Check for changes
        run: |
          git config --global --add safe.directory '*'
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: GraphQL schema or types are out of sync."
            echo "Please run 'make graphql' locally and commit the changes."
            git diff
            exit 1
          fi
