# Secret Scanning — detects committed credentials with gitleaks.
# Recurring secret-scan evidence for CASA Tier 2 / SOC 2.
# Especially relevant for CI-Server: this repo has previously committed secrets
# (see issue #1620). Runs on every push and pull request.
name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least-privilege: gitleaks only needs to read repo contents.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    # non-blocking until GitHub Advanced Security / GITLEAKS_LICENSE is enabled on this repo
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so pushes are scanned across the whole commit range,
          # not just the tip commit.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
