#       platform:
#         type: string
#         default: ios
#     # The secrets this workflow reads. A lane whose secrets are all absent is skipped.
#     secrets:
#       APPSTORE_ISSUER_ID:
#         required: false
#       APPSTORE_KEY_ID:
#         required: false
#       APPSTORE_PRIVATE_KEY:
#         required: false
#       APPLE_TEAM_ID:
#         required: false
#       IOS_DIST_CERT_P12_BASE64:
#         required: false
#       IOS_DIST_CERT_PASSWORD:
#         required: false
#       IOS_PROVISIONING_PROFILE_BASE64:
#         required: false
#       IOS_EXTENSION_PROVISIONING_PROFILE_BASE64:
#         required: false
#       IOS_WIDGETS_PROVISIONING_PROFILE_BASE64:
#         required: false
#       CI_BROWSER_EXTENSION_DEPLOY_KEY:
#         required: false
#       ANDROID_KEYSTORE_BASE64:
#         required: false
#       ANDROID_KEYSTORE_PASSWORD:
#         required: false
#       ANDROID_KEY_ALIAS:
#         required: false
#       ANDROID_KEY_PASSWORD:
#         required: false
#       PLAY_SERVICE_ACCOUNT_JSON:
#         required: false
#     outputs:
#       build_number:
#         description: 'The store build number both lanes used'
#         value: ${{ jobs.version.outputs.code }}
#       ios_ran:
#         description: "'true' when the iOS lane had its secrets and was asked for"
#         value: ${{ jobs.version.outputs.run_ios }}
#       android_ran:
#         description: "'true' when the Android lane had its secrets and was asked for"
#         value: ${{ jobs.version.outputs.run_android }}
#
# # The root install pulls the private @companionintelligence/tokens package from GitHub
# # Packages; .yarnrc.yml authenticates with ${NODE_AUTH_TOKEN}. Without `packages: read`
# # the job's GITHUB_TOKEN cannot read it and every install fails as an anonymous user.
# <<< ci-local:gated
on:
  workflow_dispatch:
    inputs:
      dry_run:
        # Not "no store contact": iOS validates only, Android commits a Play *draft*
        # (no rollout, but the version code is spent). See the header note on `dry_run`.
        description: 'Build and sign; release to nobody (iOS validates only, Android commits a Play draft)'
        type: boolean
        default: true
      version_name:
        description: 'Marketing version (e.g. 1.0.0). Defaults to the tag or 0.1.0.'
        type: string
        required: false
      platform:
        description: 'Which store lane to run'
        type: choice
        options:
          - ios
          - android
          - both
        default: ios
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: true
      version_name:
        type: string
        required: false
      platform:
        type: string
        default: ios
    # The secrets this workflow reads. A lane whose secrets are all absent is skipped.
    secrets:
      APPSTORE_ISSUER_ID:
        required: false
      APPSTORE_KEY_ID:
        required: false
      APPSTORE_PRIVATE_KEY:
        required: false
      APPLE_TEAM_ID:
        required: false
      IOS_DIST_CERT_P12_BASE64:
        required: false
      IOS_DIST_CERT_PASSWORD:
        required: false
      IOS_PROVISIONING_PROFILE_BASE64:
        required: false
      IOS_EXTENSION_PROVISIONING_PROFILE_BASE64:
        required: false
      IOS_WIDGETS_PROVISIONING_PROFILE_BASE64:
        required: false
      CI_BROWSER_EXTENSION_DEPLOY_KEY:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false
    outputs:
      build_number:
        description: 'The store build number both lanes used'
        value: ${{ jobs.version.outputs.code }}
      ios_ran:
        description: "'true' when the iOS lane had its secrets and was asked for"
        value: ${{ jobs.version.outputs.run_ios }}
      android_ran:
        description: "'true' when the Android lane had its secrets and was asked for"
        value: ${{ jobs.version.outputs.run_android }}

# The root install pulls the private @companionintelligence/tokens package from GitHub
# Packages; .yarnrc.yml authenticates with ${NODE_AUTH_TOKEN}. Without `packages: read`
# the job's GITHUB_TOKEN cannot read it and every install fails as an anonymous user.
permissions:
  contents: read
  packages: read

# Per platform, so release.yml's separate iOS and Android calls on the same tag run
# side by side instead of queueing behind each other.
concurrency:
  group: mobile-release-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  CI_BROWSER_EXTENSION_VERSION: '1.6.2'
  VITE_DISABLE_PWA: 'true'
  # Phone cloud-connect talks to production Portal, not the internal Hub appliance host.
  VITE_CI_CLOUD_URL: 'https://hub.ci.computer'
  # The store build number is the count of whole minutes from BUILD_NUMBER_EPOCH to the
  # moment the `version` job runs (about 460,000 in November 2026). Apple and Google both
  # permanently reject a build/version code they have already seen, and Play won't serve
  # a lower code over a higher one, so the number must only ever go up, whichever
  # workflow starts the build.
  #
  # It used to be github.run_number + 1000 (builds 1001 to 1026 went out that way). That
  # stopped being safe once release.yml began calling this workflow: inside a called
  # workflow, run_number is the CALLER's counter, so release.yml's run 1 would have built
  # 1001 again. Minutes keep going up for dispatches and release.yml alike. Re-running
  # failed jobs reuses the version job's number, as run_number did; and two runs started
  # in the same minute would collide, which nobody does on purpose.
  # NEVER MOVE THIS LATER: an epoch after this one turns the next number into a lower one.
  BUILD_NUMBER_EPOCH: '1767225600' # 2026-01-01T00:00:00Z

jobs:
  # Resolve the version once so both stores get identical numbers for the same run.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      dry_run: ${{ steps.v.outputs.dry_run }}
      run_ios: ${{ steps.v.outputs.run_ios }}
      run_android: ${{ steps.v.outputs.run_android }}
    steps:
      # Gate on EVERY secret a lane consumes, not a sample of them. The old gate checked
      # only three of the seven secrets then required, so a run missing APPLE_TEAM_ID or
      # APPSTORE_PRIVATE_KEY sailed through, spent ~40 minutes on install + archive, and
      # only then died at the signing or upload step, with the build number already spent.
      # A keystore with no ANDROID_KEY_ALIAS likewise failed deep inside `gradlew
      # bundleRelease`. All present: the lane runs. None present: its job is skipped (wiring
      # one store first). Some but not all: this job fails and names what is missing, but
      # only when the run asked for that lane.
      - name: Check signing secrets
        id: secrets
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGETS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 }}
          CI_BROWSER_EXTENSION_DEPLOY_KEY: ${{ secrets.CI_BROWSER_EXTENSION_DEPLOY_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -uo pipefail
          # Writes <lane>=true|false|partial and <lane>_missing. Whether a partial lane is
          # an error depends on whether this run asked for it, which the next step knows.
          check_lane() {
            local output="$1"; shift
            local found=0 missing=""
            for var in "$@"; do
              if [ -n "${!var:-}" ]; then found=$((found + 1)); else missing="${missing} ${var}"; fi
            done
            if [ "$found" -eq "$#" ]; then state=true
            elif [ "$found" -eq 0 ]; then state=false
            else state=partial
            fi
            echo "${output}=${state}" >> "$GITHUB_OUTPUT"
            echo "${output}_missing=${missing# }" >> "$GITHUB_OUTPUT"
          }
          check_lane ios APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY APPLE_TEAM_ID \
            IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 \
            IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 \
            CI_BROWSER_EXTENSION_DEPLOY_KEY
          check_lane android ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON

      - id: v
        env:
          IOS_SECRETS: ${{ steps.secrets.outputs.ios }}
          IOS_MISSING: ${{ steps.secrets.outputs.ios_missing }}
          ANDROID_SECRETS: ${{ steps.secrets.outputs.android }}
          ANDROID_MISSING: ${{ steps.secrets.outputs.android_missing }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version_name }}" ]; then
            NAME="${{ inputs.version_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/ios-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/ios-v}"
          elif [[ "${GITHUB_REF}" == refs/tags/android-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/android-v}"
          elif [[ "${GITHUB_REF}" == refs/tags/mobile-release-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/mobile-release-v}"
          else
            NAME="0.1.0"
          fi
          # Minutes since BUILD_NUMBER_EPOCH; see that env entry for why it isn't
          # run_number any more.
          CODE=$(( ($(date -u +%s) - BUILD_NUMBER_EPOCH) / 60 ))
          echo "name=${NAME}"                        >> "$GITHUB_OUTPUT"
          echo "code=${CODE}"                        >> "$GITHUB_OUTPUT"
          # A tag *push* always submitted, back when a tag push could trigger
          # this workflow at all — it's `workflow_dispatch`-only since
          # 2026-09-17 (docs/CI.md), so `GITHUB_EVENT_NAME` can never be
          # `push` here any more and the branch below is dead. Left in place
          # rather than deleted, so `ci-local restore` brings back the exact
          # behavior a tag push used to have if this is ever un-gated, not a
          # silently different one. Every real run today takes the `else`.
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi
          # Which lanes to run: tag prefix, or the dispatch choice (default ios).
          PLATFORM="${{ inputs.platform }}"
          RUN_IOS=false
          RUN_ANDROID=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            case "${GITHUB_REF}" in
              refs/tags/ios-v*) RUN_IOS=true ;;
              refs/tags/android-v*) RUN_ANDROID=true ;;
              refs/tags/mobile-release-v*) RUN_IOS=true; RUN_ANDROID=true ;;
            esac
          else
            case "${PLATFORM:-ios}" in
              android) RUN_ANDROID=true ;;
              both) RUN_IOS=true; RUN_ANDROID=true ;;
              *) RUN_IOS=true ;;
            esac
          fi
          # A lane without its secrets is skipped, not run as a job that does nothing.
          # A half-configured lane that this run asked for stops the run here.
          if [ "${RUN_IOS}" = true ] && [ "${IOS_SECRETS}" = partial ]; then
            echo "::error::iOS lane is half-configured. Missing: ${IOS_MISSING}"
            exit 1
          fi
          if [ "${RUN_ANDROID}" = true ] && [ "${ANDROID_SECRETS}" = partial ]; then
            echo "::error::Android lane is half-configured. Missing: ${ANDROID_MISSING}"
            exit 1
          fi
          if [ "${RUN_IOS}" = true ] && [ "${IOS_SECRETS}" != true ]; then
            echo "::warning::iOS signing secrets not configured. The iOS job will show as skipped."
            RUN_IOS=false
          fi
          if [ "${RUN_ANDROID}" = true ] && [ "${ANDROID_SECRETS}" != true ]; then
            echo "::warning::Android signing secrets not configured. The Android job will show as skipped."
            RUN_ANDROID=false
          fi
          echo "run_ios=${RUN_IOS}" >> "$GITHUB_OUTPUT"
          echo "run_android=${RUN_ANDROID}" >> "$GITHUB_OUTPUT"
          echo "Version ${NAME} (build ${CODE}, minutes since 2026-01-01 UTC) ios=${RUN_IOS} android=${RUN_ANDROID}"

  ios:
    name: iOS → TestFlight
    needs: version
    if: needs.version.outputs.run_ios == 'true'
    # App Store Connect requires the iOS 26 SDK. macos-15 selected Xcode 16.4
    # and produced an iOS 18.5 build that ASC rejected during validation.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js + Corepack (Yarn 4)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable

      # The iOS archive needs the private Safari extension source. The main repo's
      # GITHUB_TOKEN cannot read a second private repository, and the extension
      # release asset is not a reliable source for this build. Check out the
      # immutable source revision with a read-only deploy key and build it locally.
      - name: Checkout pinned Safari extension source
        uses: actions/checkout@v7
        with:
          repository: companionintelligence/CI-Browser-Extension
          ref: 99acfb48451d47b66f80641e4ff45c2e05b294ed
          path: CI-Browser-Extension
          ssh-key: ${{ secrets.CI_BROWSER_EXTENSION_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify pinned Safari extension source
        env:
          EXPECTED_EXTENSION_VERSION: ${{ env.CI_BROWSER_EXTENSION_VERSION }}
        run: |
          set -euo pipefail
          actual="$(node -p "require('./CI-Browser-Extension/package.json').version")"
          if [[ "$actual" != "$EXPECTED_EXTENSION_VERSION" ]]; then
            echo "::error::Pinned Safari extension source is version $actual; expected $EXPECTED_EXTENSION_VERSION. Update the immutable ref and version together."
            exit 1
          fi
          echo "Verified Safari extension source version $actual."

      - name: Install root dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web bundle
        run: yarn workspace @ci/fe-web build

      - name: Install mobile dependencies
        working-directory: frontend/apps/ios
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capacitor sync (iOS)
        working-directory: frontend/apps/ios
        run: yarn cap sync ios

      # The on-device LLM links CLiteRTLM.xcframework (~81 MB), deliberately not
      # committed. Must run before `xcodebuild archive` or the link step fails on a
      # missing framework — and here that failure would burn a build number.
      - name: Fetch CLiteRTLM.xcframework (on-device LLM)
        working-directory: frontend/apps/ios/ios/App
        run: ./Frameworks/fetch-clitertlm-xcframework.sh

      # A dedicated keychain, unlocked and set as the default search list, is what lets
      # a non-interactive xcodebuild find the identity. `set-key-partition-list` is the
      # step people miss: without it codesign blocks on a UI prompt that never appears
      # and the job hangs until it times out.
      - name: Import signing certificate
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"

      # Two profiles, because the archive embeds two bundle identifiers: the container app
      # (com.companionintelligence.app) and the Safari web-extension appex
      # (com.companionintelligence.app.SafariWebExtension — target `SafariWebExtension` in
      # frontend/apps/ios/ios/App/App.xcodeproj/project.pbxproj). Under manual signing
      # codesign needs a profile per identifier; the app's profile does not cover the appex.
      - name: Install provisioning profiles
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          EXTENSION_PROFILE_B64: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          WIDGETS_PROFILE_B64: ${{ secrets.IOS_WIDGETS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # Xcode 16+ reads profiles from ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles;
          # older tooling reads ~/Library/MobileDevice/Provisioning Profiles. Write both.
          install_profile() {
            local B64="$1" FILENAME="$2"
            for DIR in \
              "$HOME/Library/MobileDevice/Provisioning Profiles" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$DIR"
              echo "$B64" | base64 --decode > "$DIR/$FILENAME"
            done
          }
          profile_field() {
            security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/$1" \
              | plutil -extract "$2" raw -o - -
          }

          install_profile "$PROFILE_B64" companion.mobileprovision
          UUID=$(profile_field companion.mobileprovision UUID)
          NAME=$(profile_field companion.mobileprovision Name)
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed app profile '$NAME' ($UUID)"

          install_profile "$EXTENSION_PROFILE_B64" companion-extension.mobileprovision
          EXT_UUID=$(profile_field companion-extension.mobileprovision UUID)
          EXT_NAME=$(profile_field companion-extension.mobileprovision Name)
          echo "EXTENSION_PROVISIONING_PROFILE_UUID=$EXT_UUID" >> "$GITHUB_ENV"
          echo "EXTENSION_PROVISIONING_PROFILE_NAME=$EXT_NAME" >> "$GITHUB_ENV"
          echo "Installed extension profile '$EXT_NAME' ($EXT_UUID)"

          install_profile "$WIDGETS_PROFILE_B64" companion-widgets.mobileprovision
          WIDGETS_UUID=$(profile_field companion-widgets.mobileprovision UUID)
          WIDGETS_NAME=$(profile_field companion-widgets.mobileprovision Name)
          echo "WIDGETS_PROVISIONING_PROFILE_UUID=$WIDGETS_UUID" >> "$GITHUB_ENV"
          echo "WIDGETS_PROVISIONING_PROFILE_NAME=$WIDGETS_NAME" >> "$GITHUB_ENV"
          echo "Installed widgets profile '$WIDGETS_NAME' ($WIDGETS_UUID)"

          # xcodebuild reports a profile without the App Groups capability only at the end of
          # the archive, as four errors about entitlements. Say so here instead. The app and
          # the widgets declare the same App Group, so both of their profiles must carry it.
          WIDGET_ENTITLEMENTS=frontend/apps/ios/ios/App/MemoryWidgets/MemoryWidgets.entitlements
          for PAIR in companion.mobileprovision:IOS_PROVISIONING_PROFILE_BASE64 \
            companion-widgets.mobileprovision:IOS_WIDGETS_PROVISIONING_PROFILE_BASE64; do
            FILE="${PAIR%%:*}"
            SECRET="${PAIR##*:}"
            security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/$FILE" > "$RUNNER_TEMP/profile.plist"
            MISSING=$(python3 - "$WIDGET_ENTITLEMENTS" "$RUNNER_TEMP/profile.plist" <<'PY'
          import plistlib, sys
          key = "com.apple.security.application-groups"
          with open(sys.argv[1], "rb") as f:
              want = plistlib.load(f).get(key, [])
          with open(sys.argv[2], "rb") as f:
              have = plistlib.load(f).get("Entitlements", {}).get(key, [])
          print(" ".join(g for g in want if g not in have))
          PY
            )
            rm -f "$RUNNER_TEMP/profile.plist"
            if [ -n "$MISSING" ]; then
              echo "::error::The profile in ${SECRET} lacks the App Group ${MISSING} that the app and the widgets declare. Enable App Groups on that App ID in the Apple Developer portal, regenerate the profile and update the secret."
              exit 1
            fi
          done

      - name: Verify signing certificate matches provisioning profiles
        env:
          SIGNING_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
        run: |
          set -euo pipefail
          IDENTITY_SHA1="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" \
            | awk '/Apple Distribution/ { print toupper($2); exit }')"
          if [ -z "$IDENTITY_SHA1" ]; then
            echo "::error::IOS_DIST_CERT_P12_BASE64 contains no usable Apple Distribution identity."
            exit 1
          fi
          for PROFILE in \
            "$HOME/Library/MobileDevice/Provisioning Profiles/companion.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/companion-extension.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/companion-widgets.mobileprovision"; do
            PROFILE_SHA1="$(security cms -D -i "$PROFILE" | python3 -c \
              'import hashlib, plistlib, sys; d = plistlib.loads(sys.stdin.buffer.read()); print(hashlib.sha1(d["DeveloperCertificates"][0]).hexdigest().upper())')"
            if [ "$IDENTITY_SHA1" != "$PROFILE_SHA1" ]; then
              echo "::error::IOS_DIST_CERT_P12_BASE64 does not match certificate in $(basename "$PROFILE")."
              exit 1
            fi
          done
          echo "Apple Distribution identity matches all three App Store provisioning profiles."

      # The project is checked in with CODE_SIGN_STYLE = Automatic and no DEVELOPMENT_TEAM,
      # which cannot work on a runner that has no Apple ID session. Override to manual
      # signing on the command line rather than editing the pbxproj, so opening the project
      # in Xcode locally keeps working exactly as before.
      - name: Archive
        working-directory: frontend/apps/ios/ios/App
        env:
          CI_BROWSER_EXTENSION_DIR: ${{ github.workspace }}/CI-Browser-Extension
          CI_BROWSER_EXTENSION_VERSION: '1.6.2'
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # No -allowProvisioningUpdates here. It is a boolean *flag* that takes no
          # argument, so the old `-allowProvisioningUpdates NO` made xcodebuild read the
          # bare `NO` as a second build ACTION and abort ("Unknown build action 'NO'")
          # before it ever reached signing. Manual signing never wants the flag anyway —
          # it exists to let Xcode mint profiles from a logged-in Apple ID, which a
          # runner does not have; omitting it is exactly the "NO" that was intended.
          SIGNING_ARGS=()
          # A command-line build setting is GLOBAL — it cannot say "this profile for the
          # app, that one for the appex", and a single global specifier is precisely why
          # signing the SafariWebExtension target used to fail. An xcconfig can, because
          # build settings expand recursively and $(TARGET_NAME) is per target: each
          # target resolves PROFILE_<its own name>. Targets whose names are not valid
          # setting-name characters (the CocoaPods targets, e.g. `Pods-App`) resolve to
          # empty, which is correct — libraries and frameworks are signed with the identity
          # and embed no profile. Passed via -xcconfig instead of on the command line
          # because command-line settings outrank an xcconfig, so a global
          # PROVISIONING_PROFILE_SPECIFIER here would silently win over the per-target one.
          cat > "$RUNNER_TEMP/signing.xcconfig" <<XCCONFIG
          PROFILE_App = ${PROVISIONING_PROFILE_UUID}
          PROFILE_SafariWebExtension = ${EXTENSION_PROVISIONING_PROFILE_UUID}
          PROFILE_CompanionWidgets = ${WIDGETS_PROVISIONING_PROFILE_UUID}
          PROVISIONING_PROFILE_SPECIFIER = \$(PROFILE_\$(TARGET_NAME))
          XCCONFIG
          SIGNING_ARGS+=(-xcconfig "$RUNNER_TEMP/signing.xcconfig")
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Companion.xcarchive" \
            "${SIGNING_ARGS[@]}" \
            MARKETING_VERSION='${{ needs.version.outputs.name }}' \
            CURRENT_PROJECT_VERSION='${{ needs.version.outputs.code }}' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution'

      - name: Export .ipa
        working-directory: frontend/apps/ios/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Under signingStyle=manual the export step maps EVERY embedded bundle id to a
          # profile itself; the container app, the Safari extension and the widgets have
          # required profiles, checked before the build starts.
          EXTENSION_PROFILE_ENTRY="  <key>com.companionintelligence.app.SafariWebExtension</key><string>${EXTENSION_PROVISIONING_PROFILE_UUID}</string>"
          WIDGETS_PROFILE_ENTRY="  <key>com.companionintelligence.app.CompanionWidgets</key><string>${WIDGETS_PROVISIONING_PROFILE_UUID}</string>"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.companionintelligence.app</key>
              <string>${PROVISIONING_PROFILE_UUID}</string>
          ${EXTENSION_PROFILE_ENTRY}
          ${WIDGETS_PROFILE_ENTRY}
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Companion.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: companion-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      # Validate first: it catches the great majority of rejections (missing icons,
      # bad entitlements, an already-used build number) WITHOUT consuming the upload.
      - name: Validate with App Store Connect
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Upload to TestFlight
        if: needs.version.outputs.dry_run != 'true'
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Clean up keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" || true

  android:
    name: Android → Play (internal)
    needs: version
    if: needs.version.outputs.run_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js + Corepack (Yarn 4)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable

      - name: Install root dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web bundle
        run: yarn workspace @ci/fe-web build

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # v3 defaults `packages` to `tools platform-tools`, and Google has
          # REMOVED the obsolete `tools` package from the SDK repository, so the
          # default makes sdkmanager exit 1 with `Failed to find package 'tools'`
          # — which is how this lane broke without any change on our side.
          # Empty means "set up cmdline-tools and the env, install nothing":
          # the next step already installs the exact components this build
          # needs, so there was never anything for the default to add.
          packages: ''
      # Keep this pair in lockstep with compileSdkVersion in
      # frontend/apps/android/android/variables.gradle.
      - name: Install SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install mobile dependencies
        working-directory: frontend/apps/android
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capacitor sync (Android)
        working-directory: frontend/apps/android
        run: yarn cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # An .aab, not an .apk: Play has required the App Bundle format for new apps
      # since August 2021.
      - name: Gradle bundleRelease
        working-directory: frontend/apps/android/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ needs.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ needs.version.outputs.name }}
        run: ./gradlew bundleRelease --no-daemon

      # Play refuses an update whose 64-bit native libraries do not support 16 KB memory pages,
      # and the rule binds every app that targets Android 15+ (this one targets 36). A native
      # dependency bump can break it with no change here, so the bundle that was just built is
      # read BEFORE it is stored as an artifact or sent to Play, and a failure stops the lane.
      # Every arm64-v8a and x86_64 library needs ELF p_align >= 0x4000. An .aab has no zip-offset
      # rule: Play cuts the APKs from it. Node only, which setup-node above already installed.
      # Locally: node scripts/check-android-16kb.mjs <file.aab>. See
      # frontend/apps/android/DELIVERY.md, the "edge-to-edge + 16 KB page size" item.
      - name: Check 16 KB page-size support (.aab)
        run: node scripts/check-android-16kb.mjs frontend/apps/android/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: companion-android-aab
          path: frontend/apps/android/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # The dry-run counterpart of the iOS `altool --validate-app`. Without it a dry run
      # never talks to Google at all, so the FIRST contact with Play is a real release
      # (`dry_run=false`). frontend/apps/android/DELIVERY.md (§1c, the "Play
      # foreground-service `location` declaration" item, cited by name and not by line
      # number because that file grows) says to file that declaration "before a build goes
      # to any Play track, including internal testing". Better to learn that on a rehearsal.
      # r0adkll/upload-google-play@v1 has no dry-run input. Its real inputs are
      # serviceAccountJson, serviceAccountJsonPlainText, packageName, releaseFile,
      # releaseFiles, releaseName, track, tracks, inAppUpdatePriority, userFraction,
      # status, whatsNewDirectory, mappingFile, debugSymbols, changesNotSentForReview,
      # versionCodesToRetain. (An earlier revision of this comment listed a nonexistent
      # `existingEditPatch` and omitted `tracks` — the plural input that selects
      # `internalsharing`, which matters below.)
      #
      # So `status: draft` is the non-publishing option available here: it exercises the
      # credentials, the package name, the edit transaction and the API-enforced
      # declaration checks, and commits the release as a draft that rolls out to nobody.
      # Tradeoff, and one reason BUILD_NUMBER_EPOCH only goes up: `status` only sets the
      # release status INSIDE the edit — the action calls `edits.commit` unconditionally
      # (verified in its src/edits.ts), so Play consumes the version code exactly as a
      # real submission does, and deleting the draft does not give the number back.
      #
      # TWO THINGS TO KNOW BEFORE RELYING ON THIS STEP:
      #   1. It cannot run at all yet. The Play Publishing API refuses every call until
      #      at least one APK has been uploaded BY HAND through the Play Console ("you
      #      will have to upload at least one APK through the Play Console before you
      #      can use this API" — developers.google.com/android-publisher/edits). The
      #      same precondition makes the real upload below fail too, and `status:
      #      completed` is additionally refused for an app that has never been
      #      published. Until someone creates the Console account and hand-uploads
      #      once, no version of this rehearsal — or of the release — can succeed.
      #   2. There IS a genuinely non-consuming alternative worth switching to once (1)
      #      is done: fastlane `supply --validate_only` swaps `edits.commit` for
      #      `edits.validate` (supply/lib/supply/uploader.rb), and validate-time is late
      #      enough to surface API-enforced declaration errors — fastlane#22204 shows
      #      the health-apps declaration failing exactly there. Human-reviewed
      #      declarations (background location, foreground-service `location`) are never
      #      caught by any rehearsal, only by review. `track: internalsharing` is a
      #      third option, documented as explicitly version-code-free, but it runs no
      #      declaration checks at all.
      - name: Validate against Play (draft, no rollout)
        if: needs.version.outputs.dry_run == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ci.memory
          releaseFiles: frontend/apps/android/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

      - name: Upload to Play (internal track)
        if: needs.version.outputs.dry_run != 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ci.memory
          releaseFiles: frontend/apps/android/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" || true
