# Used to be the only automatic *store* upload — pushing a matching tag WAS
# the release action. Gated to `workflow_dispatch`-only 2026-09-17, along with
# every other workflow in this repo still on an automatic trigger, to cut the
# GitHub Actions bill; see docs/CI.md. Pushing a tag now only names the
# version — it submits nothing by itself:
#
#   git tag -a ios-v1.0.0 -m "iOS 1.0.0" && git push origin ios-v1.0.0
#   git tag -a android-v1.0.0 -m "Android 1.0.0" && git push origin android-v1.0.0
#   git tag -a mobile-release-v1.0.0 -m "1.0.0" && git push origin mobile-release-v1.0.0
#   gh workflow run mobile-release.yml --ref ios-v1.0.0 -f dry_run=false -f platform=ios
#
# Rehearsal (nothing reaches a tester) is a dispatch on a branch instead of a tag:
#   gh workflow run mobile-release.yml --ref main -f dry_run=true -f platform=ios
# On Android a rehearsal is not store-free — read the `dry_run` note below before running one.
name: Mobile Release

# Signed, store-bound builds of the Capacitor app: a TestFlight upload and a Play
# internal-testing upload. This is the DISTRIBUTION lane and it needs credentials —
# `mobile-build.yml` remains the credential-free lane that produces an unsigned
# simulator .app and a debug APK for sideloading.
#
# `dry_run` (default true) governs every dispatch, tag-ref or branch-ref alike —
# there is no trigger left that bypasses it. Set `-f dry_run=false` to actually
# submit. Use a dry run first to prove the signing chain before spending a real
# build number — Apple and Google both permanently burn a build number on
# upload, so a failed submission after a successful one still costs you that
# number.
#
# `dry_run` does NOT mean "never touches a store", and the two lanes differ. iOS honours
# it literally: the rehearsal stops at `altool --validate-app`, which validates without
# consuming anything. Android has no equivalent — r0adkll/upload-google-play offers no
# validate-only mode — so its rehearsal commits a *draft* release ("Validate against Play
# (draft, no rollout)"). No tester ever sees it, but Play keeps the version code of any
# bundle it accepts, draft included. So an Android dry run costs a version code exactly
# like a real one; that is the tradeoff for finding out about credentials, package name
# and the pending Play declarations on a rehearsal instead of on a real release.
#
# ── Required secrets ───────────────────────────────────────────────────────────
# iOS (App Store Connect API key auth — no Apple ID, no 2FA prompt in CI):
#   APPSTORE_ISSUER_ID          App Store Connect → Users and Access → Integrations
#   APPSTORE_KEY_ID             the key's ID
#   APPSTORE_PRIVATE_KEY        contents of the AuthKey_<KEYID>.p8, PEM text
#   APPLE_TEAM_ID               10-char team ID
#   IOS_DIST_CERT_P12_BASE64    base64 of the Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD      that .p12's password
#   IOS_PROVISIONING_PROFILE_BASE64
#                               base64 of the App Store .mobileprovision for
#                               com.companionintelligence.app
# iOS:
#   IOS_EXTENSION_PROVISIONING_PROFILE_BASE64
#                               base64 of the App Store .mobileprovision for
#                               com.companionintelligence.app.SafariWebExtension.
#                               The archive embeds a Safari web-extension appex
#                               (target `SafariWebExtension` in
#                               frontend/apps/ios/ios/App/App.xcodeproj/project.pbxproj),
#                               and under manual signing an appex needs its OWN
#                               profile — the container app's profile does not cover
#                               it.
#   IOS_WIDGETS_PROVISIONING_PROFILE_BASE64
#                               base64 of the App Store .mobileprovision for
#                               com.companionintelligence.app.CompanionWidgets.
#                               The archive also embeds the Memory widgets appex
#                               (target `CompanionWidgets`), which needs its OWN
#                               profile under manual signing. This profile and the
#                               app's must both carry the App Groups capability for
#                               group.com.companionintelligence.memory.widgets (enable
#                               it on both App IDs in the Apple Developer portal, then
#                               regenerate the profiles). The signing step checks for
#                               it and says which profile lacks it.
#   CI_BROWSER_EXTENSION_DEPLOY_KEY
#                               read-only SSH deploy key for the private
#                               companionintelligence/CI-Browser-Extension repo.
#                               The archive builds its pinned Safari source locally,
#                               avoiding a cross-repo release download the runner
#                               cannot authorize.
# Android:
#   ANDROID_KEYSTORE_BASE64     base64 of the upload .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON   Play Console service-account JSON with
#                               "Release to testing tracks" permission
#
# A platform lane is skipped (not failed) only when *every* secret it consumes is
# absent. That is the supported way to wire up one store before the other. The
# `version` job checks the secrets and the lane's job then shows as skipped on the run
# page. (It used to run and skip every step, which reported a green job that built
# nothing.) When some but not all of a lane's secrets are set the `version` job FAILS
# immediately and names the missing ones: a half-configured lane is a configuration
# mistake, and letting it run means dying an hour later, after an archive that has
# already burned a build number. The Safari extension profile and source-read key are
# included in the iOS lane's required-secret gate; both are necessary for a shippable
# archive.
#
# release.yml calls this workflow (workflow_call) with dry_run=false, platform=both and
# the server's version, so the phone apps carry the server version they were built from.

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     tags:
#       - 'ios-v*'
#       - 'android-v*'
#       - 'mobile-release-v*'
#   workflow_dispatch:
#     inputs:
#       dry_run:
#         # Not "no store contact": iOS validates only, Android commits a Play *draft*
#         # (no rollout, but the version code is spent). See the header note on `dry_run`.
#         description: 'Build and sign; release to nobody (iOS validates only, Android commits a Play draft)'
#         type: boolean
#         default: true
#       version_name:
#         description: 'Marketing version (e.g. 1.0.0). Defaults to the tag or 0.1.0.'
#         type: string
#         required: false
#       platform:
#         description: 'Which store lane to run'
#         type: choice
#         options:
#           - ios
#           - android
#           - both
#         default: ios
#   workflow_call:
