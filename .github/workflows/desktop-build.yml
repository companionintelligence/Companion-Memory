name: Desktop Build

# Builds the native macOS/Windows/Linux desktop app — a local orchestrator
# (Tauri) that brings up CI-Server's own Docker Compose stack and displays
# it (frontend/apps/desktop). Modelled on mobile-build.yml, which is itself
# modelled on CI-Hub's desktop-build.yml.
#
# Runs on manual dispatch only and produces UNSIGNED artifacts that need no
# secrets — dmg/app (macOS), msi/nsis-setup.exe (Windows), deb/rpm/AppImage
# (Linux). Signed, notarized/authenticode-signed release artifacts are
# desktop-release.yml.

# GATED TO MANUAL, matching every other workflow in this repo except
# mobile-release.yml and codeql.yml. CI silence here means "nobody
# dispatched it", NOT "everything passed". Run it deliberately:
#   gh workflow run desktop-build.yml --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - runner: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux (x64)
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/apps/desktop/src-tauri -> target

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 rpm xdg-utils

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only syncs the bundled compose resources (verbatim copies of the root
      # compose files + a resolved image tag) — no yarn install/web build
      # needed, since the bootstrap page is static, unlike mobile-build.yml's
      # real SPA build.
      - name: Sync compose resources
        working-directory: frontend/apps/desktop
        run: node scripts/sync-compose-resources.cjs

      - name: Build (Tauri, unsigned)
        working-directory: frontend/apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_FLAGS=""
          if [ "${{ runner.os }}" = "Linux" ]; then
            BUNDLE_FLAGS="-b deb,rpm,appimage"
          fi
          npx --yes @tauri-apps/cli@2 build \
            --target ${{ matrix.target }} \
            -c '{"bundle":{"createUpdaterArtifacts":false}}' \
            $BUNDLE_FLAGS

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ci-server-desktop-${{ matrix.target }}
          path: |
            frontend/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            frontend/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ci-server-desktop-${{ matrix.target }}
          path: |
            frontend/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            frontend/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            frontend/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ci-server-desktop-${{ matrix.target }}
          path: |
            frontend/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            frontend/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
