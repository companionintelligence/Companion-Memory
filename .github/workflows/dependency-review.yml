# Dependency Review — blocks PRs that introduce vulnerable or disallowed deps.
# Recurring SCA evidence for CASA Tier 2 / SOC 2 (runs on every pull request).
name: Dependency Review

on:
  pull_request:
    branches:
      - main

# Least-privilege: only needs to read repo contents to diff the manifests.
permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    # non-blocking until GitHub Advanced Security / GITLEAKS_LICENSE is enabled on this repo
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail the check when a PR introduces a high or critical severity
          # vulnerability. Lower-severity findings are surfaced but non-blocking.
          fail-on-severity: high
