name: Code style enforcement

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: node:22-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint extraneous files and most packages
        run: yarn lint

      - name: Lint backend
        run: yarn workspace @ci/be-api lint

      - name: Lint frontend
        run: yarn workspace @ci/fe-web lint
