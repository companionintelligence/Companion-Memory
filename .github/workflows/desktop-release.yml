# Signed, tag-named release of the desktop app (frontend/apps/desktop):
#   git tag -a desktop-v0.1.0 -m "Desktop 0.1.0" && git push origin desktop-v0.1.0
#   gh workflow run desktop-release.yml --ref desktop-v0.1.0
#
# Used to be one of only four workflows in this repo (of fourteen — the count
# docs/CI.md keeps) that ran without someone dispatching them: pr-gate.yml on
# every PR, benchmark-unit.yml on scripts/benchmark/** changes, and the two
# tag-triggered release lanes, mobile-release.yml and this one. All thirteen
# surviving workflow files (pr-gate.yml was deleted) are `workflow_dispatch`-
# only as of 2026-09-17, to cut the GitHub Actions bill — keep this line and
# docs/CI.md's table in step; that table is the canonical one.
#
# A tag push here used to always build AND publish a GitHub Release by
# itself; now it only names the version, and the dispatch above is what
# actually builds it. There is still no dry-run once dispatched (unlike
# mobile-release.yml, there is no app-store submission step to rehearse
# separately from the build itself).
#
# desktop-build.yml remains the credential-free lane that produces unsigned
# artifacts on manual dispatch. This is the DISTRIBUTION lane.
#
# ── The release procedure (the test gate is not optional) ───────────────
# Nothing in THIS workflow runs a test: it signs, notarizes and publishes.
# `verify-desktop-build-passed` below is the gate that makes that safe — it
# asks the Actions API whether a successful desktop-build.yml run (which is
# where `cargo test` lives) already exists for this exact commit, and refuses
# to build if one does not. desktop-build.yml is dispatch-only, so the order
# is always:
#   gh workflow run desktop-build.yml --ref <branch>   # wait for green
#   git tag -a desktop-v0.1.0 -m "Desktop 0.1.0" && git push origin desktop-v0.1.0
# Modelled deliberately on publish.yml's `verify-ci-passed`, down to the
# skip_test_gate + bypass_reason pair (a bypass with no stated cause is
# refused there and here), so the server and desktop release lanes are read
# and operated the same way. If publish.yml's gate gains an accountability
# requirement, this one is expected to gain it too.
#
# ── Version ─────────────────────────────────────────────────────────────
# release.yml dispatches this workflow on the server tag, as a run of its own,
# with version_name and server_image_tag both set to the server release, so the
# app carries the server's version: Memory Desktop 2026.11.17 runs server
# 2026.11.17 and its Release is tagged desktop-v2026.11.17. It isn't a called
# workflow (workflow_call) because the Windows lane needs the `production`
# Environment's Azure secrets, which a called workflow's jobs did not receive. The `version` job
# turns version_name into what each installer accepts, through
# scripts/release/release-plan.mjs: Tauri gets at most three numbers
# (2026.11.17.1 builds as 2026.11.17), and the Windows MSI, which caps the
# first two numbers at 255, gets 26.11.17 (26.11.17.1 for that re-cut).
# Older desktop-v0.1.x tags keep working unchanged.
#
# The SERVER images the bundled compose file pulls are resolved ONCE, in the
# `version` job, by frontend/apps/desktop/scripts/sync-compose-resources.cjs;
# server_image_tag pins them, and release.yml always sets it.
#
# ── Required secrets ────────────────────────────────────────────────────
# macOS (Developer ID signing + notarization — names match what CI-Hub's own
# desktop-release.yml already uses, for consistency across the org):
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  that .p12's password
#   APPLE_ID                    Apple ID used for notarization
#   APPLE_PASSWORD               app-specific password for that Apple ID
#   APPLE_TEAM_ID                10-char team ID
# Windows (Azure Artifact Signing over GitHub OIDC, same as CI-Hub's
# desktop-release.yml — no certificate file is stored anywhere). Set these on
# the `production` GitHub Environment; the Entra app's federated credential
# subject is repo:companionintelligence@<org id>/Companion-Memory@<repo id>:environment:production
# (the numeric ids are in the azure/login failure log if it ever stops matching):
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID,
#   AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_CERTIFICATE_PROFILE
#
# The six Azure values are configured on the `production` Environment. The
# four macOS-specific values still need repository secrets; APPLE_TEAM_ID is
# shared with the iOS lane. The `signing` job checks both sets. A lane whose
# platform-specific signing values are all missing shows as skipped on the run
# page; a partial configuration fails the `signing` job, and with it the run.
# The Linux lane always runs unsigned — no signing convention exists for
# .deb/.rpm in this codebase.
name: Desktop Release

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
