# Signed, tag-triggered release of the desktop app (frontend/apps/desktop):
#   git tag -a desktop-v0.1.0 -m "Desktop 0.1.0" && git push origin desktop-v0.1.0
#
# This is one of only four workflows in this repo (of fourteen — the count
# docs/CI.md keeps) that run without someone dispatching them: pr-gate.yml on
# every PR, benchmark-unit.yml on scripts/benchmark/** changes, and the two
# tag-triggered release lanes, mobile-release.yml and this one. Keep this list
# and docs/CI.md's table in step; that table is the canonical one.
#
# A tag push here always builds AND publishes a GitHub Release; there is no
# dry-run for this workflow (unlike mobile-release.yml, there is no app-store
# submission step to rehearse separately from the build itself).
#
# desktop-build.yml remains the credential-free lane that produces unsigned
# artifacts on manual dispatch. This is the DISTRIBUTION lane.
#
# The desktop marketing version (desktop-v0.1.0 → 0.1.0) versions the APP
# only. The SERVER images the bundled compose file pulls are tagged
# independently (date-shaped release tags like 2026.9.5) and are resolved by
# frontend/apps/desktop/scripts/sync-compose-resources.cjs; use the
# `server_image_tag` dispatch input if one must be pinned by hand.
#
# ── Required secrets ────────────────────────────────────────────────────
# macOS (Developer ID signing + notarization — names match what CI-Hub's own
# desktop-release.yml already uses, for consistency across the org):
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  that .p12's password
#   APPLE_ID                    Apple ID used for notarization
#   APPLE_PASSWORD               app-specific password for that Apple ID
#   APPLE_TEAM_ID                10-char team ID
# Windows:
#   WINDOWS_CERTIFICATE_BASE64    base64 of the code-signing .pfx
#   WINDOWS_CERTIFICATE_PASSWORD  that .pfx's password
#
# None of the above are currently provisioned in this repo. Each platform's
# job is SKIPPED (not failed) when its secrets are absent, so macOS/Windows
# signing can be wired up independently without blocking a release. The
# Linux lane always runs unsigned — no signing convention exists for
# .deb/.rpm in this codebase.
name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Marketing version (e.g. 0.1.0). Defaults to the tag or 0.1.0.'
        type: string
        required: false
      # The desktop marketing version is NOT a server image tag — see the
      # macOS "Sync compose resources" step below for the whole story. This
      # input is the ONLY way to override the resolver, and it must name a tag
      # that really exists under ghcr.io/companionintelligence/companion/*
      # (date-shaped release tags like 2026.9.5, or latest).
      server_image_tag:
        description: 'Optional: pin the bundled CI-Server image tag (e.g. 2026.9.5). Leave blank to let sync-compose-resources.cjs resolve a verified, fully-published release.'
        type: string
        required: false

permissions:
  contents: write
  packages: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version_name }}" ]; then
            NAME="${{ inputs.version_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/desktop-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/desktop-v}"
          else
            NAME="0.1.0"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Version ${NAME}"

  macos:
    name: macOS (signed, notarized)
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for macOS signing secrets
        id: secrets
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$APPLE_ID_SECRET" ] && [ -n "$TEAM_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing secrets not configured — skipping the signed macOS build."
          fi

      - name: Rust toolchain
        if: steps.secrets.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Node.js
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # CI_SERVER_IMAGE_TAG is the tag of the SERVER images the bundled compose
      # file pulls at first launch — it is NOT the desktop app's marketing
      # version. This step used to pass `needs.version.outputs.name` here, so a
      # `desktop-v0.1.0` tag baked `ghcr.io/companionintelligence/companion/*:0.1.0`
      # into resources/docker-compose.desktop.yml; no such tag is published
      # (only date-shaped release tags like 2026.9.5 and :latest exist), so
      # every signed artifact died at its first `docker compose` pull. Setting
      # the variable at all takes the *unverified override* branch of
      # resolveImageTag() in scripts/sync-compose-resources.cjs; leaving it
      # blank runs that script's ancestor-release walk, which checks each
      # candidate against GHCR with `docker manifest inspect` before choosing
      # it. An empty string is falsy in the script's
      # `if (process.env.CI_SERVER_IMAGE_TAG)` guard, so on a tag push (where
      # the inputs context is empty) and on a dispatch that leaves the input
      # blank, the verified path is what runs. The input exists only so an
      # operator can deliberately pin an already-published server release.
      - name: Sync compose resources
        if: steps.secrets.outputs.present == 'true'
        working-directory: frontend/apps/desktop
        run: node scripts/sync-compose-resources.cjs
        env:
          CI_SERVER_IMAGE_TAG: ${{ inputs.server_image_tag }}

      - name: Bump version
        if: steps.secrets.outputs.present == 'true'
        working-directory: frontend/apps/desktop/src-tauri
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs');
            const conf = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
            conf.version = '${{ needs.version.outputs.name }}';
            fs.writeFileSync('tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "
          # BSD sed (macos-15 runner) — `-i` REQUIRES the backup-suffix
          # argument, hence the empty ''. The identical steps in the windows
          # and linux jobs run GNU sed, where `-i ''` would be read as the
          # script and clobber the edit, so they use a bare `-i`.
          sed -i '' 's/^version = ".*"/version = "${{ needs.version.outputs.name }}"/' Cargo.toml

      # A dedicated keychain, unlocked and set as the default search list, is
      # what lets a non-interactive `cargo tauri build` find the identity —
      # see mobile-release.yml's iOS lane for the same pattern and the
      # set-key-partition-list gotcha it documents.
      - name: Import signing certificate
        if: steps.secrets.outputs.present == 'true'
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build (universal, signed)
        if: steps.secrets.outputs.present == 'true'
        working-directory: frontend/apps/desktop
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx --yes @tauri-apps/cli@2 build \
            --target universal-apple-darwin \
            -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Notarize and staple
        if: steps.secrets.outputs.present == 'true'
        env:
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=$(find frontend/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID_SECRET" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 600
          xcrun stapler staple "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG" 2>&1 | grep -q 'source=Notarized Developer ID'
          xcrun stapler validate "$DMG"

      - name: Upload macOS artifact
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: frontend/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Clean up keychain
        if: always() && steps.secrets.outputs.present == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  windows:
    name: Windows (signed)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check for Windows signing secrets
        id: secrets
        shell: bash
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Windows signing secrets not configured — skipping the signed Windows build."
          fi

      - name: Rust toolchain
        if: steps.secrets.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Node.js
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deliberately NOT the desktop marketing version — see the long comment
      # on the macOS job's copy of this step for the pull failure that caused.
      - name: Sync compose resources
        if: steps.secrets.outputs.present == 'true'
        working-directory: frontend/apps/desktop
        run: node scripts/sync-compose-resources.cjs
        env:
          CI_SERVER_IMAGE_TAG: ${{ inputs.server_image_tag }}

      # Same bump as the macOS job, and it must exist in every platform job:
      # tauri.conf.json/Cargo.toml are checked in at 0.1.0, so without this the
      # Windows installer would carry 0.1.0 no matter which desktop-v* tag
      # triggered the release. `shell: bash` because windows-latest defaults to
      # pwsh; git-bash ships GNU sed, so `-i` takes NO backup-suffix argument
      # (the macOS lane's `-i ''` would be parsed as the sed script here).
      - name: Bump version
        if: steps.secrets.outputs.present == 'true'
        shell: bash
        working-directory: frontend/apps/desktop/src-tauri
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs');
            const conf = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
            conf.version = '${{ needs.version.outputs.name }}';
            fs.writeFileSync('tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "
          sed -i 's/^version = ".*"/version = "${{ needs.version.outputs.name }}"/' Cargo.toml

      - name: Decode signing certificate
        if: steps.secrets.outputs.present == 'true'
        shell: bash
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/signing.pfx"
          echo "WINDOWS_CERTIFICATE_PATH=$RUNNER_TEMP/signing.pfx" >> "$GITHUB_ENV"

      - name: Build
        if: steps.secrets.outputs.present == 'true'
        working-directory: frontend/apps/desktop
        run: |
          npx --yes @tauri-apps/cli@2 build --target x86_64-pc-windows-msvc -c "{\"bundle\":{\"createUpdaterArtifacts\":false}}"

      - name: Sign artifacts
        if: steps.secrets.outputs.present == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          $files = Get-ChildItem -Path "frontend/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle" -Recurse -Include *.msi,*-setup.exe
          foreach ($file in $files) {
            & $signtool sign /f "$env:WINDOWS_CERTIFICATE_PATH" /p "$env:CERT_PASSWORD" `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$file.FullName"
          }

      - name: Upload Windows artifact
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            frontend/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            frontend/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Clean up certificate
        if: always() && steps.secrets.outputs.present == 'true'
        shell: bash
        run: rm -f "$RUNNER_TEMP/signing.pfx" || true

  linux:
    name: Linux (unsigned)
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deliberately NOT the desktop marketing version — see the long comment
      # on the macOS job's copy of this step for the pull failure that caused.
      - name: Sync compose resources
        working-directory: frontend/apps/desktop
        run: node scripts/sync-compose-resources.cjs
        env:
          CI_SERVER_IMAGE_TAG: ${{ inputs.server_image_tag }}

      # Same bump as the macOS job. This lane matters most: macOS and Windows
      # skip while their signing secrets are unprovisioned, so the .deb/.rpm
      # produced here is usually the ONLY artifact a release ships — and until
      # this step existed it always reported the checked-in 0.1.0. GNU sed on
      # ubuntu-22.04: `-i` takes no backup-suffix argument (the macOS lane's
      # `-i ''` would be parsed as the sed script and edit nothing).
      - name: Bump version
        working-directory: frontend/apps/desktop/src-tauri
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs');
            const conf = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
            conf.version = '${{ needs.version.outputs.name }}';
            fs.writeFileSync('tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "
          sed -i 's/^version = ".*"/version = "${{ needs.version.outputs.name }}"/' Cargo.toml

      # No signing convention exists for .deb/.rpm in this codebase — this
      # lane always runs, unsigned, per standard Linux distribution practice.
      # No AppImage here (unlike desktop-build.yml): the release lane keeps
      # to the smaller, faster-to-produce set.
      - name: Build
        working-directory: frontend/apps/desktop
        run: |
          npx --yes @tauri-apps/cli@2 build --target x86_64-unknown-linux-gnu \
            -c '{"bundle":{"createUpdaterArtifacts":false}}' -b deb,rpm

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            frontend/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            frontend/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, macos, windows, linux]
    # The old gate was `always() && needs.linux.result == 'success'` alone,
    # which published a release even when macOS or Windows genuinely FAILED
    # (compile error, signing failure, notarization rejection). Nothing else
    # caught it: download-artifact tolerates a missing pattern match and the
    # release action does not fail on unmatched files by default, so a broken
    # platform silently became "a release without that platform".
    #
    # Note what the documented "no signing secrets" case actually looks like
    # here: macos/windows carry no job-level `if:` — only their steps do — so
    # those jobs RUN, skip everything after the secret check, and report
    # 'success', NOT 'skipped'. It therefore passes this gate on the
    # `!= 'failure'` clauses, and only a real failure blocks the release.
    # `always()` is kept because a genuinely skipped `needs` (a job-level
    # `if:` added later, or `version` failing) would otherwise skip this job
    # before any clause below is evaluated. A cancelled run reports
    # 'cancelled', which is likewise not 'failure' — deliberate: a cancel is
    # an operator action, not a broken build.
    if: >-
      always()
      && needs.linux.result == 'success'
      && needs.macos.result != 'failure'
      && needs.windows.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*

      # A release missing macOS/Windows because their signing secrets aren't
      # provisioned is legitimate (see this file's header), but it must never
      # be PRESENTED as a complete one — someone downloading "Desktop 0.1.0"
      # has to see, without opening the assets list, which platforms are in it.
      #
      # Ground truth is the DOWNLOADED ARTIFACT, deliberately NOT
      # needs.<job>.result. The macos/windows jobs carry no job-level `if:` —
      # only their individual steps do (`steps.secrets.outputs.present ==
      # 'true'`) — so with signing secrets absent those jobs still RUN, skip
      # every step after the secret check, and report **success**, never
      # 'skipped'. Keying off that result would have advertised "macOS —
      # signed, notarized .dmg" on exactly the releases that ship no .dmg at
      # all, i.e. every release cut today, which is the mis-presentation this
      # step exists to prevent. artifacts/release-<platform>/ exists iff that
      # job's upload-artifact step actually ran, so it answers the only
      # question the release notes are making a claim about. The job result is
      # still printed, because it is what tells a reader WHY a platform is
      # absent.
      - name: Describe included platforms
        id: platforms
        env:
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          set -euo pipefail
          NAMES=""
          if [ -d artifacts/release-macos ]; then
            NAMES="macOS"
            LINES="- macOS — signed, notarized universal .dmg"
          else
            LINES="- macOS — NOT INCLUDED (no release-macos artifact; macOS job result: ${MACOS_RESULT}. Usual cause: the APPLE_* signing secrets are unprovisioned, which makes every build/sign/notarize step skip.)"
          fi
          if [ -d artifacts/release-windows ]; then
            NAMES="${NAMES:+$NAMES, }Windows"
            LINES="${LINES}"$'\n'"- Windows — signed .msi and setup .exe"
          else
            LINES="${LINES}"$'\n'"- Windows — NOT INCLUDED (no release-windows artifact; Windows job result: ${WINDOWS_RESULT}. Usual cause: the WINDOWS_CERTIFICATE_* signing secrets are unprovisioned, which makes every build/sign step skip.)"
          fi
          # Linux is unconditional here: the job gate above already required
          # needs.linux.result == 'success'.
          NAMES="${NAMES:+$NAMES, }Linux"
          LINES="${LINES}"$'\n'"- Linux — unsigned .deb and .rpm"
          echo "names=${NAMES}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<PLATFORMS_EOF"
            echo "Platforms in this release:"
            echo
            printf '%s\n' "$LINES"
            echo "PLATFORMS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ needs.version.outputs.name }}
          name: Desktop ${{ needs.version.outputs.name }} (${{ steps.platforms.outputs.names }})
          # GitHub appends the generated notes AFTER this body, so the platform
          # inventory stays at the top where it is actually read.
          body: ${{ steps.platforms.outputs.body }}
          generate_release_notes: true
          # macOS/Windows assets may legitimately be absent if their signing
          # secrets aren't provisioned yet — see this file's header comment —
          # which is why the pattern stays a glob. `fail_on_unmatched_files`
          # still catches the other failure mode: artifacts/**/* matching
          # NOTHING, i.e. an empty release, which the action would otherwise
          # publish happily (its default is false).
          fail_on_unmatched_files: true
          files: artifacts/**/*
