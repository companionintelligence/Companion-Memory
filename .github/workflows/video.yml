# Product video — capture the real UI, then render both cuts.
#
# Deliberately NO `push` trigger. CI-Local-CICD's policy gates always-on
# workflows (its README: "CI-Marketplace was fully gated and billing again
# within a day"), so this runs on demand and once a week.
name: Product video

on:
  workflow_dispatch:
    inputs:
      render:
        description: Also render the MP4s (slower)
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    name: Capture and render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The stage is the same one .github/workflows/e2e.yml stands up: the repo's
    # own Postgres image, the setup-database bootstrap, ~147 migrations, the
    # seed, then the two node processes playwright.e2e.config.ts declares in its
    # `webServer` block. Env below is copied from e2e.yml verbatim.
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: companion
      DATABASE_PASSWORD: comp4nion_1ntel_ftw!
      DATABASE_ADMIN_PASSWORD: pgadmin_s3cure!
      ORCHESTRATOR_DATABASE_PASSWORD: t3mporal_ftw!
      DB_HOST_PORT: '5432'
      PORT: '3030'
      E2E_API_PORT: '3030'
      E2E_WEB_PORT: '5173'
      E2E_BASE_URL: http://localhost:5173
      APP_URL: http://localhost:5173
      AUTH_DEFAULT_USER_EMAIL: jsmith@example.com
      AUTH_DEFAULT_USER_PASSWORD: ']60.a6{CJ}lB*rHAp;w;'

      # ── feature flags the storyboard depends on ─────────────────────────────
      # Both map through backend/apps/api/config/custom-environment-variables.json,
      # and the frontend reads flags at runtime from /api/_internal/features, so
      # setting them here is enough — no rebuild.
      #
      # features.actions ships FALSE. FeedPage.tsx:414-416 gates the whole
      # actions block on it AND renders the heading as
      # `actionsEnabled ? 'Actions' : 'Questions'`, so with the default the feed
      # shot's `h2:text-is("Actions")` can never match and the seeded actions
      # (scripts/seed-database/seed-actions.ts) never appear.
      ENABLE_ACTIONS: 'true'
      # features.require.signup.codes ships TRUE and .env.default:65 leaves the
      # override commented out. The fresh-user capture passes below sign up a
      # throwaway account through /api/signup, which 400s without this.
      ENABLE_REQUIRE_SIGNUP_CODES: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          # Without `scope`, setup-node writes a bare `registry=…npm.pkg.github.com`
          # into ~/.npmrc and routes EVERY package there, so public deps (playwright)
          # 404 on install. Scoping keeps GHPR for @companionintelligence only.
          scope: "@companionintelligence"

      # ⚠️ KNOWN BLOCKER — this step is where every run currently dies, in ~16s:
      #
      #   npm error 403 Forbidden - GET
      #   https://npm.pkg.github.com/@companionintelligence%2fvideo-kit
      #   - Permission permission_denied: read_package
      #
      # @companionintelligence/video-kit is a PRIVATE GitHub Packages package
      # published from CI-Common. A repo-scoped GITHUB_TOKEN cannot read a
      # package owned by a different repository unless that package explicitly
      # grants this repo access. Nothing downstream has ever executed, which is
      # why assets/shots/ contains only .gitkeep and every `screen` scene renders
      # video-kit's "capture pending" slate.
      #
      # THE FIX IS NOT IN THIS FILE. In CI-Common's video-kit package settings →
      # "Manage Actions access", add companionintelligence/CI-Server with the
      # Read role. It needs no new secret, and the other 11 product repos hit the
      # same wall. (There is no REST endpoint for this; the package
      # /repositories API 404s. It is a web-UI change.)
      #
      # The fallback below costs nothing and needs no code change if someone
      # would rather provision an org PAT with read:packages as GHPR_READ_TOKEN.
      - name: Install video project
        working-directory: video
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHPR_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Chromium
        working-directory: video
        run: npx playwright install --with-deps chromium

      # ── stage: everything below is lifted from .github/workflows/e2e.yml ────
      - name: Enable Corepack
        run: corepack enable

      - name: Provide .env (dev defaults)
        run: cp .env.default .env

      - name: Install app dependencies
        run: yarn install --immutable

      # The project's Postgres image bundles TimescaleDB + PostGIS + pgvector and
      # the role bootstrap that a stock pgvector image lacks.
      - name: Build database images
        run: |
          make distribute-license
          docker build -f infrastructure/database/Dockerfile -t ci/database:latest infrastructure/database
          docker build -f infrastructure/setup-database/Dockerfile -t ci/setup-database:latest infrastructure/setup-database

      - name: Start Postgres (+ role/extension bootstrap)
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml --profile local up -d database setup-database

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T database pg_isready -U postgres && break
            echo "waiting for postgres ($i)…"; sleep 2
          done

      - name: Run migrations
        run: yarn workspace @ci/be-api migrate

      # Without this every screen in the storyboard films an empty state.
      - name: Seed database
        run: cd backend/apps/api && yarn run exec -- scripts/seed-database/main.ts

      # The same two processes playwright.e2e.config.ts `webServer` boots, with
      # the same commands, ports and env — backgrounded, because `ci-video
      # capture` (not `playwright test`) is what drives them here.
      - name: Start app
        run: |
          yarn workspace @ci/be-api dev &
          WEB_PORT=5173 API_PROXY_TARGET=http://localhost:3030 yarn workspace @ci/fe-web dev &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173 >/dev/null && curl -sf http://localhost:3030/api/authenticate/csrf >/dev/null && break
            echo "waiting for api+web ($i)…"; sleep 3
          done
          curl -sf http://localhost:5173 >/dev/null

      # EXPLICIT --only, not "everything". `ci-video capture` exits 1 if ANY shot
      # fails (bin/ci-video.mjs cmdCapture), and there is no continue-on-error
      # here — so a bare `npm run capture` takes the whole job down before the
      # three identity-specific passes below ever run, and assets/shots/ stays
      # empty. Four of the storyboard's fifteen shots are structurally impossible
      # as the seeded, already-onboarded jsmith:
      #   splash-screen / login-form  — `/` and `/login` are wrapped in
      #     RedirectKnownUser (App.tsx:117-121, :147-152), which Navigates an
      #     authenticated onboarded user to /feed.
      #   onboarding-focus / onboarding-connect — OnboardingPage.tsx:231-233
      #     returns <Navigate to="/feed" replace /> for an onboarded user, and
      #     seed-users.ts:41 onboards jsmith.
      # Those four belong to the passes below. This list is the other eleven.
      #
      # A shot added to storyboard.json but to no pass here is not silent: it
      # has no PNG, and `ci-video check` (video-kit >= 0.1.2) fails on missing
      # shot files unless --allow-slates is passed.
      - name: Capture (authenticated)
        working-directory: video
        run: |
          SHOTS=feed-overview,memory-list-view,memory-detail-sheet,memory-gallery-view
          SHOTS=$SHOTS,memory-search-results,memory-map-view,memory-graph-view
          SHOTS=$SHOTS,people-directory,insights-list,insight-detail-view,connect-providers
          npm run capture -- --only "$SHOTS"

      # `/` and `/login` redirect an authenticated user to /feed, and capture
      # shares one browser context per viewport — so the two signed-out shots
      # need their own pass.
      - name: Capture (signed-out shots)
        working-directory: video
        env:
          VIDEO_LOGGED_OUT: '1'
        run: npm run capture -- --only splash-screen,login-form

      # The seeded user is already onboarded (seed-users.ts:41 calls
      # userService.onboard), so OnboardingPage redirects it to /feed and the
      # wizard is unreachable — see tests/e2e/onboarding.spec.ts:3-9. Each pass
      # signs up its own throwaway account via /api/signup.
      #
      # TWO separate invocations, one shot each, on purpose: onboarding progress
      # is persisted server-side per user, so a second shot sharing the account
      # would resume mid-wizard behind a "Welcome back" banner.
      - name: Capture (onboarding — focus areas, fresh account)
        working-directory: video
        env:
          VIDEO_FRESH_USER: '1'
        run: npm run capture -- --only onboarding-focus

      - name: Capture (onboarding — connect a source, fresh account)
        working-directory: video
        env:
          VIDEO_FRESH_USER: '1'
        run: npm run capture -- --only onboarding-connect

      # Shots are byte-stable, so a diff here means the UI genuinely changed.
      # Surface it as a PR rather than silently committing to the branch.
      - name: Detect UI drift
        id: drift
        working-directory: video
        run: |
          if [ -n "$(git status --porcelain assets/shots)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain assets/shots
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check
        working-directory: video
        run: npm run build && npm run check

      - name: Render
        if: ${{ github.event_name == 'schedule' || inputs.render }}
        working-directory: video
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: ci-memory-video
          path: |
            video/out/*.mp4
            video/assets/shots/*.png
          if-no-files-found: warn

      - name: Open a PR when the UI drifted
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/video-shot-refresh
          title: "chore(video): refresh Companion Memory product-video captures"
          body: |
            The scheduled capture produced different screenshots, which means the UI changed.

            Review the image diff, update `video/storyboard.json` captions if a screen's meaning
            changed, then merge to re-render the product video from the current UI.
          add-paths: video/assets/shots
          commit-message: "chore(video): refresh product-video captures"
