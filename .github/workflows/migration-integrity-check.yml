name: Migrations

on:
  pull_request:
    # `edited` re-runs the check when the PR title changes, since the
    # [squash-migrations]/[fix-migrations] mode is read from the title.
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'backend/apps/api/db/postgres/migrations/**'
      # The checker and its wiring, so a change to either is exercised by the
      # job that runs it — not first discovered inside the production image.
      - 'backend/apps/api/bin/check-migration-versions.js'
      - 'backend/apps/api/package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-versions:
    name: Check migration version collisions
    runs-on: ubuntu-latest
    container:
      image: node:22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check migration versions
        run: yarn workspace @ci/be-api check:migrations

  check-migrations:
    name: Check migration integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for modified migrations
        # The PR title and base ref reach the script as environment variables,
        # never as ${{ }} interpolation. Interpolation is substituted into the
        # script *before* bash parses it, so a PR titled `"; curl …|sh; #` would
        # execute as code — and `types: [edited]` means retitling re-triggers the
        # job. Harmless while this workflow was dispatch-only (the context was
        # always empty); restoring the pull_request trigger arms it.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Fetch the base branch to ensure we can compare against it
          git fetch origin "$BASE_REF"

          # Check for changes in the migrations directory
          ALL_CHANGES=$(git diff --name-status "origin/$BASE_REF" HEAD -- backend/apps/api/db/postgres/migrations)

          # Committed migrations are immutable: normally only additions (A)
          # are allowed. Two exceptions, declared in the PR title:
          #   [squash-migrations]  consolidate history: deletions + additions,
          #                        never renames or in-place modifications
          #   [fix-migrations]     repair broken migrations (e.g. a version
          #                        collision): renames allowed too; only
          #                        in-place modification stays forbidden
          MODE=normal

          if [[ "$PR_TITLE" == *"[fix-migrations]"* ]]; then
            MODE=fix
            echo "Migration fix mode detected."
          elif [[ "$PR_TITLE" == *"[squash-migrations]"* ]]; then
            MODE=squash
            echo "Migration squashing mode detected."
          fi

          case "$MODE" in
            fix)    FORBIDDEN='^M';     ALLOWED="additions, deletions, and renames" ;;
            squash) FORBIDDEN='^[MR]';  ALLOWED="additions and deletions" ;;
            *)      FORBIDDEN='^[MRD]'; ALLOWED="additions" ;;
          esac

          FORBIDDEN_CHANGES=$(echo "$ALL_CHANGES" | grep -E "$FORBIDDEN") || true

          if [ -n "$FORBIDDEN_CHANGES" ]; then
            echo "FAILURE: in $MODE mode only these migration changes are allowed: $ALLOWED."
            echo "Committed migrations are immutable; create a new migration file instead."
            echo ""
            echo "To declare an exception, tag the PR title:"
            echo "  [squash-migrations]  consolidate migrations (delete + add)"
            echo "  [fix-migrations]     rename/reissue broken migrations"
            echo ""
            echo "Detected forbidden changes:"
            echo "$FORBIDDEN_CHANGES"
            exit 1
          fi

          echo "Migration integrity check passed ($MODE mode: $ALLOWED allowed)."
