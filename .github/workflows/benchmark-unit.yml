name: Benchmark unit tests + regression gate

# Runs only when files in scripts/benchmark/ change. The benchmark is a
# self-contained Python suite — the CI-Server backend doesn't need to be built.
on:
  pull_request:
    paths:
      - scripts/benchmark/**
      - .github/workflows/benchmark-unit.yml
  push:
    branches: [main]
    paths:
      - scripts/benchmark/**
      - .github/workflows/benchmark-unit.yml

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/benchmark/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt

      # This job is the only check that runs automatically for THIS path (it
      # was the only automatic check anywhere until `pr-gate.yml` landed on
      # 2026-09-06 and started running on every PR with no path filter — but
      # pr-gate runs no Python, so `scripts/benchmark/**` is still covered here
      # or nowhere), and until now it ran pytest and no linter — which is exactly how 141
      # ruff violations reached this directory unnoticed while `ci.yml`'s
      # `python` lane (`uv run ruff check .`, which covers scripts/benchmark
      # from the root config) sat undispatched. See
      # `docs/qa/ci-gate-proposal.md` §3.2.
      #
      # Pinned to the version `uv.lock` resolves so this lane and `ci.yml`'s
      # agree on what a violation is; an unpinned `pip install ruff` would let a
      # new release turn a passing PR red with no change of ours.
      #
      # There is no config here: `scripts/benchmark/pyproject.toml` has no
      # `[tool.ruff]` section, so ruff walks up and uses the repo-root one —
      # the same rules the Python lane applies to the sidecars.
      #
      # HONEST NOTE, measured 2026-09-03 on this checkout: this directory is
      # currently at 141 errors (119 of them `--fix`-able) and 22 files that
      # `ruff format` would rewrite. So this step is RED on the first run and
      # stays red until someone clears it, from `scripts/benchmark`:
      #
      #     ruff check --fix . && ruff format .
      #
      # That redness is the accurate state of the directory. Deliberately no
      # `continue-on-error` and no path scoping to hide it — a check that does
      # not fail on what it found is the false comfort this step exists to end.
      #
      # It runs AFTER pytest for that same reason: a failing step ends the job,
      # and the pre-existing lint debt must not swallow the test signal that
      # already worked.
      - name: Run pytest
        run: pytest

      - name: Lint
        run: |
          pip install ruff==0.16.1
          ruff check .
          ruff format --check .

  # Re-runs the naive adapter on every committed persona and compares against
  # the JSON baselines under scripts/benchmark/baselines/. Naive is fully
  # deterministic (BoW + keyword scorer), so any drift here is real signal —
  # either the persona content moved or the adapter logic regressed. Adapters
  # that need external services (ci_server, mem0, hindsight) are out of scope
  # for the CI gate; this job is the deterministic floor.
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/benchmark/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt

      - name: Regression check — jordan_rivera
        run: |
          mkdir -p reports
          python -m benchmark \
            --persona personas/jordan_rivera.json \
            --systems naive \
            --baseline baselines/naive_jordan.json \
            --tolerance 0.05 \
            --out reports/jordan.md

      - name: Regression check — priya_sharma
        run: |
          mkdir -p reports
          python -m benchmark \
            --persona personas/priya_sharma.json \
            --systems naive \
            --baseline baselines/naive_priya.json \
            --tolerance 0.05 \
            --out reports/priya.md

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: scripts/benchmark/reports/
          if-no-files-found: ignore
