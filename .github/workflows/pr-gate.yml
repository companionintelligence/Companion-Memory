name: PR gate

# ═══════════════════════════════════════════════════════════════════════════
# THE ONE THING THAT RUNS ON EVERY PULL REQUEST.
# ═══════════════════════════════════════════════════════════════════════════
#
# ── Why this is a separate file and not a trigger on ci.yml ──────────────
#
# `docs/qa/ci-gate-proposal.md` §3.1 proposes adding `pull_request:` to
# `ci.yml`. This implements the cheap half of that recommendation in a file of
# its own instead, because the reason every workflow here was gated to manual is
# COST — GitHub Actions was running at roughly $563/month for checks the org
# already owns hardware for (`docs/CI.md`) — and a cost decision should be
# revertible in one move. Deleting this file returns the repository to exactly
# where it was; `ci.yml` is untouched and stays `workflow_dispatch`-only.
#
# ── What it runs, and what it deliberately does not ─────────────────────
#
# Lint (4 lanes) + typecheck (3 lanes) + the frontend unit suite + the web
# bundle build + the two dependency-free mobile guards + the dependency-free
# desktop resolver suite. The proposal prices the
# full `ci.yml` at ~8-14 min of runner time per PR and the lint/typecheck subset
# at ~2-3 min, and that subset would still have caught 3 of the 8 defect classes
# in `docs/qa/baseline-2026-08-26.md` — including all 334 lint/format violations
# that reached `main` in three days with nothing run.
#
# The mobile guards were added for the same reason and at near-zero marginal
# cost — see the `mobile-guards` job, and `desktop-guards`, which was added on
# the same bargain. Everything here is still deliberately the
# CHEAP half in the sense that matters: no Docker, no Postgres, no
# Xcode/Gradle, no secrets, no GPU. A check that needs a simulator or a real
# `cap sync` belongs in `mobile-build.yml`, which stays on dispatch.
#
# ── What the newer jobs cost, stated honestly ────────────────────────────
#
# `test-frontend`, `build-web` and the `packages` typecheck lane were added
# after the four original lanes and they are NOT free. Rough per-PR estimate,
# extrapolated from local runs on a fast many-core developer machine (the suite
# in 21s, each `tsc && vite build` in ~15s, the whole-tree typecheck in ~40s)
# and from `docs/qa/baseline-2026-08-29.md` §3.2, which measured the same suite
# at 673s of wall clock on a developer machine:
#
#     test-frontend   ~7-10 min each x 4 shards  (381 files / 3,714 cases,
#                     no coverage; ~28-40 runner-min total, ~7-10 wall)
#     build-web       ~8-12 min    (two full `tsc && vite build` runs)
#     typecheck pkgs  ~3-5 min     (re-runs the two lanes above it, by design)
#
# So roughly 40-55 runner-minutes on top of the ~10 the six lint/typecheck
# lanes and the guards already cost — call it five times this workflow's
# previous per-PR bill. That is a real number against the ~$563/month that
# gated every workflow here in the first place (`docs/CI.md`), and it buys the
# only automated proof on a PR that the React app compiles into a shippable
# bundle and that its 3,714 test cases still pass. If the bill has to come
# down, delete jobs from here — the cost decision stays revertible in one move,
# which is the whole reason this file exists.
#
# The Python lanes and the DB-backed backend suite remain the expensive half
# and stay on dispatch:
#
#     gh workflow run ci.yml --ref <branch>
#
# ── Running is not blocking ──────────────────────────────────────────────
#
# `main` carries no `required_status_checks` and
# `required_approving_review_count: 0`, so a red run here stops nothing on its
# own. Blocking additionally requires someone with admin adding these contexts
# to branch protection (proposal §3.4 — do it only once a green run exists on
# `main`, since a context that never reports blocks every PR forever):
#
#     Lint root, Lint backend, Lint frontend, Lint format,
#     Type check backend, Type check frontend
#
# Those six names match `ci.yml`'s jobs on purpose, so a deliberately dispatched
# `ci.yml` reports the same contexts and satisfies the same rule rather than
# sitting beside it as a near-duplicate.
#
# `Run frontend tests` is NO LONGER in that list, and the reason is the sharding
# below. This copy reports four contexts — `Run frontend tests (1/4)` through
# `(4/4)` — while `ci.yml` runs the suite unsharded as a single
# `Run frontend tests`. The names therefore no longer coincide, so requiring the
# sharded four would mean only a `pull_request` run can ever satisfy them and a
# dispatched `ci.yml` on a hotfix could not clear the rule. Require them anyway
# if you accept that trade — they ARE the more thorough check — but do it with
# eyes open, and require all four or none, since each shard covers a disjoint
# quarter of the files and any single one passing proves nothing about the rest.
#
# `Mobile native guards`, `Desktop native guards`, `Build web bundle` and
# `Type check packages` are deliberately NOT in that list: none of the four has
# a twin in `ci.yml`, so
# requiring one would mean only a `pull_request` run can ever satisfy it, and a
# dispatched `ci.yml` on a hotfix could no longer clear the rule. Add one only
# if `ci.yml` grows the same job — and note that giving `Type check packages` a
# twin there is a release decision, not a tidying one: `publish.yml`'s gate asks
# only whether `ci.yml` concluded success, so every lane added there is a lane
# that can block a release. It is green as of 2026-09-07, but it had never been
# run before that day.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same container, corepack step and cache key as `ci.yml`, so the two share
  # one warm cache instead of each paying for its own cold install.
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: node:22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Cache node modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    name: Type check ${{ matrix.name }}
    needs: install
    runs-on: ubuntu-latest
    container:
      image: node:22
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            command: yarn workspace @ci/be-api typecheck
          - name: frontend
            command: yarn workspace @ci/fe-web typecheck
          # The eight `frontend/packages/*` workspaces — @ci/common, @ci/capture,
          # @ci/editor, @ci/shadcn, the three Capacitor plugins and @ci/template
          # — are typechecked by NO job anywhere in this repo. The two lanes
          # above name @ci/be-api and @ci/fe-web explicitly and nothing else runs
          # tsc, yet that is the shared layer every target compiles into its
          # bundle (web, both Capacitor shells, and the Tauri desktop app), so a
          # type error there reaches all four and is caught by none of them.
          #
          # `foreach --all` rather than eight more matrix entries: it picks up
          # any workspace that HAS a `typecheck` script and prints
          # "Excluding . because it doesn't have a typecheck script" for the ones
          # that don't, so a workspace added later is covered without editing
          # this file. It re-runs the two lanes above as a side effect; that is
          # under a minute of duplication and it is what makes the lane
          # self-maintaining.
          #
          # This lane earned its runtime on its first execution: three of the
          # eight (@ci/capture, @ci/common, @ci/editor) failed with
          # `Cannot find module '@/lib/utils'`, raised from two @ci/shadcn
          # sources — `src/components/ui/kbd.tsx` and
          # `src/components/ui/shadcn-io/spinner/index.tsx`, both of which the
          # `shadcn add` CLI writes with the `@/` alias that only @ci/shadcn's
          # own tsconfig declares. @ci/shadcn typechecked clean on its own the
          # entire time; every consumer did not. Fixed 2026-09-07 (relative
          # imports), and green since — but that was three of eight workspaces
          # broken with no check in the repo capable of noticing.
          #
          # `foreach` has no `--no-bail`, so it stops at the FIRST failing
          # workspace: expect to fix failures one at a time and re-run rather
          # than seeing them all at once.
          - name: packages
            command: yarn workspaces foreach --all run typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check ${{ matrix.name }}
        run: ${{ matrix.command }}

  lint:
    name: Lint ${{ matrix.name }}
    needs: install
    runs-on: ubuntu-latest
    container:
      image: node:22
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            command: yarn lint
          - name: backend
            command: yarn workspace @ci/be-api lint
          - name: frontend
            command: yarn workspace @ci/fe-web lint
          - name: format
            command: yarn format:check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint ${{ matrix.name }}
        run: ${{ matrix.command }}

  # The frontend unit/component suite — 381 files and 3,714 cases when measured
  # on 2026-09-07 — on every PR.
  #
  # Deliberately named identically to `ci.yml`'s job so one branch-protection
  # context covers both (see the header). It is the only automated check that
  # exercises the React app's behaviour at all: `ci.yml` has the same job but is
  # `workflow_dispatch`-only, so before this existed the suite ran when somebody
  # remembered, which `docs/qa/` shows was rarely.
  #
  # Prerequisite for this job being worth running: the suite has to be able to
  # fail for a real reason. It could not, until `frontend/apps/web/vitest.config.ts`
  # got a 20s `testTimeout` — every one of the 7 failures in the QA baseline was
  # a 5s timeout under parallel load, not an assertion, and each passed on an
  # isolated re-run. A gate that goes red at random teaches people to ignore it.
  # SHARDED, and the shard count is not decoration — it is the fix for a
  # measured failure. The first real run of this job on a hosted runner
  # (run 34180056712, 2026-09-08) was killed by its own 20-minute step ceiling
  # while still executing tests, having got nowhere near the end: not a test
  # failure, just a suite that does not fit a 2-core runner in one job.
  #
  # Measured, so the next person does not have to re-derive it. Locally the
  # whole suite is 27s on a 128-core box; constrained to two workers to
  # approximate the runner it is 355s wall / 14m28s of CPU, and the profile is
  # dominated by `collect` (311s) — module transform and load, not the 79s the
  # assertions themselves cost. A hosted 2-core runner is slower per core than
  # that box, which is how 20 minutes was not enough.
  #
  # Four shards rather than one bigger timeout: `--shard=i/4` splits the FILE
  # set, so each job pays its own fixed setup but a quarter of the collect cost,
  # landing around 7-10 minutes and leaving real headroom under the ceiling.
  # Total runner-minutes are similar to one long job; wall-clock is a quarter,
  # and a flake re-runs one shard instead of all 381 files.
  test-frontend:
    name: Run frontend tests (${{ matrix.shard }}/4)
    needs: install
    runs-on: ubuntu-latest
    # Headroom over the step ceiling below, the same split `ci.yml`'s backend
    # `test` job explains at length: a JOB timeout cancels the whole job, is
    # reported as `cancelled`, names no step and skips every remaining step, so
    # nothing can report on the way out. A STEP timeout fails that step and lets
    # the job finish normally.
    timeout-minutes: 25
    container:
      image: node:22
    strategy:
      # Every shard reports. One slow or broken shard must not hide the other
      # three, which is the whole point of splitting the file set.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No `--coverage`, unlike `ci.yml`'s copy of this job. Coverage belongs
      # where the report is actually collected — `ci.yml` uploads it as an
      # artifact — and v8 instrumentation would only make the gate slower here
      # to produce a report that is thrown away with the runner.
      #
      # 18 minutes against a shard expected to take 7-10 (see the sharding note
      # on the job). The previous single-job form used 20 against the WHOLE
      # suite and was killed by it mid-run; if a quarter of the files now
      # approaches this ceiling, the suite has stopped making progress rather
      # than merely got slower.
      #
      # `--shard` splits by file, so the four jobs together cover the suite
      # exactly once. Vitest exits non-zero on an empty shard, so a mis-typed
      # denominator fails loudly instead of silently testing nothing.
      - name: Run frontend unit/component tests (shard ${{ matrix.shard }}/4)
        timeout-minutes: 18
        run: yarn workspace @ci/fe-web test --shard=${{ matrix.shard }}/4

  # The PWA guard, and the only thing in this repo that proves the web app still
  # BUILDS on a pull request.
  #
  # `frontend/apps/web/vite.config.ts` gates the entire VitePWA plugin behind
  # `!disablePwa`, and both Capacitor shells build with VITE_DISABLE_PWA=true
  # (`frontend/apps/{ios,android}/package.json` → `build:web`, and
  # `mobile-build.yml`'s workflow-level env) because a Workbox service worker
  # inside the webview fights Capacitor's local asset serving and turns every
  # now cross-origin `/api` call into a cache decision. Delete the
  # `!disablePwa &&` guard — or refactor in any way that stops the env var
  # reaching the config — and the build still succeeds, every unit test still
  # passes, and a service worker ships inside both native bundles. The first
  # symptom is a broken app on a real phone, discovered after review.
  #
  # No unit test can substitute: the thing under test is a build-time plugin
  # list, so the check has to be a build, run twice, with the difference
  # asserted. Still the cheap half — plain node, no Xcode, no Gradle, no
  # simulator. Actually installing the bundle in a webview belongs in
  # `mobile-build.yml`.
  build-web:
    name: Build web bundle
    needs: install
    runs-on: ubuntu-latest
    # Two full `tsc && vite build` runs plus the install. See the cost note in
    # the header for where the estimate comes from.
    timeout-minutes: 30
    container:
      image: node:22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-modules-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `shell: bash` on both steps below for the reason spelled out in
      # `mobile-guards`: the default shell in the node:22 container is dash,
      # which has no `set -o pipefail`.
      - name: Build with the PWA on, and assert the service worker ships
        shell: bash
        run: |
          set -euo pipefail
          # `rm -rf dist` even though Vite empties outDir itself. The NEXT step
          # asserts files are ABSENT, and an assertion that can pass because of
          # what a previous build did or did not leave behind is not an
          # assertion.
          rm -rf frontend/apps/web/dist
          yarn workspace @ci/fe-web build

          # vite-plugin-pwa 1.0.3 defaults `filename` to `sw.js`, and in
          # generateSW mode (the default, and what vite.config.ts uses) it emits
          # dist/sw.js, dist/workbox-<hash>.js, dist/registerSW.js and
          # dist/manifest.webmanifest. Read off a real build of this app rather
          # than guessed — `dist/sw.js` is the name to assert, not `service-worker.js`.
          for f in sw.js registerSW.js manifest.webmanifest; do
            if [ ! -f "frontend/apps/web/dist/$f" ]; then
              echo "::error::the default build produced no dist/$f, so the VitePWA plugin did not run. Either the plugin is gone from vite.config.ts, or VITE_DISABLE_PWA leaked into this build — in which case the next step proves nothing, because both builds would be identical."
              exit 1
            fi
          done

          # The main chunk was 2.28 MB at the time of writing against the 3 MB
          # `maximumFileSizeToCacheInBytes` in vite.config.ts (whose own comment
          # records ~2.11 MB — it has grown since). Cross that line and Workbox
          # silently DROPS the file from the precache manifest while the build
          # still exits 0: the app then installs a service worker that does not
          # precache its own entry bundle, and offline load breaks with nothing
          # red anywhere. The limit is read out of vite.config.ts rather than
          # duplicated here, so raising it there does not leave a stale number
          # in this file.
          # `|| true` because `set -o pipefail` + `set -e` would otherwise abort
          # the step on grep's exit 1 before the explanatory error below could
          # print, leaving a maintainer with a bare non-zero exit.
          entry=$(grep -o 'src="/assets/index-[^"]*\.js"' frontend/apps/web/dist/index.html | head -n1 | sed 's/^src="\///; s/"$//' || true)
          if [ -z "$entry" ]; then
            echo "::error::could not find the entry chunk (assets/index-*.js) in dist/index.html, so the precache assertions below would check nothing. Fix this parse rather than dropping the check."
            exit 1
          fi
          mb=$(sed -n 's/.*maximumFileSizeToCacheInBytes: \([0-9][0-9]*\) \* 1024 \* 1024.*/\1/p' frontend/apps/web/vite.config.ts)
          if [ -z "$mb" ]; then
            echo "::error::could not read maximumFileSizeToCacheInBytes out of frontend/apps/web/vite.config.ts. The size check has become a no-op — fix the parse (or this step is lying about what it verified)."
            exit 1
          fi
          limit=$((mb * 1024 * 1024))
          size=$(stat -c%s "frontend/apps/web/dist/$entry")
          echo "entry chunk $entry is ${size} bytes against the ${limit} byte workbox precache limit"
          if [ "$size" -ge "$limit" ]; then
            echo "::error::${entry} is ${size} bytes, at or over the ${limit} byte maximumFileSizeToCacheInBytes in vite.config.ts. Workbox will drop it from the precache manifest and the build will still pass. Either split the chunk or raise the limit deliberately."
            exit 1
          fi

          # Ground truth, and not redundant with the size check above: the entry
          # can also fall out of the manifest through a globPatterns or
          # navigateFallback change that has nothing to do with size.
          if ! grep -qF "$entry" frontend/apps/web/dist/sw.js; then
            echo "::error::${entry} is missing from the precache manifest in dist/sw.js. The service worker would not precache the app's own main bundle."
            exit 1
          fi

      - name: Build with VITE_DISABLE_PWA=true, and assert no service worker ships
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/apps/web/dist
          # Byte-identical to what the two shells run as `build:web`.
          VITE_DISABLE_PWA=true yarn workspace @ci/fe-web build

          # Positive check FIRST. Without it every "must not exist" assertion
          # below is satisfied by a build that produced nothing at all, which is
          # the classic way this shape of guard rots into a no-op.
          if [ ! -f frontend/apps/web/dist/index.html ]; then
            echo "::error::the VITE_DISABLE_PWA=true build produced no dist/index.html, so the assertions below would pass vacuously."
            exit 1
          fi

          leaked=$(find frontend/apps/web/dist -maxdepth 1 \( -name 'sw.js' -o -name 'registerSW.js' -o -name 'workbox-*.js' -o -name 'manifest.webmanifest' \) | sort)
          if [ -n "$leaked" ]; then
            echo "PWA output found in a VITE_DISABLE_PWA=true build:"
            printf '%s\n' "$leaked"
            echo "::error::VITE_DISABLE_PWA=true still emitted PWA output. Both Capacitor shells build this way, so a Workbox service worker would ship inside the iOS and Android webviews and fight Capacitor's asset serving and the cross-origin /api calls. Restore the '!disablePwa &&' guard in frontend/apps/web/vite.config.ts."
            exit 1
          fi
          echo "no service worker, registerSW or webmanifest in the native bundle — as intended"

  # The only mobile-lane verification that runs on a pull request anywhere in
  # this repo. `mobile-build.yml` — the workflow that would actually catch a
  # broken Podfile or a missing `cap sync` by building the thing — is
  # `workflow_dispatch`-only, and the guards below otherwise run ONLY from
  # lint-staged (.lintstagedrc), i.e. only in a pre-commit hook, which is itself
  # inert in the git worktrees the agents work in. So a PR could add a Capacitor
  # plugin without running `cap sync`, or duplicate a top-level key in
  # Info.plist, and merge with every check green. Both classes have actually
  # happened here: `docs/qa/baseline-2026-08-26.md` §6.6 found the committed
  # Capacitor generated files stale against a fresh `cap sync`, and
  # check-plist-duplicate-keys.mjs's own header records ten duplicate top-level
  # pairs in App/Info.plist, one of which ate a real ATS setting.
  #
  # Deliberately still the cheap half (see this file's header): both scripts are
  # dependency-free Node with no imports outside `node:fs`/`node:path`, so this
  # job skips the install entirely — no `needs: install`, no yarn, no cache. It
  # is checkout + `node`, seconds of runner time. It does NOT run `cap sync`
  # itself; that needs CocoaPods/Gradle and stays in `mobile-build.yml`.
  mobile-guards:
    name: Mobile native guards
    runs-on: ubuntu-latest
    # Nothing here should take more than a few seconds; a minute is already a
    # sign something hung rather than failed.
    timeout-minutes: 5
    container:
      image: node:22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No arguments on purpose. The script's own header documents both call
      # shapes: lint-staged passes the staged paths (which it ignores, since the
      # comparison is inherently cross-file), and a bare run scans the whole
      # tree — which is what a PR gate wants. It resolves
      # `frontend/apps/{android,ios}/...` relative to the CWD, so this must run
      # from the repo root.
      - name: Check Capacitor native sync
        run: node scripts/check-capacitor-native-sync.mjs

      # This one is the opposite: it checks ONLY the files named in argv (see
      # its `for (const file of process.argv.slice(2))` loop) and exits 0 with a
      # bare run, so the file list has to be built here. Discovered rather than
      # hard-coded so a plist added later is covered without editing this file —
      # and the count is asserted, because an empty list would make the step
      # pass while checking nothing, which is exactly the failure mode this
      # whole job exists to remove.
      # `shell: bash` is load-bearing, not decoration. Every job in this file
      # runs in the `node:22` container, where the default shell for a `run:`
      # block is `sh -e` — that is dash, which has neither `set -o pipefail`
      # nor `mapfile`, and the first run of this job failed with
      # `set: Illegal option -o pipefail` before checking a single plist. The
      # image does ship bash, so ask for it explicitly rather than rewriting
      # the array handling in POSIX sh.
      - name: Check iOS plists for duplicate top-level keys
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t plists < <(find frontend/apps/ios -name '*.plist' -not -path '*/node_modules/*' | sort)
          if [ "${#plists[@]}" -eq 0 ]; then
            echo "::error::found no .plist files under frontend/apps/ios — the guard would have checked nothing"
            exit 1
          fi
          printf 'checking %s\n' "${plists[@]}"
          node scripts/check-plist-duplicate-keys.mjs "${plists[@]}"

      # Same argv-driven shape and the same non-empty assertion as the plist
      # step above, for the same reason.
      #
      # This guards a trap canon created: an XML comment may not contain two
      # consecutive hyphens, and every canon design token's real name begins
      # with exactly that sequence, so naming one in a comment is both the
      # natural thing to write and a syntax error. #2686 did it in
      # android/.../res/values/colors.xml and left `main` unable to build the
      # Android app at all. aapt2 does catch it — from
      # `:app:mergeDebugResources`, two minutes into a Gradle build, in
      # `mobile-build.yml`, which is `workflow_dispatch`-only, so nobody saw it
      # for days. Here it is milliseconds on every PR.
      - name: Check XML comments (Android res, iOS config)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t xml < <(find frontend/apps/android frontend/apps/ios -name '*.xml' \
            -not -path '*/node_modules/*' -not -path '*/build/*' -not -path '*/Pods/*' | sort)
          if [ "${#xml[@]}" -eq 0 ]; then
            echo "::error::found no .xml files under the native app dirs — the guard would have checked nothing"
            exit 1
          fi
          printf 'checking %s\n' "${xml[@]}"
          node scripts/check-xml-comments.mjs "${xml[@]}"

  # The desktop image-tag resolver's own test suite, on every PR.
  #
  # `frontend/apps/desktop/scripts/sync-compose-resources.cjs` decides which
  # server images a SHIPPED desktop app pulls: its answer is written to
  # src-tauri/resources/image-tag.txt, baked into the signed .dmg/.msi/.deb, and
  # handed to `docker compose pull` the first time a user launches the app. A
  # wrong answer does not fail any build — it 404s at first launch, on the
  # user's machine, with nothing red anywhere. That has already shipped twice
  # (an unpublished `dev-<sha>` tag, and `git describe --exact-match` returning
  # the release's own `desktop-v*` tag); the suite exists because both fixes
  # were guarded by prose comments alone.
  #
  # Its own job rather than a step on `mobile-guards`, whose name is a
  # branch-protection context that must keep meaning what it says. Its own job
  # rather than a step in `desktop-build.yml`, which is `workflow_dispatch`-only
  # and now the desktop RELEASE gate: putting the check only there means drift
  # introduced in an ordinary PR is discovered when somebody is trying to cut a
  # release, which is the exact pattern this whole file exists to undo.
  #
  # Cost, stated as honestly as the header does for the jobs above: bare node,
  # no `yarn install`, no `needs:`, no Docker, no toolchain. The suite itself is
  # ~60 ms; the bill is the runner's one rounded-up minute. That is the same
  # "near-zero marginal cost" bargain `mobile-guards` was added on.
  desktop-guards:
    name: Desktop native guards
    runs-on: ubuntu-latest
    # As with `mobile-guards`: nothing here should take seconds, let alone
    # minutes. A minute is already a sign something hung rather than failed.
    timeout-minutes: 5
    container:
      image: node:22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The file list is DISCOVERED and asserted non-empty rather than passed as
      # a glob, for a measured reason: `node --test 'some/path/*.test.cjs'` with
      # zero matches exits 0 and reports `# pass 0`. So the obvious form of this
      # lane would go green having run nothing the moment a test file is renamed
      # or moved — the same vacuous pass the plist step above discovers its own
      # inputs to avoid. Naming the files explicitly also sidesteps the bare
      # directory form, which does not recurse on this repo's pinned Node
      # (22.15.1) and instead reports one confusing MODULE_NOT_FOUND failure.
      #
      # `shell: bash` for the reason spelled out in `mobile-guards`: the default
      # shell in the node:22 container is dash, which has neither
      # `set -o pipefail` nor `mapfile`.
      - name: Run the desktop compose-resource resolver tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t suites < <(find frontend/apps/desktop/scripts -name '*.test.cjs' -not -path '*/node_modules/*' | sort)
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::found no *.test.cjs under frontend/apps/desktop/scripts — the guard would have checked nothing. Restore the suite or delete this job deliberately; do not leave it green and empty."
            exit 1
          fi
          printf 'running %s\n' "${suites[@]}"
          node --test "${suites[@]}"

  migration-guard:
    name: Migration versions
    runs-on: ubuntu-latest
    # Seconds, like the other guards. No install, no cache, no services.
    timeout-minutes: 5
    container:
      image: node:22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The guard whose absence is already documented as having cost this repo a
      # real outage. dbmate keys `schema_migrations` on the numeric filename
      # prefix, so two branches that each hand-pick a round timestamp merge into
      # a duplicate prefix that makes `migrate` fail for everyone — including on
      # an installed appliance mid-upgrade. The script's own header names the
      # 20260628120000 collision that did exactly that, and 57 migrations in the
      # tree still carry hand-written `…120000`-shaped stamps.
      #
      # `check:migrations` already runs from lint-staged and from `yarn migrate`
      # (inside the production image), and `migration-integrity-check.yml` runs
      # it too — but that workflow is `workflow_dispatch`-only, so before this
      # job the check ran on no pull request anywhere. It resolves the migrations
      # directory from its own `__dirname` rather than the CWD, so the line below
      # is the whole invocation, and it imports only `node:fs`/`node:path` —
      # which is why it needs no install.
      - name: Check migration versions
        run: node backend/apps/api/bin/check-migration-versions.js
