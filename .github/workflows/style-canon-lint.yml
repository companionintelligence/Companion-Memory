name: Style canon lint

# GATED TO MANUAL. Every trigger except workflow_dispatch was removed so this
# workflow no longer runs on push, pull_request or a schedule — CI silence here
# means "nobody dispatched it", NOT "everything passed". Run it deliberately:
#   gh workflow run <file> --ref <branch>
# Restore a trigger by re-adding it to the `on:` block below.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-canon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      # ci-lint-canon (@companionintelligence/config) reads the canon + retired list from the
      # tokens package; @companionintelligence/assets is the origin of the brand files.
      - run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn lint:canon
