name: Mobile Build

# Builds the native iOS + Android apps — the Capacitor thin client that wraps the
# @ci/fe-web build (frontend/apps/mobile). Modelled on CI-Hub's desktop-build.yml.
#
# Runs on manual dispatch and on `mobile-v*` tags. By default it produces UNSIGNED
# artifacts that need no secrets:
#   • Android — a debug APK (sideload-installable; not for store distribution)
#   • iOS     — a Simulator .app (runs in the iOS Simulator; not device-installable)
# Signed, device-/store-ready artifacts (release APK/AAB, signed .ipa) require the
# signing secrets documented in frontend/apps/mobile/README.md → "CI builds".

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

# The root install pulls the private @companionintelligence/tokens package from GitHub
# Packages; .yarnrc.yml authenticates with ${NODE_AUTH_TOKEN}. Without `packages: read`
# the job's GITHUB_TOKEN cannot read it and every install fails as an anonymous user.
permissions:
  contents: read
  packages: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # PWA off for the native build — the Workbox service worker fights Capacitor's local
  # asset serving inside the webview.
  VITE_DISABLE_PWA: 'true'

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js + Corepack (Yarn 4)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable

      # Root install (Yarn PnP), then build the web bundle the app ships via webDir.
      - name: Install root dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web bundle
        run: yarn workspace @ci/fe-web build

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # The mobile project is a STANDALONE (non-workspace) Yarn project with a
      # node-modules linker — installed on its own so the root PnP install stays intact.
      - name: Install mobile dependencies
        working-directory: frontend/apps/mobile
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capacitor sync (Android)
        working-directory: frontend/apps/mobile
        run: yarn cap sync android

      - name: Gradle assembleDebug
        working-directory: frontend/apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: companion-android-apk
          path: frontend/apps/mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    name: iOS (Simulator .app)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js + Corepack (Yarn 4)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable

      - name: Install root dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web bundle
        run: yarn workspace @ci/fe-web build

      - name: Install mobile dependencies
        working-directory: frontend/apps/mobile
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # cap sync runs `pod install` — CocoaPods ships on GitHub's macOS runners.
      - name: Capacitor sync (iOS)
        working-directory: frontend/apps/mobile
        run: yarn cap sync ios

      # Unsigned Simulator build — validates the project and produces a runnable .app
      # without any Apple Developer credentials. For a device-installable, signed .ipa,
      # swap this for `xcodebuild archive … -exportArchive` gated on the signing secrets
      # (see frontend/apps/mobile/README.md → "CI builds").
      - name: Build (iOS Simulator, unsigned)
        working-directory: frontend/apps/mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app
        working-directory: frontend/apps/mobile/ios/App
        run: |
          APP=$(find build/Build/Products -name 'App.app' -type d | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/companion-ios-simulator.app.zip"

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: companion-ios-simulator-app
          path: companion-ios-simulator.app.zip
          if-no-files-found: error
