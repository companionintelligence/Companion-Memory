name: Mobile Build

# Builds the native iOS + Android apps — the Capacitor thin client that wraps the
# @ci/fe-web build (frontend/apps/ios + frontend/apps/android). Modelled on CI-Hub's desktop-build.yml.
#
# Runs on manual dispatch ONLY — the `mobile-v*` tag trigger it once had is gone; see
# "GATED TO MANUAL" below. By default it produces UNSIGNED artifacts that need no secrets:
#   • Android — a debug APK (sideload-installable; not for store distribution)
#   • iOS     — a Simulator .app (runs in the iOS Simulator; not device-installable)
# Signed, device-/store-ready artifacts (release APK/AAB, signed .ipa) require the
# signing secrets documented in frontend/apps/ios/README.md → "CI builds".

# GATED TO MANUAL. Every trigger except workflow_dispatch was removed so this
# workflow no longer runs on push, pull_request or a schedule — CI silence here
# means "nobody dispatched it", NOT "everything passed". Run it deliberately:
#   gh workflow run <file> --ref <branch>
# Restore a trigger by re-adding it to the `on:` block below.
#
# RELEASE IMPACT: this previously built on a pushed `mobile-v*` tag. That
# trigger is gone; dispatch it on the tag ref instead.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # PWA off for the native build — the Workbox service worker fights Capacitor's local
  # asset serving inside the webview.
  VITE_DISABLE_PWA: 'true'
  # Phone cloud-connect talks to production Portal, not the internal Hub appliance host.
  VITE_CI_CLOUD_URL: 'https://hub.ci.computer'

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js + Corepack (Yarn 4)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable

      # Root install (Yarn PnP), then build the web bundle the app ships via webDir.
      - name: Install root dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web bundle
        run: yarn workspace @ci/fe-web build

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 defaults `packages` to `tools platform-tools`, and Google has
          # REMOVED the obsolete `tools` package from the SDK repository, so the
          # default makes sdkmanager exit 1 with `Failed to find package 'tools'`
          # — which is how this lane broke without any change on our side.
          # Empty means "set up cmdline-tools and the env, install nothing":
          # the next step already installs the exact components this build
          # needs, so there was never anything for the default to add.
          packages: ''
      # Keep this pair in lockstep with compileSdkVersion in
      # frontend/apps/android/android/variables.gradle.
      - name: Install SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # The mobile project is a STANDALONE (non-workspace) Yarn project with a
      # node-modules linker — installed on its own so the root PnP install stays intact.
      - name: Install mobile dependencies
        working-directory: frontend/apps/android
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capacitor sync (Android)
        working-directory: frontend/apps/android
        run: yarn cap sync android

      - name: Gradle assembleDebug
        working-directory: frontend/apps/android/android
        run: ./gradlew assembleDebug --no-daemon

      # The JVM unit suites for the four modules this repo owns — :app plus the
      # three :ci-capacitor-* plugins (Robolectric, no emulator, no device). They
      # cost well under a minute on top of a toolchain and a Gradle cache the
      # assembleDebug step above has already paid for, which is the whole reason
      # they live here rather than in a job of their own.
      #
      # `testDebugUnitTest` with no module prefix runs every module that has a
      # unit-test source set, so a new plugin package is covered without an edit
      # here. Locally this is `make test-android`, which checks the same
      # toolchain preconditions first.
      #
      # --continue: report every module's failures in one run instead of
      # stopping at the first, so the uploaded reports below are complete.
      - name: Gradle unit tests
        working-directory: frontend/apps/android/android
        run: ./gradlew testDebugUnitTest --no-daemon --continue

      # Only on failure — a green run's reports say nothing the log does not, and
      # the modules live under two different roots (the three plugins reach the
      # build over `portal:` symlinks from frontend/packages), so both are listed.
      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: android-unit-test-reports
          path: |
            frontend/apps/android/android/app/build/reports/tests/testDebugUnitTest/**
            frontend/apps/android/android/app/build/test-results/testDebugUnitTest/**
            frontend/packages/capacitor-*/android/build/reports/tests/testDebugUnitTest/**
            frontend/packages/capacitor-*/android/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: companion-android-apk
          path: frontend/apps/android/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    name: iOS (Simulator .app)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js + Corepack (Yarn 4)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable

      - name: Install root dependencies
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web bundle
        run: yarn workspace @ci/fe-web build

      - name: Install mobile dependencies
        working-directory: frontend/apps/ios
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # cap sync runs `pod install` — CocoaPods ships on GitHub's macOS runners.
      - name: Capacitor sync (iOS)
        working-directory: frontend/apps/ios
        run: yarn cap sync ios

      # The on-device LLM links CLiteRTLM.xcframework (~81 MB), deliberately not
      # committed. Same category as Pods/ and App/public: a cold clone has to fetch
      # it or the link step fails on a missing framework.
      - name: Fetch CLiteRTLM.xcframework (on-device LLM)
        working-directory: frontend/apps/ios/ios/App
        run: ./Frameworks/fetch-clitertlm-xcframework.sh

      # Unsigned Simulator build — validates the project and produces a runnable .app
      # without any Apple Developer credentials. For a device-installable, signed .ipa,
      # swap this for `xcodebuild archive … -exportArchive` gated on the signing secrets
      # (see frontend/apps/ios/README.md → "CI builds").
      #
      # ARCHS=arm64 ONLY_ACTIVE_ARCH=YES: the generic 'iOS Simulator' destination below
      # otherwise resolves to BOTH arm64 and x86_64 slices, but CLiteRTLM.xcframework
      # (fetched above) ships only ios-arm64 / ios-arm64-simulator — no x86_64 simulator
      # slice — so the x86_64 link fails with "required architecture 'x86_64'" undefined
      # symbols. No runner or realistic dev machine here needs an Intel simulator slice.
      # This exact combination was hand-verified to build, install and launch correctly
      # (docs/qa/baseline-2026-08-26.md §6.2/§5).
      - name: Build (iOS Simulator, unsigned)
        working-directory: frontend/apps/ios/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Package .app
        working-directory: frontend/apps/ios/ios/App
        run: |
          APP=$(find build/Build/Products -name 'App.app' -type d | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/companion-ios-simulator.app.zip"

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: companion-ios-simulator-app
          path: companion-ios-simulator.app.zip
          if-no-files-found: error
