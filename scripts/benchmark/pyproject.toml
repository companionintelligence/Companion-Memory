[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-server-memory-benchmark"
version = "0.1.0"
description = "Head-to-head memory-system benchmark for CI-Server."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
