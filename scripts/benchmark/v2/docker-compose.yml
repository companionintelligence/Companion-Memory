# Harness v2 — one container per memory system, all from the same image
# (selected by $SYSTEM). The orchestrator on the host only speaks the uniform
# HTTP contract to these containers; no vendor SDKs / agents run on the host.
#
# Build the image once:   docker build -t bench-mem-v2 .
# Bring up:               docker compose up -d
#
# host.docker.internal lets containers reach host services (Ollama, CI-Server,
# Hindsight server). LM Studio is a LAN IP and reached directly.

services:
  naive:
    image: bench-mem-v2
    environment:
      SYSTEM: naive
      LLM_URL: http://192.168.0.203:1234
      LLM_MODEL: gemma-4-31b-it-abliterated   # internal extractor (Phase A, gemma loaded)
      ANSWERER_MODEL: ornstein-3.6-27b        # shared answerer (Phase B, ornstein loaded)
      OLLAMA_HOST: http://host.docker.internal:11434
      EMBED_MODEL: nomic-embed-text
    ports: ["9101:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  mem0:
    image: bench-mem-v2
    environment:
      SYSTEM: mem0
      LLM_URL: http://192.168.0.203:1234
      LLM_MODEL: gemma-4-31b-it-abliterated   # mem0 internal extractor (Phase A)
      ANSWERER_MODEL: ornstein-3.6-27b        # shared answerer (Phase B)
      LMS_TARGET: http://192.168.0.203:1234
      MEM0_LLM_BASE_URL: http://localhost:1235/v1
      OLLAMA_HOST: http://host.docker.internal:11434
      EMBED_MODEL: nomic-embed-text
    ports: ["9102:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  hindsight:
    image: bench-mem-v2
    environment:
      SYSTEM: hindsight
      LLM_URL: http://192.168.0.203:1234
      LLM_MODEL: gemma-4-31b-it-abliterated   # (hindsight's extractor is server-side)
      ANSWERER_MODEL: ornstein-3.6-27b        # shared answerer (Phase B)
      HINDSIGHT_BASE_URL: http://host.docker.internal:8888
      OLLAMA_HOST: http://host.docker.internal:11434
      EMBED_MODEL: nomic-embed-text
    ports: ["9103:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  ci_server:
    image: bench-mem-v2
    environment:
      SYSTEM: ci_server
      LLM_URL: http://192.168.0.203:1234
      LLM_MODEL: gemma-4-31b-it-abliterated   # (ci_server's extractor is the host API via .env)
      ANSWERER_MODEL: ornstein-3.6-27b        # shared answerer (Phase B)
      CI_SERVER_URL: http://host.docker.internal:8642
      CI_SERVER_TOKEN: b32b1f4623ace2526a358b2a3ca0b9c44749af96b4f83b56ece3e495ccd956aa
      OLLAMA_HOST: http://host.docker.internal:11434
      EMBED_MODEL: nomic-embed-text
    ports: ["9104:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  openviking:
    image: bench-mem-v2
    environment:
      SYSTEM: openviking
      LLM_URL: http://192.168.0.203:1234
      LLM_MODEL: gemma-4-31b-it-abliterated   # OpenViking's VLM (extraction, Phase A)
      ANSWERER_MODEL: ornstein-3.6-27b        # shared answerer (Phase B)
      OPENVIKING_URL: http://host.docker.internal:1933   # host-run openviking-server
      OPENVIKING_API_KEY: benchkey
      OLLAMA_HOST: http://host.docker.internal:11434
      EMBED_MODEL: nomic-embed-text
    ports: ["9105:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  holographic:
    image: bench-mem-v2
    environment:
      SYSTEM: holographic            # vendored Hermes plugin — local SQLite, no LLM/embeddings
      ANSWERER_MODEL: ornstein-3.6-27b   # shared answerer (Phase B)
      LLM_URL: http://192.168.0.203:1234
      OLLAMA_HOST: http://host.docker.internal:11434
      EMBED_MODEL: nomic-embed-text
    ports: ["9106:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
