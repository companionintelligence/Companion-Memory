worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type  application/octet-stream;

  resolver 127.0.0.11 ipv6=off;

  sendfile on;

  # Upgrade connection only when the client requests WebSocket/HMR;
  # empty string for normal requests preserves keep-alive to Vite.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  upstream vite {
    server host.docker.internal:5173;
    keepalive 32;
  }

  upstream api {
    server host.docker.internal:3030;
    keepalive 8;
  }

  server {
    listen 8642;
    server_name _;

    # Dev CSP: allows 'unsafe-inline' for Vite HMR and inline scripts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; media-src 'self' blob:; connect-src 'self' ws://$host wss://$host; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    location /api/llm/generate {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      client_max_body_size 10G;
      sendfile on;
    }

    # MCP Streamable HTTP – POST responses and GET streams may use SSE
    location ~ ^/api/mcp(/?)$ {
      proxy_pass http://host.docker.internal:3030;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Disable buffering so streamed responses arrive immediately
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;

      # Long timeouts for SSE notification streams (GET) and tool calls
      proxy_read_timeout 86400s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 86400s;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      client_max_body_size 10G;
      sendfile on;
    }

    location /graphql {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;
      client_max_body_size 50M;
    }

    location /static/ {
      # Prevent SDK credentials on NGINX proxy.
      # These should only be allowed from the web application.
      if ($http_authorization != "") {
        return 403;
      }

      proxy_pass http://object-store:9000;
      proxy_set_header Host object-store:9000;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/static/(.*)$ /$1 break;

      # Optimize performance with browser caching
      # NOTE: add_header in a location block replaces (not merges) inherited headers,
      #       so the CSP from the server{} block must be repeated here.
      add_header Cache-Control "private, max-age=60, immutable";
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; media-src 'self' blob:; connect-src 'self' ws://$host wss://$host; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

      # Allow large files to be proxied without buffering (sends file as stream)
      proxy_request_buffering off;
      proxy_buffering off;

      # Increase timeouts for slow clients or large files
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # Optionally increase the size of the initial buffer (tune as needed)
      client_max_body_size 10G; # Allows uploads up to 10GB (set as you need)
      sendfile on;
    }

    location / {
      proxy_pass http://vite;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
