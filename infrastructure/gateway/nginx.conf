worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type  application/octet-stream;

  resolver 127.0.0.11 ipv6=off;

  sendfile on;
  server_tokens off;

  # Upgrade connection only when the client requests WebSocket;
  # empty string for normal requests preserves keep-alive.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # The scheme the CLIENT used, not the one this gateway was reached on.
  #
  # This gateway always listens plain HTTP on 8642; TLS is terminated upstream.
  # The API runs `trust proxy 1`, so `secure: req.secure` in
  # domains/auth/utils/authCookies.ts issues the 7-day sessionToken/csrfToken with
  # the Secure attribute only when the proxy tells us the client was on HTTPS.
  # Getting that signal right is what keeps those cookies off plaintext links.
  #
  # $proto_from_xfp — the X-Forwarded-Proto path, for a proxy that sets it
  # correctly. Match only the FIRST token (mirroring how Express derives
  # req.secure from a comma-joined value) and collapse anything unexpected —
  # junk, empty, an unparseable chain — to this hop's own $scheme (http here), so
  # a direct client cannot inject an arbitrary value. \b anchors the token end
  # without a `$` that nginx would read as a variable; https is listed first so it
  # wins over the http prefix.
  #
  # BUT behind the Hub's Cloudflare tunnel the chain is
  # Cloudflare → cloudflared → Hub Traefik → this gateway, and Traefik OVERWRITES
  # X-Forwarded-Proto with its own plain-http entrypoint scheme — so on the
  # flagship deployment X-Forwarded-Proto arrives as `http` on a genuine HTTPS
  # request (verified on core-2). Cloudflare's CF-Visitor: {"scheme":"https"}
  # carries the true client scheme and survives that hop untouched, so prefer it;
  # fall back to X-Forwarded-Proto for a non-Cloudflare edge, then to $scheme for a
  # direct plain-HTTP LAN / Tailscale exposure (which keeps working unencrypted).
  map $http_x_forwarded_proto $proto_from_xfp {
    default        $scheme;
    "~*^https\b"   https;
    "~*^http\b"    http;
  }

  map $http_cf_visitor $client_proto {
    "~https"   https;
    "~http"    http;
    default    $proto_from_xfp;
  }

  upstream api {
    server api:3030;
    keepalive 8;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  # frame-src: the provider players the gallery can mount (derivePlayer in
  # domains/embed). Static defense-in-depth only — the UI never renders an
  # iframe until the user clicks a tile. Mirror any new provider here, in
  # derivePlayer.ts, and in identity/providers.ts; the header repeats below
  # because nginx's add_header does not inherit across blocks that set their own.
  # script-src 'wasm-unsafe-eval': PowerSync's SQLite engine (wa-sqlite) is
  # WebAssembly compiled inside the DB web worker, and CSP treats compiling wasm
  # as eval. Without it every WebAssembly.instantiate() fails, the worker's init
  # throws before it ever answers the main thread, and anything awaiting the
  # local database — notably logout's disconnectAndClear() — hangs forever.
  # 'wasm-unsafe-eval' permits wasm compilation only; JS eval stays blocked.
  # Workers take their policy from their own script's response, so the /assets/
  # copy below is the one that actually governs the worker.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://www.youtube-nocookie.com https://open.spotify.com https://player.vimeo.com https://w.soundcloud.com https://www.dailymotion.com;" always;

  server {
    listen 8642;
    server_name _;

    location /api/llm/generate {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      client_max_body_size 10G;
      sendfile on;
    }

    # MCP Streamable HTTP – POST responses and GET streams may use SSE
    location ~ ^/api/mcp(/?)$ {
      proxy_pass http://api;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_http_version 1.1;
      # Required by the `keepalive` in `upstream api`: without it nginx sends
      # `Connection: close` upstream while pooling the socket, and the next
      # request lands on a dead connection.
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $client_proto;

      # Disable buffering so streamed responses arrive immediately
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;

      # Long timeouts for SSE notification streams (GET) and tool calls
      proxy_read_timeout 86400s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 86400s;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      client_max_body_size 10G;
      sendfile on;
    }

    # Capture ingest + bulk push destinations used by Companion Pipe and any
    # other client that posts to /v1/* without the /api prefix.
    # Without this, POST /v1/* falls through to the SPA `location /` and nginx
    # returns 405 (static try_files). Clients that omit the /api prefix must
    # still reach the Nest API — the now-retired CI-Import-Tools' first sync on
    # this host failed exactly that way (HTTP 405 on /v1/events).
    location /v1/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      client_max_body_size 10G;
      sendfile on;
    }

    location /static/ {
      # Prevent SDK credentials on NGINX proxy.
      # These should only be allowed from the web application.
      if ($http_authorization != "") {
        return 403;
      }

      proxy_pass http://object-store:9000;
      proxy_set_header Host object-store:9000;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/static/(.*)$ /$1 break;

      # Optimize performance with browser caching
      # NOTE: add_header in a location block replaces (not merges) inherited headers,
      #       so security headers from the http{} block must be repeated here.
      add_header Cache-Control "private, max-age=60, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://www.youtube-nocookie.com https://open.spotify.com https://player.vimeo.com https://w.soundcloud.com https://www.dailymotion.com;" always;

      # Allow large files to be proxied without buffering (sends file as stream)
      proxy_request_buffering off;
      proxy_buffering off;

      # Increase timeouts for slow clients or large files
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # Optionally increase the size of the initial buffer (tune as needed)
      client_max_body_size 10G; # Allows uploads up to 10GB (set as you need)
      sendfile on;
    }

    location /assets/ {
      root /usr/share/nginx/html/ci/web;

      try_files $uri = 404;

      add_header Cache-Control "public, max-age=604800, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://www.youtube-nocookie.com https://open.spotify.com https://player.vimeo.com https://w.soundcloud.com https://www.dailymotion.com;" always;
    }

    # The OAuth callback lands here with credentials in the URL: an
    # authorization code in the query (own-app flow) or, from CI Portal, the
    # tokens in the fragment (which the browser never sends). Either way the
    # request line must not be written to the access log, where it would sit
    # in plain text in the container's log stream. Headers are inherited from
    # the server level (no add_header here, so nothing is replaced).
    location = /oauth/callback {
      root /usr/share/nginx/html/ci/web;
      access_log off;

      try_files /index.html =404;
    }

    location / {
      root /usr/share/nginx/html/ci/web;

      try_files $uri $uri/ /index.html;
    }
  }
}
