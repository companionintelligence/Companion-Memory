worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type  application/octet-stream;

  resolver 127.0.0.11 ipv6=off;

  sendfile on;
  server_tokens off;

  # Upgrade connection only when the client requests WebSocket;
  # empty string for normal requests preserves keep-alive.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # The scheme the CLIENT used, not the one this gateway was reached on.
  #
  # This gateway always listens plain HTTP on 8642; TLS is terminated upstream.
  # The API runs `trust proxy 1`, so `secure: req.secure` in
  # domains/auth/utils/authCookies.ts issues the 7-day sessionToken/csrfToken with
  # the Secure attribute only when the proxy tells us the client was on HTTPS.
  # Getting that signal right is what keeps those cookies off plaintext links.
  #
  # $proto_from_xfp — the X-Forwarded-Proto path, for a proxy that sets it
  # correctly. Match only the FIRST token (mirroring how Express derives
  # req.secure from a comma-joined value) and collapse anything unexpected —
  # junk, empty, an unparseable chain — to this hop's own $scheme (http here), so
  # a direct client cannot inject an arbitrary value. \b anchors the token end
  # without a `$` that nginx would read as a variable; https is listed first so it
  # wins over the http prefix.
  #
  # BUT behind the Hub's Cloudflare tunnel the chain is
  # Cloudflare → cloudflared → Hub Traefik → this gateway, and Traefik OVERWRITES
  # X-Forwarded-Proto with its own plain-http entrypoint scheme — so on the
  # flagship deployment X-Forwarded-Proto arrives as `http` on a genuine HTTPS
  # request (verified on core-2). Cloudflare's CF-Visitor: {"scheme":"https"}
  # carries the true client scheme and survives that hop untouched, so prefer it;
  # fall back to X-Forwarded-Proto for a non-Cloudflare edge, then to $scheme for a
  # direct plain-HTTP LAN / Tailscale exposure (which keeps working unencrypted).
  map $http_x_forwarded_proto $proto_from_xfp {
    default        $scheme;
    "~*^https\b"   https;
    "~*^http\b"    http;
  }

  map $http_cf_visitor $client_proto {
    "~https"   https;
    "~http"    http;
    default    $proto_from_xfp;
  }

  upstream api {
    server api:3030;
    keepalive 8;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

  server {
    listen 8642;
    server_name _;

    location /api/llm/generate {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      client_max_body_size 10G;
      sendfile on;
    }

    # MCP Streamable HTTP – POST responses and GET streams may use SSE
    location ~ ^/api/mcp(/?)$ {
      proxy_pass http://api;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $client_proto;

      # Disable buffering so streamed responses arrive immediately
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;

      # Long timeouts for SSE notification streams (GET) and tool calls
      proxy_read_timeout 86400s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 86400s;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      client_max_body_size 10G;
      sendfile on;
    }

    location /static/ {
      # Prevent SDK credentials on NGINX proxy.
      # These should only be allowed from the web application.
      if ($http_authorization != "") {
        return 403;
      }

      proxy_pass http://object-store:9000;
      proxy_set_header Host object-store:9000;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/static/(.*)$ /$1 break;

      # Optimize performance with browser caching
      # NOTE: add_header in a location block replaces (not merges) inherited headers,
      #       so security headers from the http{} block must be repeated here.
      add_header Cache-Control "private, max-age=60, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

      # Allow large files to be proxied without buffering (sends file as stream)
      proxy_request_buffering off;
      proxy_buffering off;

      # Increase timeouts for slow clients or large files
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # Optionally increase the size of the initial buffer (tune as needed)
      client_max_body_size 10G; # Allows uploads up to 10GB (set as you need)
      sendfile on;
    }

    location /assets/ {
      root /usr/share/nginx/html/ci/web;

      try_files $uri = 404;

      add_header Cache-Control "public, max-age=604800, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    }

    location / {
      root /usr/share/nginx/html/ci/web;

      try_files $uri $uri/ /index.html;
    }
  }
}
