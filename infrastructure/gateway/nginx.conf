worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type  application/octet-stream;

  # Which upstream hops may vouch for the client's address. Written at
  # container start from TRUSTED_PROXY_CIDRS (see entrypoint.sh); empty by
  # default, which leaves $remote_addr as the peer that connected to us.
  include /etc/nginx/trusted-proxies.conf;

  resolver 127.0.0.11 ipv6=off;

  sendfile on;
  server_tokens off;

  # Upgrade connection only when the client requests WebSocket;
  # empty string for normal requests preserves keep-alive.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # The scheme the CLIENT used, not the one this gateway was reached on.
  #
  # This gateway always listens plain HTTP on 8642; TLS is terminated upstream.
  # The API runs `trust proxy 1`, so `secure: req.secure` in
  # domains/auth/utils/authCookies.ts issues the 7-day sessionToken/csrfToken with
  # the Secure attribute only when the proxy tells us the client was on HTTPS.
  # Getting that signal right is what keeps those cookies off plaintext links.
  #
  # $proto_from_xfp — the X-Forwarded-Proto path, for a proxy that sets it
  # correctly. Match only the FIRST token (mirroring how Express derives
  # req.secure from a comma-joined value) and collapse anything unexpected —
  # junk, empty, an unparseable chain — to this hop's own $scheme (http here), so
  # a direct client cannot inject an arbitrary value. \b anchors the token end
  # without a `$` that nginx would read as a variable; https is listed first so it
  # wins over the http prefix.
  #
  # BUT behind the Hub's Cloudflare tunnel the chain is
  # Cloudflare → cloudflared → Hub Traefik → this gateway, and Traefik OVERWRITES
  # X-Forwarded-Proto with its own plain-http entrypoint scheme — so on the
  # flagship deployment X-Forwarded-Proto arrives as `http` on a genuine HTTPS
  # request (verified on core-2). Cloudflare's CF-Visitor: {"scheme":"https"}
  # carries the true client scheme and survives that hop untouched, so prefer it;
  # fall back to X-Forwarded-Proto for a non-Cloudflare edge, then to $scheme for a
  # direct plain-HTTP LAN / Tailscale exposure (which keeps working unencrypted).
  map $http_x_forwarded_proto $proto_from_xfp {
    default        $scheme;
    "~*^https\b"   https;
    "~*^http\b"    http;
  }

  map $http_cf_visitor $client_proto {
    "~https"   https;
    "~http"    http;
    default    $proto_from_xfp;
  }

  upstream api {
    server api:3030;
    keepalive 8;
  }

  # NOTE: PowerSync deliberately has no `upstream` block — see location
  # /powersync/ below for why it must resolve at request time instead.

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  # frame-src: the provider players the gallery can mount (derivePlayer in
  # domains/embed). Static defense-in-depth only — the UI never renders an
  # iframe until the user clicks a tile. Mirror any new provider here, in
  # derivePlayer.ts, and in identity/providers.ts; the header repeats below
  # because nginx's add_header does not inherit across blocks that set their own.
  # script-src 'wasm-unsafe-eval': PowerSync's SQLite engine (wa-sqlite) is
  # WebAssembly compiled inside the DB web worker, and CSP treats compiling wasm
  # as eval. Without it every WebAssembly.instantiate() fails, the worker's init
  # throws before it ever answers the main thread, and anything awaiting the
  # local database — notably logout's disconnectAndClear() — hangs forever.
  # 'wasm-unsafe-eval' permits wasm compilation only; JS eval stays blocked.
  # Workers take their policy from their own script's response, so the /assets/
  # copy below is the one that actually governs the worker.
  # script-src/connect-src maps.googleapis.com + maps.gstatic.com: the SPA
  # injects the Maps JS tag at runtime (frontend/apps/web/src/components/Map/
  # googleMaps.ts) and the loader then fetches its own modules and tile/route
  # data over XHR. Without these the script is refused and loadGoogleMaps()'s
  # rejection is swallowed — the map silently degrades to dashed straight-line
  # polylines, so an operator who set GOOGLE_MAPS_KEY exactly as documented gets
  # a broken feature and one console warning. No img-src entry is needed: it is
  # already `*` here. THE POLICY IS COPIED THREE TIMES: this http{} block, the
  # /assets/ location below, and the Caddy dev route in scripts/dev-stack/index.ts.
  # Change all three together or they drift. /static/ sends its own, stricter one.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; media-src 'self' blob:; connect-src 'self' https://maps.googleapis.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://www.youtube-nocookie.com https://open.spotify.com https://player.vimeo.com https://w.soundcloud.com https://www.dailymotion.com;" always;

  server {
    listen 8642;
    server_name _;

    # Request bodies are small unless a location below says otherwise.
    #
    # The catch-all /api/ and /v1/ locations used to allow 10G with request
    # buffering on, so nginx wrote up to 10 GB per request to the container's
    # disk (the database's disk, on a default Docker install) before the API saw
    # a header, let alone a credential. Now only the routes that take uploads or
    # bulk streams allow more, and those turn request buffering off: the API
    # checks the caller first and refuses an unauthenticated upload before
    # reading its body, and nginx stores none of it. Everything else stays under
    # this 1m, which is nginx's own default made explicit; the API's JSON parser
    # caps those routes at 100kb anyway (BodyParserMiddleware.ts).
    client_max_body_size 1m;

    location /api/llm/generate {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # A prompt, a model name and file ids: the API's parser caps it at
      # 100kb. Attachments go through /api/files/upload.
      sendfile on;
    }

    # MCP Streamable HTTP – POST responses and GET streams may use SSE
    location ~ ^/api/mcp(/?)$ {
      proxy_pass http://api;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_http_version 1.1;
      # Required by the `keepalive` in `upstream api`: without it nginx sends
      # `Connection: close` upstream while pooling the socket, and the next
      # request lands on a dead connection.
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $client_proto;

      # Disable buffering so streamed responses arrive immediately
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;

      # Long timeouts for SSE notification streams (GET) and tool calls
      proxy_read_timeout 86400s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 86400s;
    }

    # PowerSync sync engine. /api/powersync/token hands clients this path (see
    # POWERSYNC_URL in docker-compose.production.yml) and they append their own
    # suffixes to it — /sync/stream, /write-checkpoint2.json, /probes/*.
    #
    # The host is resolved at REQUEST time, via the variable below and the
    # `resolver` at the top of this file — not through an `upstream` block.
    # nginx refuses to start when a static upstream's host does not resolve
    # ("host not found in upstream", verified), and powersync only runs under
    # the staging/production profiles: a `local` stack serves this gateway with
    # no such container. A static upstream would therefore take the entire web
    # tier down wherever sync is not deployed. This way an absent sync service
    # is a 502 on /powersync/* alone, and nothing else notices.
    #
    # proxy_pass with a variable does NOT strip the location prefix the way a
    # literal trailing slash does, so strip it explicitly — the same `rewrite
    # ... break` the /api/ blocks use. Without it every route arrives as
    # /powersync/sync/stream and 404s.
    location /powersync/ {
      set $powersync_upstream "powersync:8080";
      rewrite ^/powersync/(.*)$ /$1 break;
      proxy_pass http://$powersync_upstream;
      proxy_http_version 1.1;

      # Sync is a WebSocket first and falls back to HTTP streaming; $connection_upgrade
      # is '' for the fallback, which keeps that path on plain keep-alive.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $client_proto;

      # A sync stream emits an op the moment one is committed. Buffering would
      # hold it until nginx's buffer filled, turning live sync into batches
      # minutes apart.
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_set_header X-Accel-Buffering no;

      # A stream stays open until the client leaves. The default 60s read timeout
      # would tear it down every minute and make sync look like a reconnect loop.
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_connect_timeout 60s;
    }

    # ── Uploads and bulk streams ─────────────────────────────────────
    #
    # The routes whose bodies are legitimately large. Each authenticates
    # before it reads the body (multer, the NDJSON readers in
    # domains/ingest/ndjson.ts and domains/portability/portabilityNdjson.ts),
    # so with request buffering off an unauthenticated upload is refused after
    # its headers and nginx never stores the body. The size limit is left to
    # the API, which knows it per route:
    #   /api/import/uploads          one archive per request, up to 50 GiB
    #                                (Takeout parts; ImportUploadsController)
    #   /api/files/upload            chat attachments, photos, recordings,
    #                                up to 10 GiB a file (FilesController)
    #   /api/account/import/stream   a whole account as NDJSON, unbounded
    #   /v1/files                    up to 50 files of 1 GiB (BulkFilesController)
    #   /v1/<bulk ingest>            NDJSON streams, unbounded; a JSON envelope
    #                                is held to 10mb by the API
    # The /v1 routes answer under both /v1/ and /api/v1/, so they appear twice
    # with each prefix's own headers, as the catch-all locations below do.
    location ~ ^/api/(import/uploads|files/upload|account/import/stream)/?$ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_request_buffering off;
      client_max_body_size 0;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;
    }

    location ~ ^/api/v1/(files|communications|contents|things|inventory|browser-activity|positions|receipts|product-models|observations)/?$ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_request_buffering off;
      client_max_body_size 0;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;
    }

    location ~ ^/v1/(files|communications|contents|things|inventory|browser-activity|positions|receipts|product-models|observations)/?$ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_request_buffering off;
      client_max_body_size 0;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;
    }

    # GraphQL takes up to 10mb (BodyParserMiddleware.ts GRAPHQL_BODY_LIMIT):
    # bulk mutations pass thousands of rows as variables. Buffered as before;
    # 10m is what nginx can be made to hold for one request now, not 10G.
    location ~ ^/api/graphql/?$ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      client_max_body_size 10m;
    }

    # The rest of the /v1 plane through /api/: capture events (a perception
    # snapshot is about 1 MB, up to 1,000 a request), notes and the agent and
    # ingest routes. The API allows 10mb on all of /v1, so the gateway matches it.
    location /api/v1/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      client_max_body_size 10m;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # $http_host, not $host: $host drops the port, so on any install reached
      # on a non-default port (the desktop app's 127.0.0.1:8642, a LAN
      # address) the API compared "127.0.0.1" with its own "127.0.0.1:8642",
      # concluded the browser was on the wrong origin, and bounced every
      # sign-in through a self-redirect — one that also lost the invitation
      # a second person had just presented (OidcController's initiate hop).
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # No client_max_body_size: the server's 1m. The routes that take more
      # have their own locations above.
      sendfile on;
    }

    # Capture ingest + bulk push destinations used by Companion Pipe and any
    # other client that posts to /v1/* without the /api prefix.
    # Without this, POST /v1/* falls through to the SPA `location /` and nginx
    # returns 405 (static try_files). Clients that omit the /api prefix must
    # still reach the Nest API — the now-retired CI-Import-Tools' first sync on
    # this host failed exactly that way (HTTP 405 on /v1/events).
    location /v1/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # The API's own /v1 limit (BodyParserMiddleware.ts); uploads and NDJSON
      # streams have the unbuffered locations above.
      client_max_body_size 10m;
      sendfile on;
    }

    location /static/ {
      # Prevent SDK credentials on NGINX proxy.
      # These should only be allowed from the web application.
      if ($http_authorization != "") {
        return 403;
      }

      # Everything under /static/ is user content (uploads, email attachments,
      # synced files) on the app's own origin, so it gets a sandbox that runs no
      # script whatever type it arrives with. The API already signs anything that
      # is not an image, audio, video, PDF or plain text as a download
      # (domains/files/services/downloadResponse.ts); this is the second line.
      # `allow-same-origin` without `allow-scripts` still runs nothing; it keeps
      # the file's own origin so Chrome can play a video opened on its own (a
      # sandbox with an opaque origin fails that request as cross-origin).
      # PDFs alone skip `sandbox`: browsers render them in a built-in viewer that
      # can refuse a sandboxed document. The match is on the signed query, which
      # the object store verifies, so a client cannot add it to another file.
      # These must stay above the `rewrite ... break`, which ends the rewrite phase.
      set $static_sandbox "sandbox allow-same-origin; ";
      if ($args ~* "(^|&)response-content-type=application%2Fpdf(&|$)") {
        set $static_sandbox "";
      }

      proxy_pass http://object-store:9000;
      proxy_set_header Host object-store:9000;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/static/(.*)$ /$1 break;

      # Optimize performance with browser caching
      # NOTE: add_header in a location block replaces (not merges) inherited headers,
      #       so security headers from the http{} block must be repeated here.
      #       The CSP is NOT the app's: a stored file is never a page of the app,
      #       so it loads nothing and runs nothing (see $static_sandbox above).
      add_header Cache-Control "private, max-age=60, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "${static_sandbox}default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

      # Allow large files to be proxied without buffering (sends file as stream)
      proxy_request_buffering off;
      proxy_buffering off;

      # Increase timeouts for slow clients or large files
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # Optionally increase the size of the initial buffer (tune as needed)
      client_max_body_size 10G; # Allows uploads up to 10GB (set as you need)
      sendfile on;
    }

    location /assets/ {
      root /usr/share/nginx/html/ci/web;

      try_files $uri = 404;

      add_header Cache-Control "public, max-age=604800, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy "no-referrer" always;
      # Copy 2 of 3 of the CSP, and the one the PowerSync worker inherits (a
      # worker takes its policy from its own script's response). Keep it
      # byte-identical to the http{} block above and to the Caddy dev route in
      # scripts/dev-stack/index.ts.
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; media-src 'self' blob:; connect-src 'self' https://maps.googleapis.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src https://www.youtube-nocookie.com https://open.spotify.com https://player.vimeo.com https://w.soundcloud.com https://www.dailymotion.com;" always;
    }

    # The OAuth callback lands here with credentials in the URL: an
    # authorization code in the query (own-app flow) or, from CI Portal, the
    # tokens in the fragment (which the browser never sends). Either way the
    # request line must not be written to the access log, where it would sit
    # in plain text in the container's log stream. Headers are inherited from
    # the server level (no add_header here, so nothing is replaced).
    location = /oauth/callback {
      root /usr/share/nginx/html/ci/web;
      access_log off;

      try_files /index.html =404;
    }

    location / {
      root /usr/share/nginx/html/ci/web;

      try_files $uri $uri/ /index.html;
    }
  }
}
