worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type  application/octet-stream;

  resolver 127.0.0.11 ipv6=off;

  sendfile on;

  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control "no-cache, no-store, must-revalidate";

  server {
    listen 8642;
    listen 8643 ssl;
    server_name _;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location /api/llm/generate {
      proxy_pass http://ci-api:3030;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;

      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # Optionally increase the size of the initial buffer (tune as needed)
      client_max_body_size 10G; # Allows uploads up to 10GB (set as you need)
      sendfile on;
    }

    location /api/ {
      proxy_pass http://ci-api:3030;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/api/(.*)$ /$1 break;

      # Increase timeouts for slow clients or large files
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # Optionally increase the size of the initial buffer (tune as needed)
      client_max_body_size 10G; # Allows uploads up to 10GB (set as you need)
      sendfile on;
    }

    location /static/ {
      # Prevent SDK credentials on NGINX proxy.
      # These should only be allowed from the web application.
      if ($http_authorization != "") {
        return 403;
      }

      proxy_pass http://minio:9000;
      proxy_set_header Host minio:9000;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/static/(.*)$ /$1 break;

      # Optimize performance with browser caching
      add_header Cache-Control "private, max-age=60, immutable";

      # Allow large files to be proxied without buffering (sends file as stream)
      proxy_request_buffering off;
      proxy_buffering off;

      # Increase timeouts for slow clients or large files
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # Optionally increase the size of the initial buffer (tune as needed)
      client_max_body_size 10G; # Allows uploads up to 10GB (set as you need)
      sendfile on;
    }

    location /assets/ {
      root /usr/share/nginx/html/ci/web;

      try_files $uri = 404;

      # Disable caching to force reload of updated JavaScript
      add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
      add_header Pragma "no-cache";
      add_header Expires "Thu, 01 Jan 1970 00:00:00 GMT";
      add_header Last-Modified "Thu, 01 Jan 1970 00:00:00 GMT";
    }

    location / {
      root /usr/share/nginx/html/ci/web;

      try_files $uri $uri/ /index.html;
    }

    # Legacy voice endpoints - proxy directly to TTS service
    location /voice/tts {
      proxy_pass http://tts-service:9002/tts;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;

      # Increase timeouts for voice processing
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # Allow large audio files
      client_max_body_size 100M;
      
      # Disable buffering for real-time audio streaming
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;
    }
    
    location /voice/health {
      proxy_pass http://tts-service:9002/health;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # STT service endpoints (direct to STT container)
    location /stt/ {
      proxy_pass http://stt-service:9001/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/stt/(.*)$ /$1 break;

      # Increase timeouts for voice processing
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # Allow large audio files
      client_max_body_size 100M;
      
      # Disable buffering for real-time audio streaming
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;
    }

    # TTS service endpoints (direct to Higgs Audio vLLM container)
    location /tts/ {
      proxy_pass http://higgs-audio-vllm:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      rewrite ^/tts/(.*)$ /$1 break;

      # Increase timeouts for voice processing
      proxy_read_timeout 300s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;

      # Allow large audio files
      client_max_body_size 100M;
      
      # Disable buffering for real-time audio streaming
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;
    }
  }
}
