[package]
name = "ci-server-desktop"
version = "0.1.0"
description = "Local orchestrator desktop app for CI-Server — brings up CI-Server's own Docker Compose stack and displays it."
authors = ["Companion Intelligence"]
edition = "2021"
license-file = "../../../../LICENSE.md"
readme = "../README.md"
homepage = "https://ci.computer"
repository = "https://github.com/companionintelligence/CI-Server"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "time", "fs", "io-util"] }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# Local-model sidecar mechanics (local_model/ollama_sidecar.rs): downloading and
# unpacking Ollama's own release archives, a different format per host OS.
flate2 = "1"
tar = "0.4"
zstd = "0.13"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Apple on-device bridge (local_model/apple_bridge.rs, macOS only): the tiny
# HTTP shim translating OpenAI-shaped requests into ci-apple-bridge's stdio
# protocol.
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"

# panic = "unwind" (the Rust default) is deliberate: background work runs in
# tokio::spawn / tray callbacks, and a panic there should unwind and be
# logged, not abort the whole app.
[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
