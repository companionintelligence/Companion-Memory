# Desktop-only overlay, applied as the LAST -f file (after docker-compose.yml
# and docker-compose.production.yml). Rewrites every service's local `ci/<name>`
# image (built by `make build`, never published anywhere a downloaded binary
# can reach) to what CI-Server actually publishes — see
# scripts/publish/images.sh at the repo root (ci/<name> -> companion/<name>
# under ghcr.io/companionintelligence).
#
# CI_SERVER_IMAGE_TAG is NOT defaulted to ":latest" here — publish.sh's own
# comments record that a stale companion/*:latest tag previously orphaned
# (amd64-only, pointing at no real release). stack_manager.rs always writes a
# concrete value for CI_SERVER_IMAGE_TAG into the generated .env (resolved at
# build time by scripts/sync-compose-resources.cjs, or overridden by an
# operator), so this file relies on that variable always being set rather
# than supplying its own fallback.
#
# hbpe-service no longer needs to reset devices/group_add. It used to carry
# `devices: !reset []` and `group_add: !reset []`, because
# docker-compose.production.yml declared ROCm device passthrough (/dev/kfd,
# /dev/dri, group_add: [video]) unconditionally and Compose merges list-valued
# keys across -f files by CONCATENATION — a plain override cannot remove list
# entries, so only the Compose Specification's `!reset` tag (Docker Compose CLI
# >= 2.24) could clear them, and without it `docker compose up` hard-failed
# ("no such device") on every desktop that isn't an AMD ROCm box. Production no
# longer forces those devices — passthrough moved to the opt-in
# docker-compose.rocm.yml overlay, which the desktop never layers in — so there
# is nothing left to reset and the two `!reset` lines are gone. NOTE the
# >= 2.24 requirement is still enforced by compose_version_error() in
# src-tauri/src/stack_manager.rs; nothing in this file needs it any more, but
# that gate is a separate call and is not touched here. GPU-variant image
# selection is out of scope for v1 — this always runs the cpu-capable image
# with no GPU device passthrough.
#
# api also gets OIDC_ISSUER_URL/APP_BASE_URL, which no other compose file sets
# (map-valued `environment:` merges by key across -f files, unlike the
# list-valued keys above, so this only *adds* two keys to production.yml's
# own environment block, it doesn't replace it). Both are needed for
# "Sign in with CI-Portal" (OidcController.initiate/callback) to work at all
# here:
#   - auth.oidc.issuerUrl defaults to "" — unset, the initiate redirect target
#     is empty and the button just fails.
#   - auth.oidc.publicBaseUrl (unset) falls back to deriving redirect_uri from
#     the inbound request's Host header (resolveRequestOrigin) — but
#     gateway's nginx.conf forwards `Host: $host`, and nginx's $host strips
#     the port, so that fallback would compute `http://127.0.0.1` (implicit
#     port 80, nothing listening there) instead of `http://127.0.0.1:8642`,
#     and the callback redirect would never reach anything. Setting
#     publicBaseUrl explicitly skips that derivation entirely.
# stack_manager.rs always writes concrete values for both into the generated
# .env (CI_PORTAL_URL is the operator-overridable input; APP_BASE_URL is
# always http://127.0.0.1:<GATEWAY_PORT>, since that's the one address this
# app is guaranteed to actually be reachable at).
services:
  api:
    image: ghcr.io/companionintelligence/companion/api:${CI_SERVER_IMAGE_TAG}
    environment:
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://hub.ci.computer}
      APP_BASE_URL: ${APP_BASE_URL:-}
  worker:
    image: ghcr.io/companionintelligence/companion/api:${CI_SERVER_IMAGE_TAG}
  migrate-database:
    image: ghcr.io/companionintelligence/companion/api:${CI_SERVER_IMAGE_TAG}
  database:
    image: ghcr.io/companionintelligence/companion/database:${CI_SERVER_IMAGE_TAG}
  gateway:
    image: ghcr.io/companionintelligence/companion/gateway:${CI_SERVER_IMAGE_TAG}
  object-store:
    image: ghcr.io/companionintelligence/companion/object-store:${CI_SERVER_IMAGE_TAG}
  summary-service:
    image: ghcr.io/companionintelligence/companion/summary-service:${CI_SERVER_IMAGE_TAG}
  setup-database:
    image: ghcr.io/companionintelligence/companion/setup-database:${CI_SERVER_IMAGE_TAG}
  generate-secrets:
    image: ghcr.io/companionintelligence/companion/setup-secrets:${CI_SERVER_IMAGE_TAG}
  hbpe-service:
    image: ghcr.io/companionintelligence/companion/hbpe-service:${CI_SERVER_IMAGE_TAG}
