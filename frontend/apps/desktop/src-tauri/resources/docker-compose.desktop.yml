# Desktop-only overlay, applied as the LAST -f file (after docker-compose.yml
# and docker-compose.production.yml). Rewrites every service's local `ci/<name>`
# image (built by `make build`, never published anywhere a downloaded binary
# can reach) to what CI-Server actually publishes — see
# scripts/publish/images.sh at the repo root (ci/<name> -> companion/<name>
# under ghcr.io/companionintelligence).
#
# CI_SERVER_IMAGE_TAG is NOT defaulted to ":latest" here — publish.sh's own
# comments record that a stale companion/*:latest tag previously orphaned
# (amd64-only, pointing at no real release). stack_manager.rs always writes a
# concrete value for CI_SERVER_IMAGE_TAG into the generated .env (resolved at
# build time by scripts/sync-compose-resources.cjs, or overridden by an
# operator), so this file relies on that variable always being set rather
# than supplying its own fallback.
#
# hbpe-service no longer needs to reset devices/group_add. It used to carry
# `devices: !reset []` and `group_add: !reset []`, because
# docker-compose.production.yml declared ROCm device passthrough (/dev/kfd,
# /dev/dri, group_add: [video]) unconditionally and Compose merges list-valued
# keys across -f files by CONCATENATION — a plain override cannot remove list
# entries, so only the Compose Specification's `!reset` tag (Docker Compose CLI
# >= 2.24) could clear them, and without it `docker compose up` hard-failed
# ("no such device") on every desktop that isn't an AMD ROCm box. Production no
# longer forces those devices — passthrough moved to the opt-in
# docker-compose.rocm.yml overlay, which the desktop never layers in — so there
# is nothing left to reset and the two `!reset` lines are gone. The gateway's
# `ports: !override` below needs Compose >= 2.24.4 (older CLIs ignore the tag
# and concatenate), enforced by compose_version_error() in
# src-tauri/src/stack_manager.rs. GPU-variant image
# selection is out of scope for v1 — this always runs the cpu-capable image
# with no GPU device passthrough.
#
# api also gets OIDC_ISSUER_URL/APP_BASE_URL, which no other compose file sets
# (map-valued `environment:` merges by key across -f files, unlike the
# list-valued keys above, so this only *adds* its keys to production.yml's
# own environment block, it doesn't replace it). Both are needed for
# "Sign in with CI-Portal" (OidcController.initiate/callback) to work at all
# here:
#   - auth.oidc.issuerUrl defaults to "" — unset, the initiate redirect target
#     is empty and the button just fails.
#   - auth.oidc.publicBaseUrl (unset) falls back to deriving redirect_uri from
#     the inbound request's Host header (resolveRequestOrigin) — but
#     gateway's nginx.conf forwards `Host: $host`, and nginx's $host strips
#     the port, so that fallback would compute `http://127.0.0.1` (implicit
#     port 80, nothing listening there) instead of `http://127.0.0.1:8642`,
#     and the callback redirect would never reach anything. Setting
#     publicBaseUrl explicitly skips that derivation entirely.
# stack_manager.rs always writes concrete values for both into the generated
# .env (CI_PORTAL_URL is the operator-overridable input; APP_BASE_URL is
# always http://127.0.0.1:<GATEWAY_PORT>, since that's the one address this
# app is guaranteed to actually be reachable at).
#
# OAUTH_CALLBACK_URL is where a service (Google and the others) sends the
# person back after they connect it with their own OAuth app. Before any
# compose file set it, the api built it from APP_PUBLIC_URL, which nothing
# sets, so on Desktop the OAuth Setup dialog asked people to register
# "undefined/oauth/callback" and the redirect_uri sent to the provider was the
# same, which every provider refuses. The gateway serves /oauth/callback, so
# it is APP_BASE_URL plus that path. OPENID_CALLBACK_URL does the same for the
# OpenID services (Steam). docker-compose.production.yml now sets both the
# same way. `:+` leaves both empty (and the api on its own fallbacks in
# connections/utils/callbackUrls.ts) if APP_BASE_URL is ever unset.
#
# ./desktop-app holds the presence file the app keeps up to date while it runs
# (src-tauri/src/presence.rs). The containers outlive the app, and when the app
# was what served their model, chat, search and summaries stop with it. The api
# reads the file (DESKTOP_APP_PRESENCE_FILE) so the web app and MCP can say
# that Memory Desktop is closed instead of only that the model is unreachable.
# A relative source resolves against the compose directory, where the app
# creates the folder before the first `up`. Read-only: nothing in the stack
# writes it. The folder rather than the file, because the app replaces the file
# by renaming over it and a single-file bind mount would keep the old inode.
services:
  api:
    image: ghcr.io/companionintelligence/companion/api:${CI_SERVER_IMAGE_TAG}
    volumes:
      - ./desktop-app:/run/ci-desktop-app:ro
    environment:
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://hub.ci.computer}
      APP_BASE_URL: ${APP_BASE_URL:-}
      OAUTH_CALLBACK_URL: ${APP_BASE_URL:+${APP_BASE_URL}/oauth/callback}
      OPENID_CALLBACK_URL: ${APP_BASE_URL:+${APP_BASE_URL}/openid/callback}
      DESKTOP_APP_PRESENCE_FILE: /run/ci-desktop-app/presence.json
  worker:
    image: ghcr.io/companionintelligence/companion/api:${CI_SERVER_IMAGE_TAG}
  migrate-database:
    image: ghcr.io/companionintelligence/companion/api:${CI_SERVER_IMAGE_TAG}
  database:
    image: ghcr.io/companionintelligence/companion/database:${CI_SERVER_IMAGE_TAG}
  gateway:
    image: ghcr.io/companionintelligence/companion/gateway:${CI_SERVER_IMAGE_TAG}
    # Loopback only. docker-compose.production.yml publishes `8642:8642` with
    # no host address, which Docker binds on every interface (and on Linux its
    # own iptables rules skip ufw), so anyone on the same Wi-Fi could reach the
    # sign-in and sign-up pages, and before the owner's first sign-in could
    # claim the appliance. The shell only ever talks to 127.0.0.1:8642
    # (APP_BASE_URL, the health probe, the webview), and nothing pairs with a
    # desktop appliance over the LAN, so nothing needs the wider bind.
    #
    # `!override`, not a plain `ports:`: compose merges list-valued keys across
    # -f files by concatenation, so a plain entry here would ADD a loopback
    # mapping beside production's all-interfaces one instead of replacing it.
    # scripts/dev-stack/composeExposure.test.ts renders the three files and
    # checks the result.
    ports: !override
      - 127.0.0.1:8642:8642
    # The DNS-rebinding guard (infrastructure/gateway/entrypoint.sh). Loopback is
    # not enough on its own: a page on any site can point its own name at
    # 127.0.0.1 and then reach this gateway same-origin under that name, and
    # before the owner's first sign-in it could claim the appliance. With a list
    # set, IP addresses, localhost names and single-label names pass and every
    # other Host gets 421.
    environment:
      GATEWAY_ALLOWED_HOSTS: localhost
  object-store:
    image: ghcr.io/companionintelligence/companion/object-store:${CI_SERVER_IMAGE_TAG}
  summary-service:
    image: ghcr.io/companionintelligence/companion/summary-service:${CI_SERVER_IMAGE_TAG}
    # The model this app runs (or the user's own Ollama) answers on the host's
    # port 11434, which the api reaches through its OLLAMA_HOST default.
    # docker-compose.production.yml hands the summary service an empty
    # LLM_API_BASE unless something sets one. This app only writes one on the
    # Apple on-device branch. Summary images up to 2026.11.11 took that
    # empty value as their endpoint, so every summary failed with "Connection
    # error.". Newer ones read it as unset, but CI_SERVER_IMAGE_TAG can pin an
    # older release, so the default stays here too. Keep it equal to
    # DEFAULT_LLM_API_BASE in backend/apps/summary/src/ci/summary/config.py.
    environment:
      LLM_API_BASE: ${LLM_API_BASE:-http://host.docker.internal:11434/v1}
  setup-database:
    image: ghcr.io/companionintelligence/companion/setup-database:${CI_SERVER_IMAGE_TAG}
  generate-secrets:
    image: ghcr.io/companionintelligence/companion/setup-secrets:${CI_SERVER_IMAGE_TAG}
  hbpe-service:
    image: ghcr.io/companionintelligence/companion/hbpe-service:${CI_SERVER_IMAGE_TAG}
