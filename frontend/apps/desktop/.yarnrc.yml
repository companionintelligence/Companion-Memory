# @tauri-apps/cli ships prebuilt native binaries as platform-specific
# optionalDependencies (@tauri-apps/cli-darwin-arm64, etc.) — a package shape
# that has a real history of edge cases under Yarn PnP. This package has no
# cross-workspace dependency on anything else in the monorepo (the bootstrap
# page is static; there is no build:web step), so there is no cost to keeping
# it fully standalone with a conventional node_modules tree, same as
# frontend/apps/ios and frontend/apps/android.
nodeLinker: node-modules
