ext {
    // 24, not 23: Play's automatic protection refuses an App Bundle whose minSdk is below 24.
    minSdkVersion = 24
    // Play has required target API 36 of every new upload since 31 Aug 2026.
    // Capacitor 7's documented matrix is still 7.x → 35, but @capacitor/android
    // reads compileSdk/targetSdk from this file, so raising them here is what
    // Play actually inspects. Stay on Capacitor 7 for now: the migration is no
    // longer blocked by @capacitor-community/background-geolocation (dropped
    // 2026-10-26; the LocalHub plugin owns location), it is just not done -- see
    // DELIVERY.md. AGP must be ≥ 8.10.0 or the 36 compileSdk is refused.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxTestRunnerVersion = '1.6.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    // CameraX for @capacitor-mlkit/barcode-scanning, which falls back to 1.1.0 when these
    // are unset. 1.1.0's libimage_processing_util_jni.so is 4 KB aligned, and Play refuses
    // an update whose 64-bit native libraries don't support 16 KB memory pages. CameraX
    // ships 16 KB aligned libraries from 1.4.2.
    androidxCameraCamera2Version = '1.5.3'
    androidxCameraCoreVersion = '1.5.3'
    androidxCameraLifecycleVersion = '1.5.3'
    androidxCameraViewVersion = '1.5.3'
}
