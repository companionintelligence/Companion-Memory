// Kotlin (coroutine-based server start/stop lifecycle) needs its own Gradle plugin
// bootstrap here, same as @ci/capacitor-local-llm's android/build.gradle -- see that
// file's comment for why this lives in a per-subproject buildscript block (a plain local
// `def`, not `ext.kotlin_version`) instead of a value shared via the project `ext` scope.
// This module has no dependency with local-llm's Kotlin-metadata-version constraint, so
// it just tracks a current stable Kotlin release rather than pinning to match it.
ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.0'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.2.1'
    androidxTestRunnerVersion = project.hasProperty('androidxTestRunnerVersion') ? rootProject.ext.androidxTestRunnerVersion : '1.6.1'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.6.1'
}

buildscript {
    def localHubKotlinVersion = '2.0.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$localHubKotlinVersion"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.companionintelligence.localhub"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            // Robolectric reads the merged manifest through the
            // com/android/tools/test_config.properties AGP only writes when this is on.
            includeAndroidResources = true
            // Left off deliberately: a stray android.* call from a JVM test must fail loudly
            // rather than quietly return 0/null/false and make a test pass for the wrong reason.
            returnDefaultValues = false
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // Chrome Auth Tab (androidx.browser 1.9+). 1.10.0 is the current stable.
    // Sign-in must not run in the app WebView; Auth Tab is the in-app sheet
    // Play and Chrome document as the match for iOS ASWebAuthenticationSession.
    implementation 'androidx.browser:browser:1.10.0'

    // Small, well-understood embedded HTTP server. Bound explicitly to 127.0.0.1 in
    // LocalHubServer -- see that file. Phase 2/3 (outbox, local inference) plug into the
    // same NanoHTTPD router; no additional server dependency is expected later.
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Encryption at rest for the capture outbox (OutboxStore.kt). This is the CURRENT Zetetic
    // artifact (package net.zetetic.database.sqlcipher), NOT the legacy
    // net.zetetic:android-database-sqlcipher (package net.sqlcipher.database) -- the two must
    // never be mixed.
    //
    // Version choice, verified against Maven Central at implementation time rather than
    // assumed: SECURITY_ARCHITECTURE.md §2.1 named "4.6.x" and told us to re-pin. 4.14.1 is
    // the newest release whose bundled libsqlcipher.so is 16 KB-page aligned (all four ABIs
    // report p_align 0x4000, which targetSdk 35 requires) and whose native payload is ~2 MB
    // per ABI instead of the 4.6-4.13 line's ~4-7 MB. It pulls androidx.sqlite 2.6.2
    // (minCompileSdk 34, minimum AGP 8.1.1 -- both satisfied here) where 4.13 and earlier
    // pulled 2.2.0.
    implementation 'net.zetetic:sqlcipher-android:4.14.1'
    // Declared explicitly because sqlcipher publishes androidx.sqlite as a *runtime*-only
    // dependency, while net.zetetic...SQLiteOpenHelper implements androidx's
    // SupportSQLiteOpenHelper -- so the supertype has to be on the compile classpath too.
    implementation 'androidx.sqlite:sqlite:2.6.2'

    testImplementation "junit:junit:$junitVersion"

    // JVM router tests for LocalHubServer (src/test). Robolectric is here for exactly one
    // reason: LocalHubServer speaks org.json, and AGP's mockable android.jar stubs every
    // org.json method into a "not mocked" thrower. Robolectric's sandbox supplies the real AOSP
    // implementation -- the same one the device runs, which matters because the router's strict
    // typing (`opt("ok") as? Boolean`) is exactly where org.json implementations differ.
    // 4.14.1 is the first line that supports compileSdk/targetSdk 35.
    //
    // NanoHTTPD and capacitor-android are already on this classpath: testImplementation
    // extends implementation. The key/shredder tests need nothing beyond junit.
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    // Declared explicitly, not left to arrive transitively. `testInstrumentationRunner`
    // above names androidx.test.runner.AndroidJUnitRunner, so this artifact has to be on
    // the androidTest runtime classpath or every instrumented run in this module dies with
    // "Unable to find instrumentation info". Until this line existed it resolved only as a
    // transitive of espresso-core, which no test here imports -- dropping that unused
    // dependency would have silently taken the runner with it.
    androidTestImplementation "androidx.test:runner:$androidxTestRunnerVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
