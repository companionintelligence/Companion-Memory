// Unlike the other plugins wired into this app (all plain Java), this module is Kotlin
// (LiteRT-LM's API and WorkManager's CoroutineWorker are both Kotlin-first), so — unlike
// its siblings — it has to bootstrap the Kotlin Gradle plugin itself. This mirrors the
// per-subproject `ext { ... }` / `buildscript { ... }` pattern already used by
// `@capacitor/android`'s own build.gradle (each subproject's buildscript is independent
// under this project's classic, non-version-catalog multi-project setup), so it does not
// affect any other module's Kotlin version.
ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.0'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.2.1'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.6.1'
}

buildscript {
    // litertlm-android's own Kotlin metadata requires a matching compiler line: 0.11.0 needed
    // 2.2 ("metadata is 2.3.0, expected version is 2.0.0" on 2.0.21), and 0.18.0 needs 2.4
    // ("metadata is 2.4.0, expected version is 2.2.0" on 2.2.21). Uses a plain local `def` — not
    // `ext.kotlin_version` — because unqualified `ext` writes inside a nested
    // `buildscript {}` block resolve against the shared project-ext scope in this
    // Gradle/Groovy setup, so an `ext.` write here was observed leaking across
    // sibling subprojects (verified: it silently pinned this module to whatever
    // `kotlin_version` another plugin's buildscript block last set, ignoring this
    // literal). A local `def` is scoped strictly to this closure.
    def localLlmKotlinVersion = '2.4.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$localLlmKotlinVersion"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.companionintelligence.localllm"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        // Must not exceed the app's own minSdk (24) — the manifest merger rejects a
        // library requiring a higher floor than its consumer. isAvailable() gates the
        // real API-26+ requirement (Build.VERSION_CODES.O) at runtime instead; every
        // API genuinely introduced in 26 (NotificationChannel) is itself guarded by an
        // explicit SDK_INT check at the call site (see ModelDownloadWorker).
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    testOptions {
        unitTests {
            // Robolectric locates the merged manifest, resources and assets through the
            // `com.android.tools.test_config.properties` file AGP only emits when this is on.
            // Deliberately NOT paired with `returnDefaultValues = true`: Robolectric already
            // supplies real implementations (org.json in particular), and default-returning
            // stubs would let a test pass against framework calls that never actually ran.
            includeAndroidResources = true
        }
        unitTests.all {
            // Gradle forks the test JVM with a 512m default heap; Robolectric's
            // android-all-instrumented jar for API 35 plus WorkManager's Room database do not
            // fit in it. (org.gradle.jvmargs in gradle.properties governs the daemon, not this.)
            maxHeapSize = '2g'
        }
    }
}

// LocalLlmModelsTest reads ../src/definitions.ts off disk to check that the file the JS
// catalogue downloads is the file this one writes and loads. Gradle cannot see that
// dependency — the file is on no classpath and in no source set — so without declaring it
// the test task stays UP-TO-DATE through exactly the TypeScript edit it exists to catch.
tasks.withType(Test).configureEach {
    inputs.file("${projectDir}/../src/definitions.ts").withPropertyName('localLlmPluginDefinitions')
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    // On-device inference (LiteRT-LM). Group com.google.ai.edge.* resolves via google().
    // Pinned to 0.18.0 to match iOS's vendored CLiteRTLM.xcframework (ios/App/Frameworks/
    // fetch-clitertlm-xcframework.sh); the two are bumped together. 0.18.0's AAR carries
    // Kotlin 2.4 metadata (hence localLlmKotlinVersion above) and declares minSdk 24 (hence
    // the app's minSdkVersion). Against 0.14.0 the only source change this module needed was
    // the removed `Capabilities` probe, now `ModelInfo.from(path)` / `LlmCapability`.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'

    // The phone's own search over its PowerSync replica (intents/LocalSearchStore): the replica is
    // SQLCipher-encrypted by @capacitor-community/sqlite, whose key sits in an AndroidX
    // EncryptedSharedPreferences file. Both pins match that plugin's android/build.gradle exactly,
    // so the two modules share one copy of each library in the app.
    implementation 'net.zetetic:sqlcipher-android:4.10.0@aar'
    implementation 'androidx.sqlite:sqlite:2.4.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Resumable foreground download of the (~530 MiB) model file.
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation "junit:junit:$junitVersion"

    // Robolectric is the single load-bearing test dependency here. Every seam worth testing in
    // this module goes through org.json (the intent catalog, the tool descriptions, the MCP
    // frames), which AGP's mockable android.jar stubs to throw on call — Robolectric supplies
    // the real AOSP implementation, the same one that runs on the device, plus Context,
    // NotificationManager and PowerManager. 4.14.1 is the first line with stable API 35 support,
    // matching this module's compileSdk.
    testImplementation 'org.robolectric:robolectric:4.14.1'

    // TestListenableWorkerBuilder, for running ModelDownloadWorker.doWork() off-device. Version
    // must track work-runtime-ktx above exactly: its POM declares work-runtime [2.10.0] as a
    // hard range, so a mismatch fails resolution rather than degrading quietly.
    testImplementation 'androidx.work:work-testing:2.10.0'

    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
