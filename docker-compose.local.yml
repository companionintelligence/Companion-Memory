services:
  application:
    image: nginx:stable
    ports:
      - 8080:80
      - 8443:443
    volumes:
      - ./infrastructure/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl/:/etc/nginx/ssl/:ro
      - ./infrastructure/nginx/public:/usr/share/nginx/html:ro
    networks:
      - ci
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    profiles: [ "local" ]

  #################
  # PORT EXPOSURE #
  #################

  iframely:
    ports:
      - 8061:8061

  minio:
    ports:
      - 9000:9000

  postgres:
    ports:
      - 5432:5432

  temporal:
    ports:
      - 7233:7233

  stt-service:
    ports:
      - 9001:9001

  tts-service:
    ports:
      - 9002:9002

  summary-service:
    ports:
      - 8001:8001
