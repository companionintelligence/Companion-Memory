services:
  application:
    image: nginx:stable
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./infrastructure/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl/:/etc/nginx/ssl/:ro
      - ./infrastructure/nginx/public:/usr/share/nginx/html:ro
    networks:
      - ci
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    profiles: [ "local" ]

  #################
  # PORT EXPOSURE #
  #################

  iframely:
    ports:
      - 8061:8061

  minio:
    ports:
      - 9000:9000

  postgres:
    ports:
      - 5432:5432

  temporal:
    ports:
      - 7233:7233

  stt-service:
    ports:
      - 9001:9001

  tts-service:
    ports:
      - 9002:9002

  summary-service:
    ports:
      - 8001:8001

  hbpe-service:
    build:
      context: ./backend/apps/hbpe
      dockerfile: Dockerfile.local
    image: ci/hbpe-service-local
    pull_policy: build
    environment:
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/companion_intel
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - HBPE_TASK_QUEUE=hbpe
      - MODELS_DIR=/app/models
      - TOKEN_CORPUS_DIR=/app/data/token_corpus
      - HF_HOME=/app/models/hf_cache
      - API_URL=http://application:3000
      - API_JWT_SECRET=${AUTH_JWT_AUTHTOKENSECRET}
    volumes:
      - hbpe-models:/app/models
      - hbpe-corpus:/app/data
    networks:
      - ci
    depends_on:
      - postgres
      - temporal
    restart: unless-stopped
    ports:
      - 8002:8002
    profiles: [ "local" ]
