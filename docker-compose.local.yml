services:
  database:
    environment:
      PASSWORD: ${DATABASE_ADMIN_PASSWORD}
    ports:
      - 5432:5432

  gateway:
    image: nginx:stable
    ports:
      - 8642:8642
    volumes:
      - ./infrastructure/dev-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ci
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      object-store:
        condition: service_healthy
    restart: unless-stopped
    profiles: [ "local" ]

  hbpe-service:
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      API_URL: http://host.docker.internal:3000
      API_JWT_SECRET: ${AUTH_TOKEN_SECRET}
    ports:
      - 8002:8002

  object-store:
    environment:
      USERNAME: ${OBJECT_STORE_USERNAME}
      PASSWORD: ${OBJECT_STORE_PASSWORD}
    ports:
      - 9000:9000

  orchestrator:
    environment:
      DATABASE_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/local.yaml
    volumes:
      - ./infrastructure/orchestrator/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/local.yaml:ro
    ports:
      - 7233:7233

  summary-service:
    ports:
      - 8001:8001
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

  #############
  # EPHEMERAL #
  #############

  setup-database:
    environment:
      ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD}
      COMPANION_PASSWORD: ${DATABASE_PASSWORD}
      ORCHESTRATOR_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}

  setup-orchestrator:
    environment:
      DATABASE_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}

volumes:
  db-data:
    name: ci-server-local-db-data
  object-data:
    name: ci-server-local-object-data
  hbpe-models:
    name: ci-server-local-hbpe-models
  hbpe-corpus:
    name: ci-server-local-hbpe-corpus
