services:
  database:
    environment:
      PASSWORD: ${DATABASE_ADMIN_PASSWORD}
    # Host ports are chosen by scripts/dev-stack.ts: the conventional default
    # when free, else an ephemeral port — so concurrent worktrees never collide.
    # A plain `docker compose up` (no dev-stack) still binds the defaults.
    ports:
      - ${DB_HOST_PORT:-5432}:5432

  hbpe-service:
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      # The host api is reachable from this container at the dev-stack-chosen port.
      API_URL: http://host.docker.internal:${API_HOST_PORT:-3030}
      API_JWT_SECRET: ${AUTH_TOKEN_SECRET}
    ports:
      - ${HBPE_HOST_PORT:-8002}:8002

  object-store:
    environment:
      USERNAME: ${OBJECT_STORE_USERNAME}
      PASSWORD: ${OBJECT_STORE_PASSWORD}
    ports:
      - ${OBJECT_STORE_HOST_PORT:-9000}:9000

  orchestrator:
    environment:
      DATABASE_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/local.yaml
    volumes:
      - ./infrastructure/orchestrator/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/local.yaml:ro
    ports:
      - ${ORCHESTRATOR_HOST_PORT:-7233}:7233

  summary-service:
    ports:
      - ${SUMMARY_HOST_PORT:-8001}:8001
      # Document-parser FastAPI (src.parser). Host 8003 avoids the HBPE service's
      # host 8002 mapping above; in-container it stays on 8002.
      - ${PARSER_HOST_PORT:-8003}:8002
    # Pass the shared LLM config from .env (compose interpolates ${VAR} from the
    # root .env). Done explicitly rather than via env_file so host-oriented vars
    # like DATABASE_HOST=localhost don't leak in and break in-container DB/DNS.
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      LLM_API_BASE: ${LLM_API_BASE:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_DEFAULT_CHAT_MODEL: ${LLM_DEFAULT_CHAT_MODEL:-gemma4:latest}
      # Structured-output strategy: native (Ollama json_schema) | prompted | tool.
      # Flip without a rebuild if a model behaves better in a different mode.
      SUMMARY_OUTPUT_MODE: ${SUMMARY_OUTPUT_MODE:-native}
      SUMMARY_OUTPUT_RETRIES: ${SUMMARY_OUTPUT_RETRIES:-3}

  #############
  # EPHEMERAL #
  #############

  setup-database:
    environment:
      ADMIN_PASSWORD: ${DATABASE_ADMIN_PASSWORD}
      COMPANION_PASSWORD: ${DATABASE_PASSWORD}
      ORCHESTRATOR_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}

  setup-orchestrator:
    environment:
      DATABASE_PASSWORD: ${ORCHESTRATOR_DATABASE_PASSWORD}

volumes:
  db-data:
    name: ${COMPOSE_PROJECT_NAME}-local-db-data
  object-data:
    name: ${COMPOSE_PROJECT_NAME}-local-object-data
  hbpe-models:
    name: ${COMPOSE_PROJECT_NAME}-local-hbpe-models
  hbpe-corpus:
    name: ${COMPOSE_PROJECT_NAME}-local-hbpe-corpus
