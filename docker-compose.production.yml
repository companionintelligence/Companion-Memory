services:
  api:
    image: ci/api
    volumes:
      - secrets:/run/secrets:ro
      # ONE bind mount holding the importer's three working areas — uploads/
      # (staged uploads, TTL'd), inbox/ (the user's drop-in folder), and
      # scratch/ (per-run working trees). Sharing a filesystem is what lets a
      # staged source move into a run's scratch as an atomic rename instead of
      # a copy of a 50GB tree. Bind rather than named volume so a person can
      # actually drop export archives into ./import-work/inbox/ on the host.
      # The API creates inbox/ world-writable with the sticky bit (like /tmp)
      # — on purpose, since the container runs as root and a root-owned 755
      # folder would refuse the desktop user's drag-in; it only ever holds
      # copies the importer consumes. uploads/ stays root-only: nothing lands
      # there except through the API. Operators who put the inbox elsewhere (a
      # NAS) can split the mounts; the importer falls back to copy-then-delete
      # across filesystems.
      - ${CI_IMPORT_WORK_DIR:-./import-work}:/var/lib/ci-import
      # The user's own archives, read-only, as upstream ci-import-tools mounted
      # them: importable in place via the path tools, never modified, never
      # deleted. Point CI_REPO_DIR somewhere else to expose a different folder.
      - ${CI_REPO_DIR:-~/Downloads}:/repo:ro
    environment:
      # This container is the web half; the import worker below consumes the
      # heavy queues. Remove the worker service and set this to `all` to run
      # single-process.
      CI_ROLE: web
      ENABLE_HBPE: ${ENABLE_HBPE:-true}
      # Off /var/tmp deliberately, and load-bearing: scratch must share the
      # inbox's filesystem for the rename above, and living on the mount means
      # an interrupted run's working files survive a container recreate, which
      # is what the resume sweep restarts from.
      CI_IMPORT_SCRATCH_DIR: ${CI_IMPORT_SCRATCH_DIR:-/var/lib/ci-import/scratch}
      # JSON array, not a colon list. /repo is the read-only mount above.
      CI_IMPORT_ROOTS: ${CI_IMPORT_ROOTS:-["/repo"]}
      # Where inbox/ from the mount above lives on the HOST. The API only
      # knows /var/lib/ci-import/inbox, a path inside this container, and that
      # is what the import page and `ci-import inbox` would tell a person to
      # drop files into. Display only — nothing resolves it. Defaults to the
      # mount source; set it explicitly when CI_IMPORT_WORK_DIR is relative and
      # you want the page to show an absolute path.
      CI_IMPORT_INBOX_HOST_DIR: ${CI_IMPORT_INBOX_HOST_DIR:-${CI_IMPORT_WORK_DIR:-./import-work}/inbox}
      # OpenAI-compatible chat backend (Hub-injected on managed deploys). When
      # unset, the API falls back to native Ollama on OLLAMA_HOST.
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DEFAULT_CHAT_MODEL: ${LLM_DEFAULT_CHAT_MODEL:-}
      # Embeddings stay on native Ollama even when chat runs on vLLM/Lemonade;
      # falls back to OLLAMA_HOST when unset.
      OLLAMA_EMBED_HOST: ${OLLAMA_EMBED_HOST:-}
      # Error reporting is opt-out: on wherever a DSN is set. An unset DSN is not
      # a privacy setting, it is no configuration — the API then never contacts
      # Sentry. CI_TELEMETRY=off or CI_LOCAL_ONLY=true disable it even when a
      # DSN is present. See docs/operations/error-reporting.md.
      SENTRY_DSN: ${SENTRY_DSN_API:-}
      SENTRY_ENV: ${SENTRY_ENV:-}
      CI_TELEMETRY: ${CI_TELEMETRY:-}
      CI_LOCAL_ONLY: ${CI_LOCAL_ONLY:-}
      CI_SERVER_VERSION: ${CI_SERVER_VERSION:-}
    networks:
      - ci
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      generate-secrets:
        condition: service_completed_successfully
      migrate-database:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    restart: unless-stopped
    profiles: [ "production" ]

  # The headless half of the api: same image, same code, no HTTP. Consumes the
  # queues and runs the crons marked role: worker — import stage jobs, whose
  # parsers run long synchronous stretches that must not share an event loop
  # with interactive requests. Exactly ONE replica: the import recovery sweep
  # assumes a single worker. No healthcheck on purpose (nothing depends on it,
  # and it serves no port); restart covers crashes, and the staleness sweep
  # resumes whatever a crash interrupted.
  worker:
    image: ci/api
    volumes:
      - secrets:/run/secrets:ro
      # The same working-area mount as the api: the worker MOVES staged
      # sources into run scratch, so both halves must see one filesystem.
      - ${CI_IMPORT_WORK_DIR:-./import-work}:/var/lib/ci-import
    environment:
      CI_ROLE: worker
      CI_IMPORT_SCRATCH_DIR: ${CI_IMPORT_SCRATCH_DIR:-/var/lib/ci-import/scratch}
      SENTRY_DSN: ${SENTRY_DSN_API:-}
      SENTRY_ENV: ${SENTRY_ENV:-}
      CI_TELEMETRY: ${CI_TELEMETRY:-}
      CI_LOCAL_ONLY: ${CI_LOCAL_ONLY:-}
      CI_SERVER_VERSION: ${CI_SERVER_VERSION:-}
    networks:
      - ci
    depends_on:
      generate-secrets:
        condition: service_completed_successfully
      migrate-database:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    restart: unless-stopped
    profiles: [ "production" ]

  database:
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully

  gateway:
    image: ci/gateway
    ports:
      - 8642:8642
    networks:
      - ci
    depends_on:
      api:
        condition: service_healthy
      object-store:
        condition: service_healthy
    restart: unless-stopped
    profiles: [ "production" ]

  hbpe-service:
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video

  object-store:
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully

  summary-service:
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully

  #############
  # EPHEMERAL #
  #############

  generate-secrets:
    image: ci/setup-secrets
    restart: "no"
    volumes:
      - secrets:/run/secrets
    profiles: [ "production" ]

  migrate-database:
    image: ci/api
    volumes:
      - secrets:/run/secrets:ro
    networks:
      - ci
    command: ["yarn", "migrate"]
    restart: "no"
    depends_on:
      generate-secrets:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    profiles: [ "production" ]

  setup-database:
    volumes:
      - secrets:/run/secrets:ro

volumes:
  db-data:
    name: ${COMPOSE_PROJECT_NAME}-production-db-data
  object-data:
    name: ${COMPOSE_PROJECT_NAME}-production-object-data
