services:
  application:
    image: ci/companion-server:latest
    ports:
      - 8642:8642
    volumes:
      - ./infrastructure/nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl/:/etc/nginx/ssl/:ro
    networks:
      - ci
    depends_on:
      - api
    restart: unless-stopped
    profiles: [ "production" ]

  api:
    image: ci/companion-api:latest
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      S3_URL: http://minio:9000
      OLLAMA_HOST: http://host.docker.internal:11434
      STT_HOST: http://stt-service:9001
      TTS_HOST: http://tts-service:9002
      HBPE_HOST: http://hbpe-service:8002
    networks:
      - ci
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: [ "production" ]

  ##############
  # MIGRATIONS #
  ##############

  database-migrations:
    image: ci/companion-api:latest
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - ci
    command: ["yarn", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [ "production" ]

  hbpe-service:
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
