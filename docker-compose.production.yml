services:
  api:
    image: ci/api
    volumes:
      - secrets:/run/secrets:ro
    environment:
      ENABLE_HBPE: ${ENABLE_HBPE:-true}
      # OpenAI-compatible chat backend (Hub-injected on managed deploys). When
      # unset, the API falls back to native Ollama on OLLAMA_HOST.
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DEFAULT_CHAT_MODEL: ${LLM_DEFAULT_CHAT_MODEL:-}
      # Embeddings stay on native Ollama even when chat runs on vLLM/Lemonade;
      # falls back to OLLAMA_HOST when unset.
      OLLAMA_EMBED_HOST: ${OLLAMA_EMBED_HOST:-}
      # Error reporting is opt-out: on wherever a DSN is set. An unset DSN is not
      # a privacy setting, it is no configuration — the API then never contacts
      # Sentry. CI_TELEMETRY=off or CI_LOCAL_ONLY=true disable it even when a
      # DSN is present. See docs/operations/error-reporting.md.
      SENTRY_DSN: ${SENTRY_DSN_API:-}
      SENTRY_ENV: ${SENTRY_ENV:-}
      CI_TELEMETRY: ${CI_TELEMETRY:-}
      CI_LOCAL_ONLY: ${CI_LOCAL_ONLY:-}
      CI_SERVER_VERSION: ${CI_SERVER_VERSION:-}
    networks:
      - ci
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      generate-secrets:
        condition: service_completed_successfully
      migrate-database:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    restart: unless-stopped
    profiles: [ "production" ]

  database:
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully

  gateway:
    image: ci/gateway
    ports:
      - 8642:8642
    networks:
      - ci
    depends_on:
      api:
        condition: service_healthy
      object-store:
        condition: service_healthy
    restart: unless-stopped
    profiles: [ "production" ]

  hbpe-service:
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video

  object-store:
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully

  orchestrator:
    environment:
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/local.yaml
    volumes:
      - secrets:/run/secrets:ro
      - ./infrastructure/orchestrator/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/local.yaml:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully

  summary-service:
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully

  #############
  # EPHEMERAL #
  #############

  generate-secrets:
    image: ci/setup-secrets
    restart: "no"
    volumes:
      - secrets:/run/secrets
    profiles: [ "production" ]

  migrate-database:
    image: ci/api
    volumes:
      - secrets:/run/secrets:ro
    networks:
      - ci
    command: ["yarn", "migrate"]
    restart: "no"
    depends_on:
      generate-secrets:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    profiles: [ "production" ]

  setup-database:
    volumes:
      - secrets:/run/secrets:ro

  setup-orchestrator:
    volumes:
      - secrets:/run/secrets:ro

volumes:
  db-data:
    name: ${COMPOSE_PROJECT_NAME}-production-db-data
  object-data:
    name: ${COMPOSE_PROJECT_NAME}-production-object-data
