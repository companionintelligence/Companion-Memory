[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-companion-memory"
version = "0.1.0"
description = "Hermes memory-provider plugin backed by the Companion Intelligence server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "Companion Intelligence" }
]
dependencies = [
  "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[tool.setuptools]
packages = ["companion_memory"]

[tool.setuptools.package-data]
companion_memory = ["plugin.yaml"]
