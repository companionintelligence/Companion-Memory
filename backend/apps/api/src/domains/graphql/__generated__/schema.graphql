type Query {
  action(id: ID!): ActionType
  actions(after: String, before: String, first: Int, last: Int): ActionConnection!

  """
  Precomputed activity counts per local calendar day, with day boundaries in the user profile timezone. Eventually consistent: refreshed from the source tables every 15 minutes. When filters are supplied, counts reflect the same Memory explorer constraints as the search results.
  """
  activityTimeline(
    """Inclusive last day, yyyy-MM-dd"""
    end: String!

    """
    Optional Memory explorer filters (entity types, tags, who/where/how, search query)
    """
    filters: ActivityTimelineFiltersInput

    """Inclusive first day, yyyy-MM-dd"""
    start: String!
  ): [ActivityBucketType!]!
  answer(id: ID!): AnswerType
  answers(after: String, before: String, first: Int, last: Int): AnswerConnection!
  browserActivities(after: String, before: String, first: Int, last: Int): BrowserActivityConnection!
  browserActivity(id: ID!): BrowserActivityType
  communication(id: ID!): CommunicationType
  communications(after: String, before: String, first: Int, last: Int): CommunicationConnection!
  concept(id: ID!): ConceptType
  concepts(after: String, before: String, first: Int, last: Int): ConceptConnection!
  connection(id: ID!): ConnectionType
  connectionSyncJob(id: ID!): ConnectionSyncJobType
  connectionSyncJobs(after: String, before: String, connectionId: ID, endpointName: String, first: Int, last: Int, type: String): ConnectionSyncJobConnection!
  connections(after: String, before: String, first: Int, last: Int): ConnectionConnection!
  content(id: ID!): ContentType
  contents(after: String, before: String, first: Int, last: Int): ContentConnection!

  """
  Fetch HBPE renewal predictions: periodic behaviors coming due or overdue
  """
  dueForecast: DueForecastType
  event(id: ID!): EventType

  """
  Distinct data sources / connectors (event.source_system) present for the user.
  """
  eventSources: [String!]!

  """Distinct event types ("how things happened") present for the user."""
  eventTypes: [String!]!
  events(after: String, before: String, first: Int, last: Int): EventConnection!

  """
  Events overlapping [from, to) — calendar read path. Excludes cancelled/no-show; keeps tentative. STOPGAP: excludes browser_activity source rows until schedule event policy is defined.
  """
  eventsInRange(from: DateTime!, to: DateTime!): [EventType!]!

  """Get actions for the feed, prioritizing unseen actions"""
  feedActions(limit: Int! = 5): [ActionType!]!
  file(id: ID!): FileType
  files(after: String, before: String, first: Int, last: Int): FileConnection!

  """Fetch the HBPE day-ahead forecast histogram"""
  forecast(horizon: String = "24h"): ForecastType

  """
  User knowledge graph (entities + relationships). Preferred over REST /api/graph/*.
  """
  graph(entityType: String, limit: Int = 200): GraphType!
  item(id: ID!): ItemType
  items(after: String, before: String, first: Int, last: Int): ItemConnection!
  knownPlaceCandidates: [KnownPlaceCandidateType!]!
  knownPlaces(kind: String): [KnownPlaceType!]!
  me: UserType
  node(id: ID!): Node
  note(id: ID!): NoteType
  notes(after: String, before: String, first: Int, last: Int): NoteConnection!
  oAuthCallbackUrl: String!
  pairingStatus(pairingToken: String!, pollKey: String!): PairingStatusPayload!
  people(after: String, before: String, first: Int, last: Int, query: String): PersonConnection!
  person(id: ID!): PersonType
  personDuplicates(limit: Int): [PersonDuplicateGroupType!]!
  place(id: ID!): PlaceType
  places(after: String, before: String, first: Int, last: Int, query: String): PlaceConnection!
  placesNear(latitude: Float!, limit: Int, longitude: Float!, radiusMeters: Float): [PlaceNearType!]!
  provider(id: ID!): ProviderType
  providers(after: String, before: String, first: Int, last: Int): ProviderConnection!
  question(id: ID!): QuestionType
  questions(after: String, before: String, first: Int, last: Int): QuestionConnection!
  relationship(id: ID!): RelationshipType
  relationships(after: String, before: String, first: Int, last: Int): RelationshipConnection!
  savedSearch(id: ID!): SavedSearchType
  savedSearches(after: String, before: String, first: Int, last: Int): SavedSearchConnection!

  """Open schedule candidates whose plausible window overlaps [from, to)"""
  scheduleCandidates(from: DateTime!, to: DateTime!): [ScheduleCandidateType!]!
  search(input: SearchInput!): SearchResultConnection!
  sharedSavedSearch(token: String!): SavedSearchType
  summaries(after: String, before: String, first: Int, last: Int): SummaryConnection!
  summary(id: ID!): SummaryType
  tag(id: ID!): TagType
  tags(after: String, before: String, first: Int, last: Int): TagConnection!
  task(id: ID!): TaskType
  tasks(
    after: String
    before: String
    first: Int
    last: Int

    """User-local calendar date, `YYYY-MM-DD`."""
    scheduledFor: String
    status: [TaskStatus!]
  ): TaskConnection!
  thread(id: ID!): ThreadType
  threads(after: String, before: String, first: Int, last: Int): ThreadConnection!

  """
