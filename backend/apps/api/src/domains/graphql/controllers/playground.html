<!DOCTYPE html>
<html lang="en">
  <head>
    <title>GraphiQL - Companion Intelligence</title>
    <link rel="stylesheet" href="https://unpkg.com/graphiql@2.4.5/graphiql.min.css" />
  </head>
  <body style="margin:0; height:100vh;">
    <div id="graphiql" style="height: 100vh;"></div>
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/graphiql@2.4.5/graphiql.min.js"></script>
    <script>
      const fetcher = async (graphQLParams) => {
        const token = localStorage.getItem('accessToken');
        const res = await fetch('/api/graphql', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token && { Authorization: `Bearer ${token}` }),
          },
          body: JSON.stringify(graphQLParams),
        });

        return res.json();
      };

      if (!window.GraphiQL) {
        console.error('GraphiQL not loaded');
      } else {
        const root = ReactDOM.createRoot(document.getElementById('graphiql'));
        root.render(React.createElement(GraphiQL, { fetcher }));
      }
    </script>
  </body>
</html>
