# Shared life-domain taxonomy for HBPE labeling and summary-service prompts.
# Consumed by ci-hbpe and ci-summary.

[project]
name = "ci-prompt-taxonomy"
version = "0.1.0"
description = "Life-domain categories and keywords as directional prompt guidance"
requires-python = ">=3.11"
dependencies = []

[tool.uv.build-backend]
module-name = "ci.prompt_taxonomy"
namespace = true

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
