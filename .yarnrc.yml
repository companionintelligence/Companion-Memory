enableGlobalCache: false
# Dependency install scripts (preinstall/install/postinstall, and the implicit
# node-gyp build of a package with a binding.gyp) do not run unless the package
# is listed with `built: true` under `dependenciesMeta` in the root
# package.json. A new dependency that needs its build step will warn with
# "lists build scripts, but all build scripts have been disabled" (YN0004) and
# must be added there. The API Dockerfile's `yarn workspaces focus` reads this
# file and that list too. The standalone installs in
# frontend/apps/{ios,android,desktop} also inherit this setting but read
# `dependenciesMeta` from their own package.json; none of their lockfiles has a
# package with an install script today.
enableScripts: false
nodeLinker: pnp

npmScopes:
  companionintelligence:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAuthToken: "${NODE_AUTH_TOKEN:-}"

packageExtensions:
  "typedoc@*":
    dependencies:
      "typedoc-plugin-markdown": "*"
  # jest's bin/jest.js requires import-local directly, but it's declared on
  # jest-cli — under PnP's strict resolution that require is unsound and throws.
  # Surface it on jest so `yarn jest` resolves it (no-op for non-PnP installs).
  "jest@*":
    dependencies:
      "import-local": "*"
  # @sentry/node-core declares @opentelemetry/core and
  # @opentelemetry/exporter-trace-otlp-http as peers, but its only ancestor
  # (@sentry/node) ships neither — so under PnP's strict resolution merely
  # importing @sentry/nestjs throws at require time. Provide them on the
  # ancestor. No-op for node-modules installs (the Docker image).
  "@sentry/node@*":
    dependencies:
      "@opentelemetry/core": "*"
      "@opentelemetry/exporter-trace-otlp-http": "*"
  # @powersync/capacitor imports @capacitor/core but only declares
  # @capacitor-community/sqlite / @powersync/web as peers. Under PnP that
  # import is unresolvable from its unplugged location, which breaks the
  # Capacitor web production build.
  "@powersync/capacitor@*":
    dependencies:
      "@capacitor/core": "^7.0.0"
  # @nestjs/platform-express@11.2.8 requires rxjs (multer/multer/multer.utils.js)
  # but declares it nowhere, neither as a dependency nor as a peer. Under PnP's
  # strict resolution that makes every import of the package throw "tried to
  # access rxjs, but it isn't declared in its dependencies". A peer, not a
  # dependency: it must resolve to the app's own rxjs, the one @nestjs/core's
  # Observables come from, rather than to a second copy. 11.2.2-11.2.7 do not
  # have the require; no-op for node-modules installs (the Docker image).
  "@nestjs/platform-express@*":
    peerDependencies:
      rxjs: "*"
