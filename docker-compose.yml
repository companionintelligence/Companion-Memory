services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: ci/postgres
    pull_policy: build
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: companion_intel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - web
    restart: unless-stopped
    profiles: [ "all", "infra" ]

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - 9000:9000
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    networks:
      - web
    command: server /data
    profiles: [ "all", "infra" ]

  stt-service:
    build:
      context: ./backend/apps/stt
      dockerfile: Dockerfile
    image: ci/stt-service
    container_name: stt-service
    ports:
      - 9001:9001
    volumes:
      - stt-service-models:/app/models
      - stt-service-cache:/root/.cache
    environment:
      - PYTHONPATH=/app
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    networks:
      - web
    restart: unless-stopped
    profiles: [ "all", "local", "infra", "staging" ]

  tts-service:
    build:
      context: ./backend/apps/tts
      dockerfile: Dockerfile
    image: ci/tts-service
    container_name: tts-service
    ports:
      - 9002:9002
    volumes:
      - tts-service-models:/app/models
      - tts-service-cache:/root/.cache
    environment:
      - PYTHONPATH=/app
      - VOICE_MODEL=${VOICE_MODEL:-vllm-higgs}
    networks:
      - web
    restart: unless-stopped
    profiles: [ "all", "local", "infra", "staging" ]

  webserver:
    image: nginx:stable
    container_name: webserver
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./infrastructure/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl/:/etc/nginx/ssl/:ro
    networks:
      - web
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles: [ "all", "local" ]

  ci-api:
    image: ci/api:latest
    container_name: ci-api
    environment:
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
      AUTH_SESSION_PEPPER: ${AUTH_SESSION_PEPPER}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      OLLAMA_HOST: ${OLLAMA_HOST}
    networks:
      - web
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles: [ "all", "staging" ]

  higgs-audio-vllm:
    image: bosonai/higgs-audio-vllm:latest
    container_name: higgs-audio-vllm
    ports:
      - 8000:8000
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --served-model-name "higgs-audio-v2-generation-3B-base"
      --model "bosonai/higgs-audio-v2-generation-3B-base"
      --audio-tokenizer-type "bosonai/higgs-audio-v2-tokenizer"
      --limit-mm-per-prompt audio=50
      --max-model-len 8192
      --port 8000
      --gpu-memory-utilization 0.8
      --disable-mm-preprocessor-cache
    networks:
      - web
    profiles: [ "all", "staging" ]

  staging-webserver:
    image: ci/nginx
    container_name: staging-webserver
    ports:
      - 8642:8642
      - 8643:8643
    volumes:
      - ./infrastructure/nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl/:/etc/nginx/ssl/:ro
    networks:
      - web
    profiles: [ "all", "staging" ]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - 3000:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - open-webui:/app/backend/data
    profiles: [ "all" ]

volumes:
  postgres-data:
  minio-data:
  open-webui:
  stt-service-models:
  stt-service-cache:
  tts-service-models:
  tts-service-cache:

networks:
  web:
