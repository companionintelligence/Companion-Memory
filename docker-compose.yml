services:
  database:
    image: ci/database
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - ci
    restart: unless-stopped
    # Docker's json-file driver is unbounded by default, and an appliance that
    # nobody prunes fills its disk with container logs long before it fills it
    # with data. 10MB x 3 rotated files is enough history to diagnose a crash
    # loop and caps the whole stack at well under a gigabyte. Every
    # long-running service below carries the same block, and the staging and
    # production overrides repeat it for api/worker/gateway, which have no base
    # definition here to inherit it from.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # -U is required: pg_isready otherwise defaults the role to $USER (root
      # in this image), and every 5s probe logs a FATAL "role root does not
      # exist". The probe still passed, but the noise buries real errors.
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: [ "local", "staging", "production" ]

  hbpe-service:
    image: ci/hbpe-service
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - hbpe-models:/app/models
      - hbpe-corpus:/app/data
    environment:
      # Error reporting is opt-out: on wherever a DSN is set. An unset DSN means
      # there is nothing configured, so the service never
      # contacts Sentry. CI_TELEMETRY=off or CI_LOCAL_ONLY=true disable it even
      # when a DSN is present. See docs/operations/error-reporting.md.
      SENTRY_DSN: ${SENTRY_DSN_HBPE:-}
      SENTRY_ENV: ${SENTRY_ENV:-}
      CI_TELEMETRY: ${CI_TELEMETRY:-}
      CI_LOCAL_ONLY: ${CI_LOCAL_ONLY:-}
      CI_SERVER_VERSION: ${CI_SERVER_VERSION:-}
      # Cluster naming uses the Hub chat endpoint (Qwen3-8B via vLLM) when set.
      # GGUF 0.8B is the fallback if these are empty.
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DEFAULT_CHAT_MODEL: ${LLM_DEFAULT_CHAT_MODEL:-}
      API_URL: ${API_URL:-http://api:3030}
    networks:
      - ci
    depends_on:
      database:
        condition: service_healthy
      setup-database:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # A ceiling, not a reservation. This process holds torch, ONNX Runtime and
    # a llama.cpp GGUF labeler at once, and an unbounded OOM here takes the
    # whole box down with it — including `database`, which is the one service
    # whose death loses data. Deliberately generous: nothing has measured
    # HBPE's real peak RSS (docs/operations/gpu-model-residency.md measures GPU
    # residency, not host memory), and a limit that kills a legitimate training
    # run is worse than no limit at all. Set HBPE_MEM_LIMIT to tighten it on a
    # small appliance once a real figure exists.
    #
    # `mem_limit`, not `deploy.resources.limits.memory`: these files carry no
    # `version:` key and are driven by the Compose v2 CLI outside swarm, where
    # `mem_limit` is honoured unconditionally and `deploy:` is not.
    mem_limit: ${HBPE_MEM_LIMIT:-24g}
    profiles: [ "local", "staging", "production" ]

  object-store:
    image: ci/object-store
    volumes:
      - object-data:/data/objects
    networks:
      - ci
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: [ "local", "staging", "production" ]

  summary-service:
    image: ci/summary-service
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # Opt-out error reporting; see the note on hbpe-service above.
      SENTRY_DSN: ${SENTRY_DSN_SUMMARY:-}
      SENTRY_ENV: ${SENTRY_ENV:-}
      CI_TELEMETRY: ${CI_TELEMETRY:-}
      CI_LOCAL_ONLY: ${CI_LOCAL_ONLY:-}
      CI_SERVER_VERSION: ${CI_SERVER_VERSION:-}
    networks:
      - ci
    depends_on:
      database:
        condition: service_healthy
      setup-database:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Same rationale as hbpe-service's limit above, smaller number: this
    # sidecar holds the document parser and short LLM requests, not model
    # weights. Also unmeasured — raise SUMMARY_MEM_LIMIT if a large PDF parse
    # starts getting OOM-killed.
    mem_limit: ${SUMMARY_MEM_LIMIT:-8g}
    profiles: [ "local", "staging", "production" ]

  # NOTE: summary-service and hbpe-service declare
  # `setup-database: service_completed_successfully` above. Two reasons, and the
  # second is not obvious:
  #
  #   1. Correctness — both connect as `companion`, the role setup-database
  #      creates along with the database and its extensions. Waiting only on
  #      `database: service_healthy` races that.
  #   2. `up --wait` — compose treats a service that exits as a failure unless
  #      something depends on it with service_completed_successfully. Until
  #      powersync left the "local" profile it was the only such dependent, so
  #      dropping it made `--wait` fail on setup-database's clean exit(0) and
  #      tore the whole stack down.

  # Local-first sync engine. Reads CI-Server Postgres via logical replication
  # (the `database` image enables wal_level=logical) and serves filtered, per-user
  # buckets to on-device SQLite. Config in infrastructure/powersync/. See that
  # directory's README for required env (URIs + the base64url JWT secret) and for
  # pinning the image version. NOTE: verify the image tag/command against the
  # PowerSync release you deploy.
  powersync:
    image: journeyapps/powersync-service:1.23.0
    # Wrapped so this service can read the same generated secrets every other
    # service does. The image's own entrypoint is `node service/lib/entry.js`;
    # it is re-exec'd verbatim below, so this only adds environment.
    #
    # Without the wrapper the PS_* defaults underneath interpolate
    # POWERSYNC_DATABASE_PASSWORD/DATABASE_PASSWORD out of the compose .env —
    # where they do not live. generate-secrets writes them into the `secrets`
    # volume, so a deployment that never set them by hand got empty passwords
    # and a replicator that could not authenticate.
    #
    # Anything already exported wins (`:-`), so the documented override path of
    # setting PS_REPLICATION_URI/PS_STORAGE_URI/PS_JWT_SECRET_B64URL explicitly
    # — an external database, a managed Postgres — still takes precedence.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -a
        . /run/secrets/.env.secrets
        set +a
        export PS_REPLICATION_URI="${PS_REPLICATION_URI:-postgresql://$${POWERSYNC_DATABASE_USERNAME}:$${POWERSYNC_DATABASE_PASSWORD}@database:5432/$${DATABASE_NAME}}"
        export PS_STORAGE_URI="${PS_STORAGE_URI:-postgresql://$${DATABASE_USERNAME}:$${DATABASE_PASSWORD}@database:5432/$${DATABASE_NAME}}"
        # The service takes the shared HS256 secret base64url-encoded. Derived
        # here, from the one stored value, so the two cannot drift; `tr` does
        # base64 -> base64url and strips the padding the JWKS `k` must not have.
        if [ -z "$${PS_JWT_SECRET_B64URL:-}" ]; then
          PS_JWT_SECRET_B64URL=$$(printf '%s' "$${POWERSYNC_JWT_SECRET}" | base64 | tr -d '\n' | tr '+/' '-_' | tr -d '=')
          export PS_JWT_SECRET_B64URL
        fi
        exec node service/lib/entry.js start -r unified
    volumes:
      - ./infrastructure/powersync:/config:ro
      # Read-only, and world-readable inside (generate-secrets chmods 644), which
      # is what lets this image's uid 901 source it without running as root.
      - secrets:/run/secrets:ro
    environment:
      # Read by the service directly, unlike the PS_* vars the wrapper above
      # exports. Those three are substituted into powersync.yaml via its `!env`
      # tag, which rejects any name not starting with `PS_` — renaming them
      # breaks startup (exit 150). This one is not an `!env` reference, so it
      # needs no prefix.
      #
      # The two URIs the wrapper builds deliberately use different roles.
      # Replication connects as `powersync`, which setup-database gives the
      # REPLICATION attribute and SELECT on the replicated tables — nothing more.
      # Storage connects as the app role, because the service creates and
      # migrates its own `powersync` schema for bucket storage, which a
      # read-only role cannot do.
      - POWERSYNC_CONFIG_PATH=/config/powersync.yaml
    networks:
      - ci
    depends_on:
      database:
        condition: service_healthy
      # Creates the replication role and the publication the replicator reads.
      # Starting first means a crash-loop until the replicator's next retry.
      setup-database:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Deliberately NOT in "local" — but no longer because the client is missing.
    # That half has shipped: PowerSyncProvider mounts unconditionally in the web
    # app, and the Android shell links @powersync/capacitor and drives a real
    # native ci-powersyncSQLite.db. Driven end to end against this stack, a
    # capture through POST /api/files/upload reaches ps_data__files on an
    # emulator in seconds.
    #
    # What still stops a `local` client is server wiring, in two places:
    #   - POWERSYNC_URL / POWERSYNC_JWT_SECRET reach the `api` service from NO
    #     compose file, so /api/powersync/token is a permanent 503 and no client
    #     can fetch credentials (PowerSyncTokenService throws unless both are
    #     set). setup-secrets generates POWERSYNC_DATABASE_PASSWORD but never a
    #     JWT secret, so there is nothing to point them at either.
    #   - this service publishes no port and has no gateway route, so nothing
    #     off the compose network can reach :8080 anyway.
    # Running it in `local` before those land would still only crash-loop on a
    # missing password and hold a replication slot for a reader that cannot
    # authenticate. Add "local" once the two bullets above are fixed.
    profiles: [ "staging", "production" ]

  #############
  # EPHEMERAL #
  #############

  setup-database:
    image: ci/setup-database
    networks:
      - ci
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    profiles: [ "local", "staging", "production" ]

  ##############################
  # THIRD-PARTY MANAGEMENT UIs #
  ##############################

  #########
  # TOOLS #
  #########

  dbconnstr:
    image: alpine
    volumes:
      - secrets:/run/secrets:ro
    entrypoint:
      - sh
      - -c
      - |
        set -a
        source /run/secrets/.env.secrets 2>/dev/null
        set +a
        echo "postgresql://$${DATABASE_USERNAME}:$${DATABASE_PASSWORD}@localhost:5432/$${DATABASE_NAME}"
    profiles: [ "tooling" ]

  dbproxy:
    image: alpine/socat
    command: TCP-LISTEN:5432,fork,reuseaddr TCP:database:5432
    ports:
      - 5432:5432
    networks:
      - ci
    profiles: [ "tooling" ]

volumes:
  db-data:
  object-data:
  secrets:
  hbpe-models:
  hbpe-corpus:

networks:
  ci:
