services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: ci/postgres
    pull_policy: build
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: companion_intel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - web
    restart: unless-stopped
    profiles: [ "all", "infra" ]

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - 9000:9000
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    networks:
      - web
    command: server /data
    profiles: [ "all", "infra" ]

  webserver:
    image: nginx:stable
    container_name: webserver
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./infrastructure/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl/:/etc/nginx/ssl/:ro
    networks:
      - web
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles: [ "all", "local" ]

  ci-api:
    image: ci/api:latest
    container_name: ci-api
    environment:
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
      AUTH_SESSION_PEPPER: ${AUTH_SESSION_PEPPER}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      OLLAMA_HOST: http://host.docker.internal:11434
      AI_IMAGE_GENERATION_HOST: http://ai-image-generation:7860
    networks:
      - web
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles: [ "all", "staging" ]
    depends_on:
      - ai-image-generation

  staging-webserver:
    image: ci/nginx
    container_name: staging-webserver
    ports:
      - 8642:8642
    volumes:
      - ./infrastructure/nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl/:/etc/nginx/ssl/:ro
    networks:
      - web
    profiles: [ "all", "staging" ]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - 3000:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - open-webui:/app/backend/data
    profiles: [ "all" ]

  ai-image-generation:
    build:
      context: ./docker/ai-image-generation
      dockerfile: Dockerfile
    image: ci/ai-image-generation
    container_name: ai-image-generation
    restart: unless-stopped
    ports:
      - 7860:7860
    environment:
      - TORCH_DEVICE=auto  # Will auto-detect GPU/CPU
      - MODEL_CACHE_DIR=/app/models
      - MAX_MODELS_IN_MEMORY=2
    volumes:
      - ai-models:/app/models
      - ai-outputs:/app/outputs
    networks:
      - web
    profiles: [ "all", "ai" ]
    # GPU support is optional - comment out if no GPU available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  postgres-data:
  minio-data:
  open-webui:
  ai-models:
  ai-outputs:

networks:
  web:
