services:
  database:
    image: ci/database
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - ci
    restart: unless-stopped
    healthcheck:
      # -U is required: pg_isready otherwise defaults the role to $USER (root
      # in this image), and every 5s probe logs a FATAL "role root does not
      # exist". The probe still passed, but the noise buries real errors.
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: [ "local", "staging", "production" ]

  hbpe-service:
    image: ci/hbpe-service
    volumes:
      - hbpe-models:/app/models
      - hbpe-corpus:/app/data
    environment:
      # Error reporting is opt-out: on wherever a DSN is set. An unset DSN means
      # there is nothing configured, so the service never
      # contacts Sentry. CI_TELEMETRY=off or CI_LOCAL_ONLY=true disable it even
      # when a DSN is present. See docs/operations/error-reporting.md.
      SENTRY_DSN: ${SENTRY_DSN_HBPE:-}
      SENTRY_ENV: ${SENTRY_ENV:-}
      CI_TELEMETRY: ${CI_TELEMETRY:-}
      CI_LOCAL_ONLY: ${CI_LOCAL_ONLY:-}
      CI_SERVER_VERSION: ${CI_SERVER_VERSION:-}
    networks:
      - ci
    depends_on:
      database:
        condition: service_healthy
      setup-database:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: [ "local", "staging", "production" ]

  object-store:
    image: ci/object-store
    volumes:
      - object-data:/data/objects
    networks:
      - ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: [ "local", "staging", "production" ]

  summary-service:
    image: ci/summary-service
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # Opt-out error reporting; see the note on hbpe-service above.
      SENTRY_DSN: ${SENTRY_DSN_SUMMARY:-}
      SENTRY_ENV: ${SENTRY_ENV:-}
      CI_TELEMETRY: ${CI_TELEMETRY:-}
      CI_LOCAL_ONLY: ${CI_LOCAL_ONLY:-}
      CI_SERVER_VERSION: ${CI_SERVER_VERSION:-}
    networks:
      - ci
    depends_on:
      database:
        condition: service_healthy
      setup-database:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: [ "local", "staging", "production" ]

  # NOTE: summary-service and hbpe-service declare
  # `setup-database: service_completed_successfully` above. Two reasons, and the
  # second is not obvious:
  #
  #   1. Correctness — both connect as `companion`, the role setup-database
  #      creates along with the database and its extensions. Waiting only on
  #      `database: service_healthy` races that.
  #   2. `up --wait` — compose treats a service that exits as a failure unless
  #      something depends on it with service_completed_successfully. Until
  #      powersync left the "local" profile it was the only such dependent, so
  #      dropping it made `--wait` fail on setup-database's clean exit(0) and
  #      tore the whole stack down.

  # Local-first sync engine. Reads CI-Server Postgres via logical replication
  # (the `database` image enables wal_level=logical) and serves filtered, per-user
  # buckets to on-device SQLite. Config in infrastructure/powersync/. See that
  # directory's README for required env (URIs + the base64url JWT secret) and for
  # pinning the image version. NOTE: verify the image tag/command against the
  # PowerSync release you deploy.
  powersync:
    image: journeyapps/powersync-service:1.23.0
    command: ["start", "-r", "unified"]
    volumes:
      - ./infrastructure/powersync:/config:ro
    environment:
      # POWERSYNC_CONFIG_PATH is read by the service directly. The three PS_* vars
      # are substituted into powersync.yaml via its `!env` tag, which rejects any
      # name not starting with `PS_` — renaming these breaks startup (exit 150).
      # Defaults keep a fresh checkout working without POWERSYNC entries in .env.
      #
      # The two URIs deliberately use different roles. Replication connects as
      # `powersync`, which setup-database gives the REPLICATION attribute and
      # SELECT on the replicated tables — nothing more. Storage connects as
      # `companion`, because the service creates and migrates its own `powersync`
      # schema for bucket storage, which a read-only role cannot do.
      - POWERSYNC_CONFIG_PATH=/config/powersync.yaml
      # The inner default (`:-`) is not cosmetic: compose interpolates every
      # service in the file regardless of the active profile, so without it a
      # local `up` warns about POWERSYNC_DATABASE_PASSWORD for a service that
      # local does not even start. An empty password here fails the same way an
      # unset one does, in staging/production where this service actually runs.
      - PS_REPLICATION_URI=${PS_REPLICATION_URI:-postgresql://powersync:${POWERSYNC_DATABASE_PASSWORD:-}@database:5432/companion}
      - PS_STORAGE_URI=${PS_STORAGE_URI:-postgresql://companion:${DATABASE_PASSWORD}@database:5432/companion}
      - PS_JWT_SECRET_B64URL=${PS_JWT_SECRET_B64URL:-}
    networks:
      - ci
    depends_on:
      database:
        condition: service_healthy
      # Creates the replication role and the publication the replicator reads.
      # Starting first means a crash-loop until the replicator's next retry.
      setup-database:
        condition: service_completed_successfully
    restart: unless-stopped
    # Deliberately NOT in "local". The scaffold (#1582/#1585, 2026-06-28) is
    # server-side only — no client has ever connected, and the README's client
    # phase (@powersync/web, on-device schema, upload connector) is unstarted.
    # Meanwhile the container ran on every `make dev`, crash-looping wherever
    # .env predates the June PowerSync keys, and holding a replication slot for
    # a reader that does not exist. The token endpoint already returns 503 until
    # POWERSYNC_URL is set, so nothing in the app changes by not running it.
    # Add "local" back when the client phase starts.
    profiles: [ "staging", "production" ]

  #############
  # EPHEMERAL #
  #############

  setup-database:
    image: ci/setup-database
    networks:
      - ci
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    profiles: [ "local", "staging", "production" ]

  ##############################
  # THIRD-PARTY MANAGEMENT UIs #
  ##############################

  #########
  # TOOLS #
  #########

  dbconnstr:
    image: alpine
    volumes:
      - secrets:/run/secrets:ro
    entrypoint:
      - sh
      - -c
      - |
        set -a
        source /run/secrets/.env.secrets 2>/dev/null
        set +a
        echo "postgresql://$${DATABASE_USERNAME}:$${DATABASE_PASSWORD}@localhost:5432/$${DATABASE_NAME}"
    profiles: [ "tooling" ]

  dbproxy:
    image: alpine/socat
    command: TCP-LISTEN:5432,fork,reuseaddr TCP:database:5432
    ports:
      - 5432:5432
    networks:
      - ci
    profiles: [ "tooling" ]

volumes:
  db-data:
  object-data:
  secrets:
  hbpe-models:
  hbpe-corpus:

networks:
  ci:
