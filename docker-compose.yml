services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: ci/postgres
    pull_policy: build
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: companion_intel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - web
    restart: unless-stopped
    profiles: [ "all", "infra" ]

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - 9000:9000
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    networks:
      - web
    command: server /data
    restart: unless-stopped
    profiles: [ "all", "infra" ]

  stt-service:
    build:
      context: ./backend/apps/stt
      dockerfile: Dockerfile
    image: ci/stt-service
    pull_policy: build
    container_name: stt-service
    ports:
      - 9001:9001
    volumes:
      - stt-service-models:/app/models
      - stt-service-cache:/root/.cache
    environment:
      - PYTHONPATH=/app
    networks:
      - web
    restart: unless-stopped
    profiles: [ "all", "infra" ]

  tts-service:
    build:
      context: ./backend/apps/tts
      dockerfile: Dockerfile
    image: ci/tts-service
    pull_policy: build
    container_name: tts-service
    ports:
      - 9002:9002
    volumes:
      - tts-service-models:/app/models
      - tts-service-cache:/root/.cache
    environment:
      - PYTHONPATH=/app
    networks:
      - web
    restart: unless-stopped
    profiles: [ "all", "infra" ]

  webserver:
    image: nginx:stable
    container_name: webserver
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./infrastructure/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl/:/etc/nginx/ssl/:ro
      - ./infrastructure/nginx/public:/usr/share/nginx/html:ro
    networks:
      - web
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    profiles: [ "all", "local" ]

  ci-api:
    image: ci/api:latest
    container_name: ci-api
    ports:
      - 3030:3030
    environment:
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
      AUTH_SESSION_PEPPER: ${AUTH_SESSION_PEPPER}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      OLLAMA_HOST: http://host.docker.internal:11434
      STT_HOST: ${STT_HOST}
      TTS_HOST: ${TTS_HOST}
    networks:
      - web
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    profiles: [ "all", "staging" ]

  staging-webserver:
    image: ci/nginx
    container_name: staging-webserver
    ports:
      - 8642:8642
    volumes:
      - ./infrastructure/nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl/:/etc/nginx/ssl/:ro
    networks:
      - web
    depends_on:
      - ci-api
    restart: unless-stopped
    profiles: [ "all", "staging" ]

  iframely:
    image: jolt/iframely:latest
    container_name: iframely
    ports:
      - 8061:8061
    networks:
      - web
    restart: unless-stopped
    profiles: [ "all", "infra" ]
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  postgres-data:
  minio-data:
  stt-service-models:
  stt-service-cache:
  tts-service-models:
  tts-service-cache:

networks:
  web:
