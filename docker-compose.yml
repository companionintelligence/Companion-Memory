services:
  database:
    image: ci/database
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: [ "local", "staging", "production" ]

  hbpe-service:
    image: ci/hbpe-service
    volumes:
      - hbpe-models:/app/models
      - hbpe-corpus:/app/data
    networks:
      - ci
    depends_on:
      database:
        condition: service_healthy
      orchestrator:
        condition: service_started
    restart: unless-stopped
    profiles: [ "local", "staging", "production" ]

  object-store:
    image: ci/object-store
    volumes:
      - object-data:/data/objects
    networks:
      - ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: [ "local", "staging", "production" ]

  orchestrator:
    image: ci/orchestrator
    networks:
      - ci
    depends_on:
      setup-orchestrator:
        condition: service_completed_successfully
      database:
         condition: service_healthy
    restart: unless-stopped
    profiles: [ "local", "staging", "production" ]

  summary-service:
    image: ci/summary-service
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - ci
    depends_on:
      database:
        condition: service_healthy
      orchestrator:
        condition: service_started
    restart: unless-stopped
    profiles: [ "local", "staging", "production" ]

  #############
  # EPHEMERAL #
  #############

  setup-database:
    image: ci/setup-database
    networks:
      - ci
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    profiles: [ "local", "staging", "production" ]

  setup-orchestrator:
    image: ci/setup-orchestrator
    networks:
      - ci
    restart: "no"
    depends_on:
      setup-database:
        condition: service_completed_successfully
      database:
         condition: service_healthy
    profiles: [ "local", "staging", "production" ]

  ##############################
  # THIRD-PARTY MANAGEMENT UIs #
  ##############################

  #########
  # TOOLS #
  #########

  dbconnstr:
    image: alpine
    volumes:
      - secrets:/run/secrets:ro
    entrypoint:
      - sh
      - -c
      - |
        set -a
        source /run/secrets/.env.secrets 2>/dev/null
        set +a
        echo "postgresql://$${DATABASE_USERNAME}:$${DATABASE_PASSWORD}@localhost:5432/$${DATABASE_NAME}"
    profiles: [ "tooling" ]

  dbproxy:
    image: alpine/socat
    command: TCP-LISTEN:5432,fork,reuseaddr TCP:database:5432
    ports:
      - 5432:5432
    networks:
      - ci
    profiles: [ "tooling" ]

  orchestrator-ui:
    image: temporalio/ui:2.31.2
    ports:
      - 8080:8080
    environment:
      - TEMPORAL_ADDRESS=orchestrator:7233
    networks:
      - ci
    restart: unless-stopped
    profiles: [ "tooling" ]

volumes:
  db-data:
  object-data:
  secrets:
  hbpe-models:
  hbpe-corpus:

networks:
  ci:
