services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: ci/postgres
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /home/postgres/pgdata/data
    volumes:
      - postgres-data:/home/postgres/pgdata/data
    networks:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: [ "all", "local", "staging" ]

  migrations:
    image: ci/api:latest
    container_name: migrations
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - web
    command: ["yarn", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [ "all", "staging" ]

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - 9000:9000
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    networks:
      - web
    command: server /data
    restart: unless-stopped
    profiles: [ "all", "local", "staging" ]

  stt-service:
    build:
      context: ./backend/apps/stt
      dockerfile: Dockerfile
    image: ci/stt-service
    container_name: stt-service
    ports:
      - 9001:9001
    volumes:
      - stt-service-models:/app/models
      - stt-service-cache:/root/.cache
    environment:
      - PYTHONPATH=/app
    networks:
      - web
    restart: unless-stopped
    profiles: [ "all", "local", "staging" ]

  tts-service:
    build:
      context: ./backend/apps/tts
      dockerfile: Dockerfile
    image: ci/tts-service
    container_name: tts-service
    ports:
      - 9002:9002
    volumes:
      - tts-service-models:/app/models
      - tts-service-cache:/root/.cache
    environment:
      - PYTHONPATH=/app
    networks:
      - web
    restart: unless-stopped
    profiles: [ "all", "local", "staging" ]

  memory-service:
    build:
      context: ./backend/apps/memory
      dockerfile: Dockerfile
    image: ci/memory-service
    pull_policy: build
    container_name: memory-service
    ports:
      - 8001:8001
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/companion_intel
      - LLM_API_BASE=${LLM_API_BASE:-http://host.docker.internal:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_DEFAULT_CHAT_MODEL=${LLM_DEFAULT_CHAT_MODEL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - web
    depends_on:
      - postgres
    restart: unless-stopped
    profiles: [ "all", "local", "infra" ]

  dev-webserver:
    image: nginx:stable
    container_name: dev-webserver
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./infrastructure/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl/:/etc/nginx/ssl/:ro
      - ./infrastructure/nginx/public:/usr/share/nginx/html:ro
    networks:
      - web
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    profiles: [ "all", "local" ]

  ci-api:
    image: ci/api:latest
    container_name: ci-api
    ports:
      - 3030:3030
    environment:
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
      AUTH_SESSION_PEPPER: ${AUTH_SESSION_PEPPER}
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      OLLAMA_HOST: http://host.docker.internal:11434
      STT_HOST: http://stt-service:9001
      TTS_HOST: http://tts-service:9002
      TMDB_API_KEY: ${TMDB_API_KEY}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    networks:
      - web
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: [ "all", "staging" ]

  staging-webserver:
    image: ci/nginx
    container_name: staging-webserver
    ports:
      - 8642:8642
    volumes:
      - ./infrastructure/nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl/:/etc/nginx/ssl/:ro
    networks:
      - web
    depends_on:
      - ci-api
    restart: unless-stopped
    profiles: [ "all", "staging" ]

  iframely:
    image: jolt/iframely:latest
    container_name: iframely
    ports:
      - 8061:8061
    networks:
      - web
    restart: unless-stopped
    volumes:
      - ./infrastructure/iframely/config.js:/iframely/config.js
    deploy:
      resources:
        limits:
          memory: 4G
    profiles: [ "all", "local", "staging" ]

volumes:
  postgres-data:
  minio-data:
  stt-service-models:
  stt-service-cache:
  tts-service-models:
  tts-service-cache:

networks:
  web:
