services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: ci/postgres
    pull_policy: build
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: companion_intel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - web
    restart: unless-stopped
    profiles: [ "all", "infra" ]

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - 9000:9000
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    networks:
      - web
    command: server /data
    profiles: [ "all", "infra" ]

  webserver:
    image: nginx:stable
    container_name: webserver
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./infrastructure/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl/:/etc/nginx/ssl/:ro
    networks:
      - web
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles: [ "all", "local" ]

  ci-api:
    image: ci/api:latest
    container_name: ci-api
    environment:
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
      AUTH_SESSION_PEPPER: ${AUTH_SESSION_PEPPER}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      OLLAMA_HOST: http://host.docker.internal:11434
    networks:
      - web
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles: [ "all", "staging" ]

  staging-webserver:
    image: ci/nginx
    container_name: staging-webserver
    ports:
      - 8642:8642
    volumes:
      - ./infrastructure/nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl/:/etc/nginx/ssl/:ro
    networks:
      - web
    profiles: [ "all", "staging" ]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - 3000:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - open-webui:/app/backend/data
    profiles: [ "all" ]

  speech-services-stt:
    build:
      context: ./docker/speech-services
      dockerfile: Dockerfile
    image: ci/speech-services
    container_name: speech-services-stt
    ports:
      - 9001:8000
    environment:
      - STT_ENGINE=whisper
      - TTS_ENGINE=mock
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - MODEL_CACHE_DIR=/app/models
    volumes:
      - speech-models:/app/models
    networks:
      - web
    restart: unless-stopped
    profiles: [ "all", "local", "infra" ]

  speech-services-tts:
    build:
      context: ./docker/speech-services
      dockerfile: Dockerfile
    image: ci/speech-services
    container_name: speech-services-tts
    ports:
      - 9002:8000
    environment:
      - STT_ENGINE=mock
      - TTS_ENGINE=piper
      - PIPER_VOICE=en_US-ljspeech-medium
      - MODEL_CACHE_DIR=/app/models
    volumes:
      - speech-models:/app/models
    networks:
      - web
    restart: unless-stopped
    profiles: [ "all", "local", "infra" ]

volumes:
  postgres-data:
  minio-data:
  open-webui:
  speech-models:

networks:
  web:
